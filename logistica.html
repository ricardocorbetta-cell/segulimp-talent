<style>

    --brand:#245B84; --brand-dark:#163C58; --brand-light:#7EC1E0;
    --line:#C7D8E2;
    --good:#3F8F5D; --good-bg:#E6F4EB;
    --mid:#D89B2E; --mid-bg:#FBF1DD;
    --low:#8C97A0; --low-bg:#EEF2F5;
    --bad:#B3372F; --bad-bg:#FBE9E7;

  header .tag{font-size:13.5px; color:var(--ink-soft); margin-top:4px;}
  header .session{margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; font-size:13px; color:var(--ink-soft);}
  header .session #sessionNombre{font-weight:600; color:var(--ink);}
  .link-btn{background:none; border:none; padding:0; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--brand); cursor:pointer; text-decoration:none;}
  .link-btn:hover{color:var(--brand-dark); text-decoration:underline;}
  .hidden{display:none !important;}

  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;}
  .tabs button{padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap;}
  .tabs button:hover{border-color:var(--brand); color:var(--brand-dark);}
  .tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .tabs .n{display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:10px; background:var(--bad); color:#fff; font-size:11.5px; line-height:18px; text-align:center;}
  @media (max-width:700px){ .tabs{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;} .tabs::-webkit-scrollbar{display:none;} }

  h1.titulo{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; color:var(--brand-dark); text-transform:uppercase; margin:0;}

  .muted{color:var(--ink-soft); font-size:12.5px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px;}
  .fila{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

  .grow{flex:1; min-width:0;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:8px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}

  .chip.media{background:var(--mid-bg);} .chip.media::before{background:var(--mid);}
  .chip.alta{background:var(--bad-bg);} .chip.alta::before{background:var(--bad);}
  .chip.azul{background:#E3EFF8;} .chip.azul::before{background:var(--brand);}
  .chip.plano::before{display:none;}

  .btn-primary{padding:10px 16px; border:none; border-radius:8px; background:var(--brand); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:disabled{opacity:.45; cursor:default; background:var(--brand);}
  .btn-ghost{padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn-ghost:hover{border-color:var(--brand); color:var(--brand-dark);}
  .btn-ghost:disabled{opacity:.45; cursor:default;}

  .msg-box.ok{background:var(--good-bg); color:#24573A; border:1px solid #BFE3CC;}
  .msg-box.error{background:var(--bad-bg); color:#8A2C24; border:1px solid #F2C6C0;}
  .msg-box.info{background:#EAF3FA; color:var(--brand-dark); border:1px solid var(--line);}
  .msg-box.aviso{background:var(--mid-bg); color:#6E4A0C; border:1px solid #EED6A6;}

  .form-card .btn-primary{width:100%; margin-top:20px;}
  .msg-error{color:var(--bad); font-size:13px; margin-top:10px; min-height:1em;}
  .campos{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:0 14px;}

  .drop{display:block; border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; background:#fff; cursor:pointer; color:var(--ink-soft);}
  .drop:hover, .drop.sobre{border-color:var(--brand); background:#F3F8FC; color:var(--brand-dark);}

  .mapa{height:420px; border-radius:12px; border:1px solid var(--line); background:var(--paper-2); z-index:0;}
  .mapa.chico{height:300px;}
  .pin{width:28px; height:28px; border-radius:50%; background:var(--brand); color:#fff; font:700 12px/28px Inter,sans-serif; text-align:center; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .pin.entregada{background:var(--good);} .pin.no_entregada{background:var(--bad);} .pin.sin{background:var(--mid);}
  .pin.reprogramada, .pin.cancelada{background:var(--low);}
  .pin.dep{background:var(--brand-dark); border-radius:6px;}
  .pin.camion{background:#0E2436; font-size:15px; line-height:26px;}

  .hojas{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:12px;}
  .hoja{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; font:inherit; color:inherit;}
  .hoja:hover{border-color:var(--brand);}
  .hoja h3{margin:0; font-size:16px;}
  .hoja .d{font-size:12.5px; color:var(--ink-soft); margin:4px 0 10px;}

  /* ===== Repartidor (celular) ===== */
  body.rep .wrap{padding:12px 12px 120px; max-width:640px;}
  body.rep header{margin-bottom:12px; padding-bottom:10px;}
  body.rep header img{height:36px; width:36px;}
  body.rep header .name{font-size:22px;}
  body.rep header .tag{display:none;}
  .parada{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .parada.actual{border:2px solid var(--brand); box-shadow:0 2px 10px rgba(22,60,88,.12);}
  .parada.hecha{opacity:.72;}
  .parada .top{display:flex; gap:10px; align-items:flex-start;}
  .parada .nro{flex:none; width:30px; height:30px; border-radius:50%; background:var(--brand); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .parada.hecha .nro{background:var(--good);} .parada.fallo .nro{background:var(--bad);}
  .parada h3{margin:0; font-size:16px; line-height:1.3;}
  .parada .dir{font-size:14px; color:var(--ink); margin-top:2px;}
  .parada .meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .acciones{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .acciones .btn-primary, .acciones .btn-ghost{min-height:46px; font-size:14px;}
  .acciones .ancho{grid-column:1 / -1;}
  .barra-rep{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; z-index:500;}
  .barra-rep .info{flex:1; font-size:13px; color:var(--ink-soft);}
  .barra-rep .info b{color:var(--ink); font-size:15px;}
  .cola{font-size:12px; font-weight:600; color:#6E4A0C; background:var(--mid-bg); border-radius:8px; padding:4px 8px;}

  .hoja-modal{position:fixed; inset:0; background:rgba(14,36,54,.45); z-index:1000; display:flex; align-items:flex-end; justify-content:center;}
  .hoja-modal .panel{background:var(--card); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
  @media (min-width:700px){ .hoja-modal{align-items:center;} .hoja-modal .panel{border-radius:16px;} }
  .hoja-modal h3{margin:0 0 4px; font-size:18px;}
  .opciones{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
  .opciones button{padding:10px 14px; min-height:44px; border-radius:22px; border:1px solid var(--line); background:#fff; font:600 13.5px Inter,sans-serif; color:var(--ink-soft); cursor:pointer;}
  .opciones button[aria-pressed="true"]{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff;}
  .foto-prev{max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--line); display:block; margin-top:8px;}
  .foto-btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; border:2px dashed var(--brand); border-radius:12px; color:var(--brand-dark); font-weight:600; background:#F3F8FC; cursor:pointer;}

  /* Seguimiento público */
  .seg{max-width:460px; margin:20px auto; text-align:center;}
  .seg .estado{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700; color:var(--brand-dark); text-transform:uppercase; margin:10px 0 4px;}

  @media print{
    body{background:#fff;} header, .tabs, .no-print, .barra-rep{display:none !important;}
    .wrap{padding:0; max-width:none;} .table-wrap{border:none;} .mapa{display:none;}
    .solo-print{display:block !important;}
  }
  .solo-print{display:none;}
</style>
</head>

const TILES = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

// Localidades del Alto Valle y la zona: provincia, para buscar bien la dirección
const LOCALIDADES = {
  'NEUQUEN': 'Neuquén', 'PLOTTIER': 'Neuquén', 'CENTENARIO': 'Neuquén', 'SENILLOSA': 'Neuquén', 'VISTA ALEGRE': 'Neuquén', 'VISTA ALEGRE NORTE': 'Neuquén', 'VISTA ALEGRE SUR': 'Neuquén',

  'CIPOLLETTI': 'Río Negro', 'CINCO SALTOS': 'Río Negro', 'FERNANDEZ ORO': 'Río Negro', 'ALLEN': 'Río Negro', 'GENERAL ROCA': 'Río Negro', 'VILLA REGINA': 'Río Negro',
  'CERVANTES': 'Río Negro', 'INGENIERO HUERGO': 'Río Negro', 'MAINQUE': 'Río Negro', 'CATRIEL': 'Río Negro', 'CAMPO GRANDE': 'Río Negro', 'CONTRALMIRANTE CORDERO': 'Río Negro',
  'BARDA DEL MEDIO': 'Río Negro', 'SARGENTO VIDAL': 'Río Negro', 'CHICHINALES': 'Río Negro', 'GODOY': 'Río Negro', 'CHOELE CHOEL': 'Río Negro', 'BARILOCHE': 'Río Negro'
};
const MOTIVOS = ['Cerrado / no había nadie', 'Rechazó el pedido', 'Falta mercadería', 'Dirección incorrecta', 'No llegamos (queda para otro día)', 'Otro'];
const FORMAS = [['', 'No cobra'], ['efectivo', 'Efectivo'], ['cheque', 'Cheque'], ['transferencia', 'Transferencia']];
const ESTADOS = { pendiente: ['Pendiente', 'azul'], entregada: ['Entregada', 'ok'], no_entregada: ['No entregada', 'alta'], reprogramada: ['Reprogramada', 'plano'], cancelada: ['Cancelada', 'plano'] };
const ESTADOS_HOJA = { armada: ['Armada', 'azul'], en_reparto: ['En reparto', 'media'], terminada: ['Terminada', 'ok'], rendida: ['Rendida', 'plano'] };

const S = {
  perfil: null, gestiona: false, veTodo: false, miRep: null, modo: 'gestion',
  cfg: {}, reps: [], vehs: [], tab: 'dia', fecha: hoyISO(),
  hojas: [], entregas: [], hojaId: null, aviso: null,
  clientes: null, borrador: null, pendientes: null, usuariosRep: null,
  rep: { hojaId: null, verMapa: false }, cola: [], fotos: new Map()
};

// ===== utilidades =====
function $(id){ return document.getElementById(id); }
const content = () => $('content');
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function hoyISO(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function sumarDias(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
function fechaLarga(iso){ const d = new Date(iso + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`; }
function hora(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function pesos(n){ return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR'); }
function num(n){ return Number(n || 0).toLocaleString('es-AR'); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function chip(par){ return `<span class="chip ${par[1]}">${esc(par[0])}</span>`; }
function nombreRep(id){ const r = S.reps.find(x => x.id === id); return r ? r.nombre : '—'; }
function nombreVeh(id){ const v = S.vehs.find(x => x.id === id); return v ? v.nombre + (v.patente ? ' · ' + v.patente : '') : ''; }
function aviso(tipo, html){ S.aviso = { tipo, html }; }
function sacarAviso(){ const a = S.aviso; S.aviso = null; return a ? `<div class="msg-box ${a.tipo}">${a.html}</div>` : ''; }
function errorDe(e){ return esc(e && (e.message || e.error_description || e.error) || String(e)); }
async function q(p){ const r = await p; if(r.error) throw r.error; return r.data; }
async function traerTodo(tabla, cols, orden, filtro){
  const out = [];
  for(let desde = 0; ; desde += 1000){
    let consulta = sb.from(tabla).select(cols).order(orden).range(desde, desde + 999);
    if(filtro) consulta = filtro(consulta);
    const filas = await q(consulta);
    out.push(...filas);
    if(filas.length < 1000) return out;
  }
}

// Localidad: "Localidad: CINCO S" (cortada en la hoja) → CINCO SALTOS
function completarLocalidad(txt){
  const n = norm(txt);
  if(!n) return '';
  if(LOCALIDADES[n]) return n;
  const c = Object.keys(LOCALIDADES).filter(k => k.startsWith(n));
  return c.length ? c.sort((a, b) => a.length - b.length)[0] : n;
}
function locLinda(l){ const n = norm(l); if(!n) return 'Neuquén'; return n.toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase()).replace('Neuquen', 'Neuquén'); }

// ===== WhatsApp =====
// Celulares de la zona: 299 / 298 con o sin 15 → 549 + área + número
function waNumero(tel){
  let d = String(tel || '').replace(/\D/g, '');
  if(!d) return '';
  d = d.replace(/^00/, '');
  if(d.startsWith('54')) d = d.slice(2);
  if(d.startsWith('9') && d.length === 11) d = d.slice(1);
  d = d.replace(/^0/, '');
  if(d.length === 12 && d.slice(3, 5) === '15') d = d.slice(0, 3) + d.slice(5);
  else if(d.length === 12 && d.slice(4, 6) === '15') d = d.slice(0, 4) + d.slice(6);
  if(d.length === 9 && d.startsWith('15')) d = '299' + d.slice(2);
  if(d.length === 7) d = '299' + d;
  return d.length === 10 ? '549' + d : '';
}
function linkSeguimiento(e){ return location.origin + location.pathname + '?seguimiento=' + e.token; }
function waLink(tel, texto){ const n = waNumero(tel); return n ? `https://wa.me/${n}?text=${encodeURIComponent(texto)}` : ''; }

}

// ===== Mapas =====
const mapas = {};
function crearMapa(id, opciones = {}){
  if(mapas[id]){ try{ mapas[id].remove(); } catch(_){} delete mapas[id]; }
  const el = $(id);
  if(!el || !window.L) return null;
  const m = L.map(el, { zoomControl: true, attributionControl: true, ...opciones });
  L.tileLayer(TILES, { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  m.setView([Number(S.cfg.deposito_lat) || -38.9516, Number(S.cfg.deposito_lng) || -68.0591], 12);
  mapas[id] = m;
  return m;
}
function iconoPin(txt, clase){ return L.divIcon({ className: '', html: `<div class="pin ${clase || ''}">${esc(txt)}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }); }
function deposito(){ return { lat: Number(S.cfg.deposito_lat) || -38.9516, lng: Number(S.cfg.deposito_lng) || -68.0591 }; }
function pintarPuntos(m, puntos, { ruta = null, depo = true, camion = null } = {}){
  if(!m) return;
  const capas = [];
  if(depo){ const d = deposito(); capas.push(L.marker([d.lat, d.lng], { icon: iconoPin('S', 'dep'), title: S.cfg.deposito_nombre || 'Depósito' })); }
  for(const p of puntos){
    if(p.lat == null || p.lng == null) continue;
    const mk = L.marker([p.lat, p.lng], { icon: iconoPin(p.etiqueta, p.clase), draggable: !!p.arrastrar, title: p.titulo || '' });
    if(p.popup) mk.bindPopup(p.popup);
    if(p.arrastrar) mk.on('dragend', ev => p.arrastrar(ev.target.getLatLng()));
    capas.push(mk);
  }
  if(camion) capas.push(L.marker([camion.lat, camion.lng], { icon: iconoPin('🚚', 'camion'), title: camion.titulo || 'Repartidor' }).bindPopup(esc(camion.titulo || '')));
  if(ruta && ruta.coordinates) capas.push(L.geoJSON(ruta, { style: { color: '#245B84', weight: 4, opacity: .75 } }));
  const g = L.featureGroup(capas).addTo(m);
  if(capas.length > 1) m.fitBounds(g.getBounds().pad(0.12), { animate: false });
  else if(capas.length === 1 && capas[0].getLatLng) m.setView(capas[0].getLatLng(), 14, { animate: false });
  setTimeout(() => { if(Object.values(mapas).includes(m) && document.body.contains(m.getContainer())) m.invalidateSize(); }, 60);
  return g;
}

// ===== Ubicar direcciones (lo ya ubicado queda guardado; lo demás se busca en OpenStreetMap) =====
function claveDir(dom, loc){
  return (String(dom || '') + '|' + (String(loc || '').trim() || 'neuquen')).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[º°]/g, ' ').replace(/[^a-z0-9|]+/g, ' ');
}
function limpiarDomicilio(dom){
  return String(dom || '')
    .replace(/Localidad:.*$/i, '').replace(/\b(Piso|Dpto|Depto|Of|Oficina|Local)\s*:?\s*\S+/gi, '')
    .replace(/\bN[º°o]\.?\s*/gi, ' ').replace(/\bAV(DA)?\.?\s/gi, 'Avenida ').replace(/\bPTE\.?\s/gi, 'Presidente ')
    .replace(/\bGRAL\.?\s/gi, 'General ').replace(/\bDR\.?\s/gi, 'Doctor ').replace(/\s+/g, ' ').trim();
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
let ultimaBusqueda = 0;
async function buscarDireccion(dom, loc){
  const l = norm(loc) || 'NEUQUEN', prov = LOCALIDADES[l] || 'Neuquén';
  const base = limpiarDomicilio(dom);
  const intentos = [`${base}, ${locLinda(l)}, ${prov}, Argentina`];
  const sinNumero = base.replace(/\s+\d+[A-Z]?$/i, '');
  if(/\d/.test(base) && base.match(/^(.*?)\s+(\d+)/)) intentos.push({ street: base, city: locLinda(l), state: prov });
  for(const it of intentos){
    const pausa = 1100 - (Date.now() - ultimaBusqueda);
    if(pausa > 0) await esperar(pausa);
    ultimaBusqueda = Date.now();
    const p = new URLSearchParams({ format: 'jsonv2', limit: '1', countrycodes: 'ar', viewbox: '-70.6,-37.3,-66.4,-39.7', bounded: '1', 'accept-language': 'es' });
    if(typeof it === 'string') p.set('q', it); else for(const [k, v] of Object.entries(it)) p.set(k, v);
    try{
      const r = await fetch(NOMINATIM + '?' + p.toString(), { headers: { 'Accept': 'application/json' } });
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j[0]) return { lat: Number(j[0].lat), lng: Number(j[0].lon), exacta: /house|building|amenity|shop|office/.test(j[0].type + j[0].category) || j[0].addresstype === 'building' };
    } catch(_){ }
  }
  void sinNumero;
  return null;
}
let dirCache = null;
async function cargarDirecciones(){
  if(dirCache) return dirCache;
  const filas = await traerTodo('log_direcciones', 'clave, lat, lng, verificada, cliente_id', 'clave');
  dirCache = new Map(filas.map(f => [f.clave, f]));
  return dirCache;
}
async function guardarUbicacion(dom, loc, lat, lng, verificada, cliente){
  try{ await q(sb.rpc('log_ubicar', { p_domicilio: dom, p_localidad: loc || null, p_lat: lat, p_lng: lng, p_verificada: !!verificada, p_cliente: cliente || null })); } catch(_){ }
  if(dirCache){ const k = claveDir(dom, loc), v = dirCache.get(k); if(!v || verificada || !v.verificada) dirCache.set(k, { clave: k, lat, lng, verificada: !!verificada || !!(v && v.verificada), cliente_id: cliente }); }
}

// ===== Recorrido (OSRM: orden óptimo desde el depósito y vuelta) =====
async function ordenarRecorrido(paradas){
  const con = paradas.filter(p => p.lat != null && p.lng != null), sin = paradas.filter(p => p.lat == null || p.lng == null);
  if(!con.length) return { orden: paradas, ruta: null, km: null, tiempos: [] };
  const d = deposito();
  const coords = [[d.lng, d.lat], ...con.map(p => [p.lng, p.lat])].map(c => c[0].toFixed(6) + ',' + c[1].toFixed(6)).join(';');
  let j;
  try{
    const r = await fetch(`${OSRM}/trip/v1/driving/${coords}?source=first&roundtrip=true&overview=full&geometries=geojson`);
    j = await r.json();
  } catch(e){ j = null; }
  if(!j || j.code !== 'Ok' || !j.trips || !j.trips[0]){
    // sin servicio: orden por cercanía
    const orden = [], resto = con.slice(); let cur = d;
    while(resto.length){ resto.sort((a, b) => dist(cur, a) - dist(cur, b)); cur = resto.shift(); orden.push(cur); }
    return { orden: orden.concat(sin), ruta: null, km: null, tiempos: orden.map(() => 600), aprox: true };
  }
  const pos = j.waypoints.slice(1).map((w, i) => ({ p: con[i], k: w.waypoint_index }));
  pos.sort((a, b) => a.k - b.k);
  const legs = j.trips[0].legs || [];
  return { orden: pos.map(x => x.p).concat(sin), ruta: j.trips[0].geometry, km: Math.round(j.trips[0].distance / 100) / 10, tiempos: legs.slice(0, con.length).map(l => l.duration) };
}
function dist(a, b){ const dx = (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180), dy = a.lat - b.lat; return dx * dx + dy * dy; }
// Hora estimada de llegada a cada parada: salida + manejo + minutos por parada
function calcularEtas(fecha, inicio, tiempos, n){
  const [hh, mm] = String(S.cfg.hora_salida || '09:00').split(':').map(Number);
  let t = inicio ? new Date(inicio) : new Date(`${fecha}T${String(hh).padStart(2, '0')}:${String(mm || 0).padStart(2, '0')}:00`);
  const parada = (Number(S.cfg.minutos_por_parada) || 10) * 60000, out = [];
  for(let i = 0; i < n; i++){
    t = new Date(t.getTime() + (tiempos[i] != null ? tiempos[i] * 1000 : 600000));
    out.push(t.toISOString());
    t = new Date(t.getTime() + parada);
  }
  return out;
}

// ===== Cola sin señal (IndexedDB) =====
const DB_NOMBRE = 'segulimp-logistica';
function idb(){
  return new Promise((ok, mal) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('cola', { keyPath: 'k' });
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
}
async function colaTodo(){ try{ const db = await idb(); return await new Promise(ok => { const t = db.transaction('cola').objectStore('cola').getAll(); t.onsuccess = () => ok(t.result || []); t.onerror = () => ok([]); }); } catch(_){ return []; } }
async function colaPoner(item){ try{ const db = await idb(); await new Promise(ok => { const t = db.transaction('cola', 'readwrite'); t.objectStore('cola').put(item); t.oncomplete = ok; t.onerror = ok; }); } catch(_){ } }
async function colaSacar(k){ try{ const db = await idb(); await new Promise(ok => { const t = db.transaction('cola', 'readwrite'); t.objectStore('cola').delete(k); t.oncomplete = ok; t.onerror = ok; }); } catch(_){ } }
let enviando = false;
async function enviarCola(){
  if(enviando) return;
  enviando = true;
  try{
    const items = (await colaTodo()).sort((a, b) => a.t - b.t);
    for(const it of items){
      if(!navigator.onLine) break;
      try{
        let foto = it.args.p_foto || null;
        if(it.foto && !foto){
          const blob = await (await fetch(it.foto)).blob();
          const ruta = `${it.hoja}/${it.entrega}-${it.t}.jpg`;
          const up = await sb.storage.from('remitos').upload(ruta, blob, { contentType: 'image/jpeg', upsert: true });
          if(up.error && !/exists|Duplicate/i.test(up.error.message || '')) throw up.error;
          foto = ruta;
          it.args.p_foto = ruta; await colaPoner(it);
        }
        await q(sb.rpc('log_entrega_registrar', { ...it.args, p_foto: foto }));
        await colaSacar(it.k);
      } catch(e){
        if(e && /no es tuya|rendió|inválido|motivo/i.test(e.message || '')){ await colaSacar(it.k); aviso('error', 'No se guardó una entrega: ' + errorDe(e)); }
        else break;   // sin señal o error del servidor: se reintenta después
      }
    }
  } finally {
    enviando = false;
    S.cola = await colaTodo();
    const c = $('colaInfo'); if(c) c.innerHTML = colaTexto();
  }
}
function colaTexto(){ return S.cola.length ? `<span class="cola">${S.cola.length} sin enviar · se mandan con señal</span>` : ''; }
window.addEventListener('online', () => enviarCola());
setInterval(() => { if(S.cola.length) enviarCola(); }, 30000);

// Foto del remito: se achica a 1280 px para que suba rápido con poca señal
function achicarFoto(archivo){
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer la foto.')); };
    img.src = url;
  });
}
async function urlFoto(path){
  if(!path) return '';
  if(S.fotos.has(path)) return S.fotos.get(path);
  try{ const r = await sb.storage.from('remitos').createSignedUrl(path, 3600); const u = r.data && r.data.signedUrl || ''; S.fotos.set(path, u); return u; } catch(_){ return ''; }
}

function renderLogin(mensaje){
  S.perfil = null;
  $('session').classList.add('hidden'); $('tabs').classList.add('hidden');
  content().innerHTML = `
    <form class="form-card" id="formLogin">
      <h2>Ingresar</h2>
      <p class="sub">Usá el mismo usuario y contraseña del Hub.</p>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label for="loginClave">Contraseña</label>
      <input type="password" id="loginClave" autocomplete="current-password" required>
      <button class="btn-primary" type="submit">Ingresar</button>
      <div class="msg-error">${esc(mensaje || '')}</div>
    </form>`;
  $('formLogin').onsubmit = async e => {
    e.preventDefault();
    e.target.querySelector('button').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginClave').value });
    if(error){ renderLogin('Email o contraseña incorrectos.'); return; }

async function iniciar(session){
  let perfil;
  try{ perfil = await q(sb.from('perfiles').select('user_id, email, nombre, roles, activo, debe_cambiar_clave').eq('user_id', session.user.id).maybeSingle()); }
  catch(e){
    const cache = leerCacheRep();
    if(cache){ S.perfil = cache.perfil; Object.assign(S, { cfg: cache.cfg, reps: cache.reps, vehs: cache.vehs, miRep: cache.miRep, hojas: cache.hojas, entregas: cache.entregas, modo: 'rep' }); document.body.classList.add('rep'); renderRep(); return; }
    content().innerHTML = `<div class="msg-box error">No hay conexión: ${errorDe(e)}</div>`; return;
  }
  if(!perfil || !perfil.activo){ await sb.auth.signOut(); renderLogin('Tu usuario no tiene acceso. Consultá con un administrador.'); return; }
  S.perfil = perfil;
  $('session').classList.remove('hidden');
  $('sessionNombre').textContent = perfil.nombre;
  if(perfil.debe_cambiar_clave){ content().innerHTML = `<div class="msg-box info">Antes de seguir tenés que elegir tu contraseña. <a class="link-btn" href="hub.html">Entrá al Hub</a> y volvé a esta herramienta.</div>`; return; }
  const r = perfil.roles;
  S.gestiona = r.includes('administrador') || r.includes('logistica');
  S.veTodo = S.gestiona || r.includes('consulta');
  try{
    const [cfg, reps, vehs] = await Promise.all([
      q(sb.from('log_config').select('clave, valor')),
      q(sb.from('log_repartidores').select('id, nombre, alias, user_id, telefono, vehiculo_id, activo').order('nombre')),
      q(sb.from('log_vehiculos').select('id, nombre, patente, activo').order('nombre'))
    ]);
    S.cfg = Object.fromEntries(cfg.map(c => [c.clave, c.valor])); S.reps = reps; S.vehs = vehs;
  } catch(e){ content().innerHTML = `<div class="msg-box error">No se pudo cargar Logística: ${errorDe(e)}</div>`; return; }
  S.miRep = S.reps.find(x => x.user_id === perfil.user_id && x.activo) || null;
  S.cola = await colaTodo();
  if(!S.veTodo && !S.miRep){
    content().innerHTML = `<div class="msg-box info">Tu usuario no tiene acceso a Logística. Pedile a logística que te vincule como repartidor, o a un administrador el rol Logística.</div>`;
    return;
  }
  S.modo = S.veTodo && !(S.miRep && localStorage.getItem('log_modo') === 'rep') ? 'gestion' : 'rep';
  if(!S.veTodo) S.modo = 'rep';
  arrancarModo();
}
function arrancarModo(){
  document.body.classList.toggle('rep', S.modo === 'rep');
  document.querySelector('header .name').textContent = S.modo === 'rep' ? 'Mi reparto' : 'Logística y Reparto';
  if(S.modo === 'rep'){ $('tabs').classList.add('hidden'); cargarRep(); enviarCola(); }
  else { $('tabs').classList.remove('hidden'); ir(S.tab); }
}

  if(S.gestiona) t.push(['equipo', 'Repartidores y depósito']);

// ===== Día =====
async function cargarDia(fecha){
  const hojas = await q(sb.from('log_hojas').select('*').eq('fecha', fecha).order('id'));
  const ids = hojas.map(h => h.id);
  const entregas = ids.length ? await q(sb.from('log_entregas').select('*').in('hoja_id', ids).order('orden')) : [];
  return { hojas, entregas };
}
function resumenEntregas(lista){
  const c = k => lista.filter(e => e.estado === k).length;
  const activas = lista.filter(e => !['cancelada', 'reprogramada'].includes(e.estado));
  return { total: activas.length, ok: c('entregada'), no: c('no_entregada') + c('reprogramada'), pend: c('pendiente'),
    efectivo: lista.filter(e => e.cobro_forma === 'efectivo').reduce((t, e) => t + Number(e.cobro_importe || 0), 0),
    cobrado: lista.reduce((t, e) => t + Number(e.cobro_importe || 0), 0) };
}
function medidor(r){
  const t = r.total || 1;
  return `<div class="meter"><div class="track"><div class="fill" style="width:${r.ok / t * 100}%"></div><div class="fill no" style="width:${r.no / t * 100}%"></div></div><span class="pct">${r.ok}/${r.total}</span></div>`;
}
async function renderDia(a){

  const r = resumenEntregas(entregas);
  content().innerHTML = a + `
    <div class="fila entre">
      <div class="fila"><button class="btn-ghost small" data-dia="-1" aria-label="Día anterior">‹</button>
        <h1 class="titulo">${f === hoyISO() ? 'Hoy' : ''} ${fechaLarga(f)}</h1>
        <button class="btn-ghost small" data-dia="1" aria-label="Día siguiente">›</button>
        ${f !== hoyISO() ? `<button class="btn-ghost small" data-dia="0">Ir a hoy</button>` : ''}
        <input type="date" id="diaFecha" value="${f}" class="btn-ghost small" style="padding:5px 8px">
      </div>
      ${S.gestiona ? `<button class="btn-primary" data-tab="cargar">+ Cargar hoja de ruta</button>` : ''}
    </div>
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="label">Hojas de ruta</div><div class="value">${hojas.length}</div><div class="note">${hojas.filter(h => h.estado === 'en_reparto').length} en reparto</div></div>

async function reordenarHoja(h, es){
  const vivas = es.filter(e => e.estado === 'pendiente'), hechas = es.filter(e => e.estado !== 'pendiente');
  const r = await ordenarRecorrido(vivas.map(e => ({ ...e })));
  const etas = calcularEtas(h.fecha, h.estado === 'en_reparto' ? new Date().toISOString() : null, r.tiempos, r.orden.length);
  let n = hechas.length;
  const cambios = hechas.sort((x, y) => x.orden - y.orden).map((e, i) => ({ id: e.id, orden: i + 1 }))
    .concat(r.orden.map((e, i) => ({ id: e.id, orden: n + i + 1, eta: e.lat != null ? etas[i] : null })));
  for(const c of cambios) await q(sb.from('log_entregas').update({ orden: c.orden, ...(c.eta !== undefined ? { eta: c.eta } : {}) }).eq('id', c.id));
  await q(sb.from('log_hojas').update({ ruta: r.ruta, km: r.km }).eq('id', h.id));
  return r;
}

// ===== Leer la hoja de ruta del sistema (PDF) =====
function cargarScript(src){ return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }
async function pdfjs(){
  if(!window.pdfjsLib){ await cargarScript(PDFJS + 'pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
  return window.pdfjsLib;
}
async function textosPdf(buf){
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data: buf }).promise, items = [];
  for(let p = 1; p <= doc.numPages; p++){
    const pg = await doc.getPage(p), tc = await pg.getTextContent();
    for(const it of tc.items) if(it.str && it.str.trim()) items.push({ p, x: it.transform[4], y: it.transform[5], w: it.width, s: it.str });
  }
  return items;
}
// Arma las filas a partir de los textos con su posición. Las columnas salen de los títulos (Cliente, Domicilio, Un.Neg., Cant.Op, Notas).
// Cuando el nombre del cliente es largo, el PDF lo pega con el domicilio en un solo texto: se corta donde empieza la columna Domicilio.
function interpretarHoja(items, clientes){
  const busca = re => items.find(i => re.test(i.s.trim()));
  const col = {};
  for(const [k, re] of [['cli', /^Cliente$/i], ['dom', /^Domicilio$/i], ['un', /^Un\.?\s*Neg/i], ['cant', /^Cant/i], ['notas', /^Notas$/i]]){ const t = busca(re); if(t) col[k] = t.x; }
  if(col.cli == null || col.dom == null) throw new Error('No parece una hoja de ruta del sistema: no encuentro las columnas Cliente y Domicilio.');
  const tituloY = busca(/^Cliente$/i).y, pag1 = busca(/^Cliente$/i).p;
  const obsT = busca(/^OBSERVACIONES$/i);
  const valorDe = (re, maxDx = 300) => { const t = busca(re); if(!t) return ''; const v = items.filter(i => i.p === t.p && Math.abs(i.y - t.y) < 2 && i.x > t.x + 1 && i.x < t.x + maxDx && !/^(Patente|Transporte|Fecha:|Empleado:)$/i.test(i.s.trim())).sort((a, b) => a.x - b.x); return v.map(i => i.s.trim()).join(' ').trim(); };
  const fechaTxt = valorDe(/^Fecha:?$/i, 160);
  const m = fechaTxt.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  const fecha = m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
  const empleado = valorDe(/^Empleado:?$/i);
  const transporte = valorDe(/^Transporte$/i, (busca(/^Patente$/i) || { x: 9999 }).x - (busca(/^Transporte$/i) || { x: 0 }).x - 4);
  const patente = valorDe(/^Patente$/i, 200);
  // Los datos no arrancan justo debajo de cada título: la columna Domicilio empieza donde arranca la mayoría de los domicilios
  const cuerpo = items.filter(i => !(i.p === pag1 && i.y >= tituloY - 1) && !(obsT && i.p === obsT.p && i.y <= obsT.y + 1));
  const frec = new Map();
  for(const i of cuerpo) if(i.x > col.cli + 40 && i.x < (col.un ?? col.dom + 200) - 5){ const k = Math.round(i.x); frec.set(k, (frec.get(k) || 0) + 1); }
  const modaDom = [...frec.entries()].sort((a, b) => b[1] - a[1])[0];
  const xDom = modaDom && modaDom[1] >= 2 ? modaDom[0] : col.dom - 20;
  const lim = { dom: xDom - 2, un: (col.un ?? 9999) - 4, cant: (col.cant ?? 9999) - 12, notas: (col.notas ?? 9999) - 30 };
  const nombresN = (clientes || []).map(c => ({ c, n: norm(c.nombre) }));
  const filasPorY = new Map();
  for(const it of items){
    if(it.p === pag1 && it.y >= tituloY - 1) continue;
    if(obsT && it.p === obsT.p && it.y <= obsT.y + 1) continue;
    const k = it.p + ':' + Math.round(it.y);
    let clave = [...filasPorY.keys()].find(x => { const [p, y] = x.split(':').map(Number); return p === it.p && Math.abs(y - it.y) < 2.5; }) || k;
    if(!filasPorY.has(clave)) filasPorY.set(clave, []);
    filasPorY.get(clave).push(it);
  }
  const filas = [];
  const claves = [...filasPorY.keys()].sort((a, b) => { const [pa, ya] = a.split(':').map(Number), [pb, yb] = b.split(':').map(Number); return pa - pb || yb - ya; });
  for(const k of claves){
    const its = filasPorY.get(k).sort((a, b) => a.x - b.x);
    const f = { nro: '', cli: '', dom: '', un: '', cant: '', notas: '' };
    for(const it of its){
      const s = it.s.trim();
      if(it.x < col.cli - 4){ f.nro += s; continue; }
      if(it.x < lim.dom){
        if(it.x + it.w > lim.dom + 6 && s.length > 3){ const [a, b] = partir(s, it, lim.dom, nombresN); f.cli += ' ' + a; f.dom += ' ' + b; }
        else f.cli += ' ' + s;
        continue;
      }
      if(it.x < lim.un) f.dom += ' ' + s;
      else if(it.x < lim.cant) f.un += ' ' + s;
      else if(it.x < lim.notas) f.cant += ' ' + s;
      else f.notas += ' ' + s;
    }
    for(const c in f) f[c] = f[c].replace(/\s+/g, ' ').trim();
    if(!f.cli || !/^\d+$/.test(f.nro)) continue;
    let dom = f.dom, loc = '';
    const ml = dom.match(/Localidad:\s*(.*)$/i);
    if(ml){ loc = completarLocalidad(ml[1]); dom = dom.slice(0, ml.index).trim(); }
    const cli = buscarCliente(f.cli, nombresN);
    if(!loc && cli && cli.localidad && LOCALIDADES[norm(cli.localidad)]) loc = norm(cli.localidad);
    filas.push({ nro: f.nro, cliente_nombre: cli ? cli.nombre : f.cli, cliente_hoja: f.cli, cliente_id: cli ? cli.id : null, telefono: cli ? cli.telefono || '' : '',
      domicilio: dom, localidad: loc || 'NEUQUEN', cant_op: Math.max(1, parseInt(f.cant, 10) || 1), unidad_negocio: f.un || null, notas: f.notas || '' });
  }
  return { fecha, empleado, transporte, patente, filas };
}
function partir(s, it, xCorte, nombresN){
  const prop = Math.max(1, Math.min(s.length - 1, Math.round(s.length * (xCorte - it.x) / it.w)));
  const espacios = []; for(let i = 1; i < s.length; i++) if(s[i] === ' ') espacios.push(i);
  if(!espacios.length) return [s.slice(0, prop), s.slice(prop)];
  const conCliente = espacios.filter(i => { const a = norm(s.slice(0, i)); return a.length >= 6 && nombresN.some(x => x.n.startsWith(a)); });
  const cand = conCliente.length ? conCliente : espacios;
  const i = cand.reduce((b, x) => Math.abs(x - prop) < Math.abs(b - prop) ? x : b, cand[0]);
  return [s.slice(0, i).trim(), s.slice(i).trim()];
}
function buscarCliente(nombre, nombresN){
  const n = norm(nombre), sinPref = norm(nombre.replace(/^\([A-Z]\)\s*/, ''));
  if(!n || !nombresN.length) return null;
  let c = nombresN.find(x => x.n === n) || nombresN.find(x => x.n === sinPref);
  if(c) return c.c;
  const pref = nombresN.filter(x => n.length >= 8 && (x.n.startsWith(n) || x.n.startsWith(sinPref)));
  if(pref.length) return pref.sort((a, b) => a.n.length - b.n.length)[0].c;
  return null;
}

// ===== Cargar hoja (PDF o a mano): borrador → ubicar → ordenar → guardar =====
let pidiendoClientes = null;
function asegurarClientes(){
  if(S.clientes) return Promise.resolve(S.clientes);
  if(!pidiendoClientes) pidiendoClientes = (async () => {
    const out = [];
    for(let d = 0; d < 50000; d += 1000){ const f = await q(sb.rpc('log_clientes').range(d, d + 999)); out.push(...f); if(f.length < 1000) break; }
    S.clientes = out;
    return out;
  })().finally(() => { pidiendoClientes = null; });
  return pidiendoClientes;
}
function repPorNombre(nombre){
  const n = norm(nombre);
  if(!n) return null;
  return S.reps.find(r => norm(r.nombre) === n || (r.alias || []).some(a => norm(a) === n)) || null;
}

function textoUbicacion(b){
  const con = b.filas.filter(f => f.lat != null).length, total = b.filas.length;
  if(b.ubicando) return `Ubicando direcciones en el mapa… ${con} de ${total}.`;
  return con === total ? `Las ${total} direcciones están ubicadas. Revisalas en el mapa.` : `${con} de ${total} ubicadas. ${total - con} sin ubicar: marcalas en el mapa o corregí la dirección.`;
}
function filaBorrador(f, i){
  const est = f.lat == null ? ['Sin ubicar', 'media'] : (f.ubic === 'verificada' ? ['Confirmada', 'ok'] : (f.ubic === 'guardada' ? ['Ya conocida', 'ok'] : ['Aproximada', 'azul']));
  return `<tr data-fila="${i}">
    <td data-label="N°"><input class="corto" data-campo="nro" value="${esc(f.nro)}"></td>
    <td data-label="Cliente"><input data-campo="cliente_nombre" list="dlClientes" value="${esc(f.cliente_nombre)}">${f.cliente_id ? '' : '<div class="muted">No está en la cartera</div>'}</td>
    <td data-label="Domicilio"><input data-campo="domicilio" value="${esc(f.domicilio)}"></td>
    <td data-label="Localidad"><input data-campo="localidad" list="dlLocalidades" value="${esc(locLinda(f.localidad))}"></td>
    <td data-label="Comprobantes" class="num"><input class="corto" type="number" min="1" data-campo="cant_op" value="${f.cant_op}"></td>
    <td data-label="Notas"><input data-campo="notas" value="${esc(f.notas || '')}"></td>
    <td data-label="Ubicación">${chip(est)}${f.lat == null ? ` <button class="btn-ghost small" data-marcar="${i}">Marcar</button>` : ''}</td>
    <td><button class="btn-ghost small peligro" data-quitar-fila="${i}" aria-label="Quitar">✕</button></td></tr>`;
}
function pintarMapaBorrador(){
  const b = S.borrador; if(!b || !$('mapaBorrador')) return;
  const m = crearMapa('mapaBorrador');
  pintarPuntos(m, b.filas.map((f, i) => ({ lat: f.lat, lng: f.lng, etiqueta: f.nro || i + 1, clase: f.lat == null ? 'sin' : '', titulo: f.cliente_nombre,
    popup: `<b>${esc(f.cliente_nombre)}</b><br>${esc(f.domicilio)}`, arrastrar: ll => { f.lat = ll.lat; f.lng = ll.lng; f.ubic = 'verificada'; f.mover = true; actualizarFilaBorrador(i); } })));
  m.on('click', ev => {
    if(S.marcando == null) return;
    const f = b.filas[S.marcando]; if(!f) return;
    f.lat = ev.latlng.lat; f.lng = ev.latlng.lng; f.ubic = 'verificada'; f.mover = true;
    S.marcando = null; $('mapaBorrador').style.cursor = '';
    renderCargar('');
  });
}
function actualizarFilaBorrador(i){
  const tr = document.querySelector(`#tablaBorrador tr[data-fila="${i}"]`);
  if(tr) tr.outerHTML = filaBorrador(S.borrador.filas[i], i);
  const u = $('ubicEstado'); if(u) u.textContent = textoUbicacion(S.borrador);
}
async function ubicarBorrador(){
  const b = S.borrador; if(!b) return;
  const dirs = await cargarDirecciones().catch(() => new Map());
  for(const f of b.filas){
    if(f.lat != null) continue;
    const c = dirs.get(claveDir(f.domicilio, f.localidad));
    if(c){ f.lat = c.lat; f.lng = c.lng; f.ubic = c.verificada ? 'verificada' : 'guardada'; }
  }
  b.ubicando = true;
  if(S.tab === 'cargar') renderCargar('');
  for(let i = 0; i < b.filas.length; i++){
    if(S.borrador !== b) return;
    const f = b.filas[i];
    if(f.lat != null || !f.domicilio) continue;
    const r = await buscarDireccion(f.domicilio, f.localidad);
    if(S.borrador !== b) return;
    if(r){ f.lat = r.lat; f.lng = r.lng; f.ubic = 'buscada'; f.mover = true; }
    actualizarFilaBorrador(i);
  }
  b.ubicando = false;
  if(S.tab === 'cargar' && S.borrador === b){ const btn = $('btnGuardarHoja'); if(btn) btn.disabled = false; const u = $('ubicEstado'); if(u) u.textContent = textoUbicacion(b); pintarMapaBorrador(); }
}
async function revisarExistente(){
  const b = S.borrador; S.hojaExistente = null;
  if(!b || !b.fecha || !b.repartidor_id || b.repartidor_id === 'nuevo') return;
  const h = await q(sb.from('log_hojas').select('id, estado').eq('fecha', b.fecha).eq('repartidor_id', b.repartidor_id).neq('estado', 'rendida').limit(1));
  if(h[0]){ const n = await sb.from('log_entregas').select('id', { count: 'exact', head: true }).eq('hoja_id', h[0].id); S.hojaExistente = { ...h[0], n: n.count || 0 }; }
}
async function leerArchivos(archivos){
  const est = $('cargaEstado');
  if(est) est.innerHTML = `<p class="sub">Leyendo ${archivos.length === 1 ? 'la hoja' : archivos.length + ' hojas'}…</p>`;
  try{ await asegurarClientes(); } catch(_){ S.clientes = []; }
  const leidas = [];
  for(const f of archivos){
    try{
      const items = await textosPdf(await f.arrayBuffer());
      const h = interpretarHoja(items, S.clientes);
      if(!h.filas.length) throw new Error('no encontré entregas en la hoja');
      leidas.push({ ...h, archivo: f.name });
    } catch(e){ if(est) est.innerHTML += `<div class="msg-box error">${esc(f.name)}: ${errorDe(e)}</div>`; }
  }
  if(!leidas.length) return;
  const [primera, ...resto] = leidas;
  abrirBorrador(primera, resto);
}
function abrirBorrador(h, cola){
  const rep = repPorNombre(h.empleado), veh = h.patente ? S.vehs.find(v => norm(v.patente) === norm(h.patente)) : null;
  S.borrador = { origen: h.filas ? 'pdf' : 'manual', archivo: h.archivo || null, empleado: h.empleado || '', transporte: h.transporte || '', patente: h.patente || '',
    fecha: h.fecha || hoyISO(), repartidor_id: rep ? rep.id : (h.empleado ? 'nuevo' : ''), vehiculo_id: veh ? veh.id : (rep && rep.vehiculo_id) || '',
    observaciones: '', filas: (h.filas || []).map(f => ({ ...f })), cola: cola || [] };
  revisarExistente().then(() => { if(S.tab === 'cargar') renderCargar(''); });
  S.tab = 'cargar'; pintarTabs(); renderCargar('');
  ubicarBorrador();
}
function leerBorradorDePantalla(){
  const b = S.borrador; if(!b) return;
  if($('bFecha')) b.fecha = $('bFecha').value;
  if($('bRep')) b.repartidor_id = $('bRep').value;
  if($('bVeh')) b.vehiculo_id = $('bVeh').value;
  if($('bObs')) b.observaciones = $('bObs').value;
}
function cambioFilaBorrador(input){
  const tr = input.closest('tr[data-fila]'), b = S.borrador; if(!tr || !b) return;
  const f = b.filas[Number(tr.dataset.fila)], campo = input.dataset.campo; if(!f) return;
  let v = input.value;
  if(campo === 'cant_op') v = Math.max(1, parseInt(v, 10) || 1);
  if(campo === 'localidad') v = completarLocalidad(v) || 'NEUQUEN';
  const antes = f[campo]; f[campo] = v;
  if(campo === 'cliente_nombre'){
    const c = (S.clientes || []).find(x => x.nombre === v) || buscarCliente(v, (S.clientes || []).map(c => ({ c, n: norm(c.nombre) })));
    f.cliente_id = c ? c.id : null; if(c){ f.cliente_nombre = c.nombre; f.telefono = c.telefono || f.telefono || ''; if(!f.domicilio) autocompletarDomicilio(f); }
    actualizarFilaBorrador(Number(tr.dataset.fila));
  }
  if((campo === 'domicilio' || campo === 'localidad') && antes !== v){
    f.lat = null; f.lng = null; f.ubic = null;
    const i = Number(tr.dataset.fila);
    cargarDirecciones().then(async dirs => {
      const c = dirs.get(claveDir(f.domicilio, f.localidad));
      if(c){ f.lat = c.lat; f.lng = c.lng; f.ubic = c.verificada ? 'verificada' : 'guardada'; }
      else { const r = await buscarDireccion(f.domicilio, f.localidad); if(r){ f.lat = r.lat; f.lng = r.lng; f.ubic = 'buscada'; f.mover = true; } }
      actualizarFilaBorrador(i); pintarMapaBorrador();
    });
  }
}
async function autocompletarDomicilio(f){
  try{
    const ult = await q(sb.from('log_entregas').select('domicilio, localidad, lat, lng, telefono').eq('cliente_id', f.cliente_id).order('id', { ascending: false }).limit(1));
    if(ult[0] && !f.domicilio){ Object.assign(f, { domicilio: ult[0].domicilio, localidad: ult[0].localidad || 'NEUQUEN', lat: ult[0].lat, lng: ult[0].lng, ubic: 'guardada', telefono: f.telefono || ult[0].telefono || '' }); renderCargar(''); }
  } catch(_){ }
}
async function guardarBorrador(){
  leerBorradorDePantalla();
  const b = S.borrador, est = $('guardarEstado'), btn = $('btnGuardarHoja');
  if(!b.fecha){ est.textContent = 'Elegí la fecha.'; return; }
  if(!b.repartidor_id){ est.textContent = 'Elegí el repartidor.'; return; }
  const filas = b.filas.filter(f => f.cliente_nombre.trim());
  if(!filas.length){ est.textContent = 'No hay entregas para guardar.'; return; }
  btn.disabled = true; est.textContent = 'Ordenando el recorrido…';
  try{
    let repId = b.repartidor_id;
    if(repId === 'nuevo'){
      const nombre = b.empleado.split(',').map(x => x.trim()).reverse().join(' ').toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());
      const r = await q(sb.from('log_repartidores').insert({ nombre, alias: [b.empleado] }).select().single());
      S.reps.push(r); repId = r.id;
    } else repId = Number(repId);
    const rep = S.reps.find(r => r.id === repId);
    if(rep && b.empleado && !repPorNombre(b.empleado)){ const alias = [...new Set([...(rep.alias || []), b.empleado])]; await q(sb.from('log_repartidores').update({ alias }).eq('id', repId)); rep.alias = alias; }
    for(const f of filas) if(f.lat != null && f.mover) await guardarUbicacion(f.domicilio, f.localidad, f.lat, f.lng, f.ubic === 'verificada', f.cliente_id);
    let hoja = (await q(sb.from('log_hojas').select('*').eq('fecha', b.fecha).eq('repartidor_id', repId).neq('estado', 'rendida').limit(1)))[0];
    if(!hoja) hoja = await q(sb.from('log_hojas').insert({ fecha: b.fecha, repartidor_id: repId, vehiculo_id: b.vehiculo_id ? Number(b.vehiculo_id) : null, origen: b.origen, archivo: b.archivo, observaciones: b.observaciones || null }).select().single());
    else if(b.observaciones || b.archivo) await q(sb.from('log_hojas').update({ observaciones: [hoja.observaciones, b.observaciones].filter(Boolean).join(' · ') || null, archivo: [hoja.archivo, b.archivo].filter(Boolean).join(', ') || null, vehiculo_id: hoja.vehiculo_id || (b.vehiculo_id ? Number(b.vehiculo_id) : null) }).eq('id', hoja.id));
    const previas = await q(sb.from('log_entregas').select('orden').eq('hoja_id', hoja.id));
    const base = previas.reduce((m, x) => Math.max(m, x.orden), 0);
    await q(sb.from('log_entregas').insert(filas.map((f, i) => ({ hoja_id: hoja.id, orden: base + i + 1, nro: f.nro || null, cliente_id: f.cliente_id, cliente_nombre: f.cliente_nombre.trim(),
      domicilio: f.domicilio.trim(), localidad: f.localidad || null, lat: f.lat, lng: f.lng, cant_op: f.cant_op, unidad_negocio: f.unidad_negocio || null, notas: f.notas || null,
      telefono: f.telefono || null, franja: f.franja || null }))));
    const es = await q(sb.from('log_entregas').select('*').eq('hoja_id', hoja.id).order('orden'));
    const r = await reordenarHoja(hoja, es);
    const sigue = b.cola && b.cola.length ? b.cola : null;
    S.borrador = null; S.hojaExistente = null;
    aviso('ok', `Hoja guardada: ${filas.length} ${filas.length === 1 ? 'entrega' : 'entregas'}${r.km ? `, ${num(r.km)} km de recorrido` : ''}.${r.aprox ? ' El servicio de rutas no respondió: el orden es por cercanía, podés volver a ordenarla después.' : ''}${sigue ? ` Quedan ${sigue.length} para revisar.` : ''}`);
    if(sigue){ const [p, ...resto] = sigue; abrirBorrador(p, resto); return; }
    abrirHoja(hoja.id);
  } catch(e){ btn.disabled = false; est.innerHTML = `<span style="color:var(--bad)">No se pudo guardar: ${errorDe(e)}</span>`; }
}

async function moverEntregas(ids){
  const fecha = $('mvFecha').value, rep = Number($('mvRep').value);
  if(!fecha || !rep){ $('mErr').textContent = 'Elegí día y repartidor.'; return; }
  try{
    let h = (await q(sb.from('log_hojas').select('*').eq('fecha', fecha).eq('repartidor_id', rep).in('estado', ['armada', 'en_reparto']).limit(1)))[0];
    if(!h) h = await q(sb.from('log_hojas').insert({ fecha, repartidor_id: rep, vehiculo_id: (S.reps.find(r => r.id === rep) || {}).vehiculo_id || null, origen: 'manual' }).select().single());
    const previas = await q(sb.from('log_entregas').select('orden').eq('hoja_id', h.id));
    let orden = previas.reduce((m, x) => Math.max(m, x.orden), 0);
    const origen = await q(sb.from('log_entregas').select('*').in('id', ids));
    for(const e of origen){
      if(e.estado === 'pendiente'){ await q(sb.from('log_entregas').update({ hoja_id: h.id, orden: ++orden, eta: null }).eq('id', e.id)); }
      else {
        await q(sb.from('log_entregas').insert({ hoja_id: h.id, orden: ++orden, nro: e.nro, cliente_id: e.cliente_id, cliente_nombre: e.cliente_nombre, domicilio: e.domicilio, localidad: e.localidad,
          lat: e.lat, lng: e.lng, cant_op: e.cant_op, unidad_negocio: e.unidad_negocio, notas: [e.notas, e.motivo ? 'Reprogramada: ' + e.motivo : null].filter(Boolean).join(' · '), telefono: e.telefono, franja: e.franja, reprogramada_de: e.id }));
        await q(sb.from('log_entregas').update({ estado: 'reprogramada', actualizado_en: new Date().toISOString() }).eq('id', e.id));
      }
    }
    cerrarModal();
    aviso('ok', `${ids.length === 1 ? 'Entrega pasada' : ids.length + ' entregas pasadas'} a la hoja de ${esc(nombreRep(rep))} del ${fechaLarga(fecha)}.`);
    if(S.tab === 'hoja') abrirHoja(S.hojaId); else ir(S.tab);
  } catch(err){ $('mErr').textContent = errorDe(err); }
}

async function rendirHoja(id, esperado){
  const ef = Number(String($('ef' + id).value).replace(/\./g, '').replace(',', '.')) || 0, nota = $('no' + id).value.trim();
  try{
    await q(sb.from('log_hojas').update({ estado: 'rendida', rendida_en: new Date().toISOString(), rendida_por: S.perfil.user_id, efectivo_recibido: ef,
      rendicion_nota: nota || (Math.round(ef) !== Math.round(esperado) ? `Diferencia de ${pesos(ef - esperado)}` : null), terminada_en: new Date().toISOString() }).eq('id', id));
    aviso(Math.round(ef) === Math.round(esperado) ? 'ok' : 'aviso', `Hoja rendida${Math.round(ef) !== Math.round(esperado) ? `, con una diferencia de ${pesos(ef - esperado)} contra lo cobrado en efectivo` : ''}.`);
  } catch(e){ aviso('error', 'No se pudo rendir: ' + errorDe(e)); }
  ir('rendir');
}

async function guardarRep(id){
  const tr = document.querySelector(`tr[data-rep="${id}"]`), v = c => tr.querySelector(`[data-c="${c}"]`);
  const fila = { nombre: v('nombre').value.trim(), alias: v('alias').value.split(';').map(x => x.trim()).filter(Boolean), user_id: v('user_id').value || null,
    telefono: v('telefono').value.trim() || null, vehiculo_id: v('vehiculo_id').value ? Number(v('vehiculo_id').value) : null };
  if(v('activo')) fila.activo = v('activo').checked;
  if(!fila.nombre){ aviso('error', 'Poné el nombre del repartidor.'); return ir('equipo'); }
  try{
    if(id === 'nuevo') S.reps.push(await q(sb.from('log_repartidores').insert(fila).select().single()));
    else { const r = await q(sb.from('log_repartidores').update(fila).eq('id', Number(id)).select().single()); S.reps = S.reps.map(x => x.id === r.id ? r : x); }
    aviso('ok', 'Repartidor guardado.');
  } catch(e){ aviso('error', /unique|duplicate/i.test(e.message || '') ? 'Ese usuario ya está vinculado a otro repartidor.' : 'No se pudo guardar: ' + errorDe(e)); }
  S.reps.sort((a, b) => a.nombre.localeCompare(b.nombre));
  ir('equipo');
}

async function cargarRep(){
  if(!S.miRep){ content().innerHTML = `<div class="msg-box info">Tu usuario no está vinculado a un repartidor.</div>`; return; }
  content().innerHTML = `<p class="sub">Cargando tu recorrido…</p>`;

    const hojas = await q(sb.from('log_hojas').select('*').eq('repartidor_id', S.miRep.id).gte('fecha', sumarDias(hoyISO(), -3)).lte('fecha', sumarDias(hoyISO(), 3)).neq('estado', 'rendida').order('fecha'));
    const entregas = hojas.length ? await q(sb.from('log_entregas').select('*').in('hoja_id', hojas.map(h => h.id)).order('orden')) : [];
    // lo que todavía está en la cola del teléfono manda sobre lo que vino del servidor
    const cola = await colaTodo();
    for(const it of cola.sort((a, b) => a.t - b.t)){ const e = entregas.find(x => x.id === it.entrega); if(e) Object.assign(e, { estado: it.args.p_estado, motivo: it.args.p_motivo, cobro_forma: it.args.p_cobro_importe ? it.args.p_cobro_forma : null, cobro_importe: it.args.p_cobro_importe, entregada_en: it.args.p_cuando, _foto: it.foto }); }

    const c = leerCacheRep();
    if(c){ S.hojas = c.hojas; S.entregas = c.entregas; aviso('aviso', 'Sin conexión: estás viendo lo último que se cargó. Lo que marques se manda cuando vuelva la señal.'); }

  if(t.id === 'btnAvisos'){ const pend = S.hojaEntregas.filter(e => e.estado === 'pendiente' && waNumero(e.telefono) && !e.aviso_en); modal(`<h3>Avisar a los clientes</h3><p class="sub">Tocá cada uno: se abre WhatsApp con el mensaje listo y el link de seguimiento.</p>${pend.length ? pend.map(e => `<a class="btn-ghost btn-wa" style="width:100%; margin-bottom:8px; justify-content:flex-start" target="_blank" rel="noopener" data-aviso="${e.id}" href="${esc(waLink(e.telefono, msgAviso(e, S.hoja)))}">${e.orden}. ${esc(e.cliente_nombre)}</a>`).join('') : '<p class="sub">Ya se avisó a todos los que tienen teléfono.</p>'}<div class="fila" style="margin-top:10px"><button class="btn-ghost" data-cerrar>Listo</button></div>`); return; }
  if(t.id === 'btnReabrir'){ try{ await q(sb.rpc('log_hoja_estado', { p_hoja: S.hojaId, p_estado: 'armada' })); } catch(e){ aviso('error', errorDe(e)); } abrirHoja(S.hojaId); return; }
  if(t.id === 'btnBorrarHoja'){ if(!confirm('¿Borrar esta hoja de ruta con todas sus entregas?')) return; try{ await q(sb.from('log_hojas').delete().eq('id', S.hojaId)); aviso('ok', 'Hoja borrada.'); } catch(e){ aviso('error', errorDe(e)); } ir('dia'); return; }
  if((el = t.closest('[data-subir],[data-bajar]'))){
    const id = Number(el.dataset.subir || el.dataset.bajar), es = S.hojaEntregas, i = es.findIndex(e => e.id === id), j = el.dataset.subir ? i - 1 : i + 1;
    if(j < 0 || j >= es.length) return;
    try{ await q(sb.from('log_entregas').update({ orden: es[j].orden }).eq('id', es[i].id)); await q(sb.from('log_entregas').update({ orden: es[i].orden }).eq('id', es[j].id)); } catch(e){ aviso('error', errorDe(e)); }
    abrirHoja(S.hojaId); return;
  }
  if((el = t.closest('[data-ubicar]'))){ S.ubicando = Number(el.dataset.ubicar); $('mapaHoja').style.cursor = 'crosshair'; $('mapaHoja').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if((el = t.closest('[data-mover]'))){ modalMover([Number(el.dataset.mover)], 'Pasar a otra hoja'); return; }
  if((el = t.closest('[data-mover-ok]'))){ moverEntregas(el.dataset.moverOk.split(',').map(Number)); return; }
  if((el = t.closest('[data-cancelar]'))){ if(!confirm('¿Quitar esta entrega? Queda como cancelada en el historial.')) return; try{ await q(sb.from('log_entregas').update({ estado: 'cancelada', actualizado_en: new Date().toISOString() }).eq('id', Number(el.dataset.cancelar))); } catch(e){ aviso('error', errorDe(e)); } if(S.tab === 'hoja') abrirHoja(S.hojaId); else ir(S.tab); return; }
  if((el = t.closest('[data-registrar]'))){ const e = S.hojaEntregas.find(x => x.id === Number(el.dataset.registrar)); if(e) modalRegistrar(e, false); return; }
  if((el = t.closest('[data-rendir]'))){ ir('rendir'); return; }
  if((el = t.closest('[data-rendir-ok]'))){ el.disabled = true; rendirHoja(Number(el.dataset.rendirOk), Number(el.dataset.esperado)); return; }
  if(t.id === 'btnReprogSel'){ const ids = [...document.querySelectorAll('[data-sel]:checked')].map(x => Number(x.dataset.sel)); if(ids.length) modalMover(ids, `Pasar ${ids.length} ${ids.length === 1 ? 'entrega' : 'entregas'} a otra hoja`); return; }
  // registrar entrega (modal)
  if((el = t.closest('[data-reg-estado]'))){ S.reg.estado = el.dataset.regEstado; pintarRegCuerpo(regEntrega()); return; }
  if((el = t.closest('[data-reg-forma]'))){ S.reg.forma = el.dataset.regForma; pintarRegCuerpo(regEntrega()); return; }
  if((el = t.closest('[data-reg-motivo]'))){ S.reg.motivo = el.dataset.regMotivo; pintarRegCuerpo(regEntrega()); return; }
  if(t.id === 'btnRegOk'){ guardarRegistro(); return; }
  if(t.id === 'btnSinFoto'){ S.reg.sinFoto = true; guardarRegistro(); return; }
  // cargar
  if(t.id === 'btnAMano'){ try{ await asegurarClientes(); } catch(_){ S.clientes = []; } abrirBorrador({ fecha: hoyISO(), filas: [{ nro: '1', cliente_nombre: '', cliente_id: null, domicilio: '', localidad: 'NEUQUEN', cant_op: 1, notas: '' }] }, []); S.borrador.origen = 'manual'; renderCargar(''); return; }
  if(t.id === 'btnDescartar'){ S.borrador = null; S.hojaExistente = null; renderCargar(''); return; }
  if(t.id === 'btnFilaNueva'){ leerBorradorDePantalla(); S.borrador.filas.push({ nro: String(S.borrador.filas.length + 1), cliente_nombre: '', cliente_id: null, domicilio: '', localidad: 'NEUQUEN', cant_op: 1, notas: '' }); renderCargar(''); return; }
  if((el = t.closest('[data-quitar-fila]'))){ leerBorradorDePantalla(); S.borrador.filas.splice(Number(el.dataset.quitarFila), 1); renderCargar(''); return; }
  if((el = t.closest('[data-marcar]'))){ S.marcando = Number(el.dataset.marcar); $('mapaBorrador').style.cursor = 'crosshair'; $('mapaBorrador').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if(t.id === 'btnGuardarHoja'){ guardarBorrador(); return; }
  // equipo
  if((el = t.closest('[data-guardar-rep]'))){ guardarRep(el.dataset.guardarRep); return; }
  if((el = t.closest('[data-guardar-veh]'))){ guardarVeh(el.dataset.guardarVeh); return; }
  if(t.id === 'btnGuardarCfg'){ guardarCfg(); return; }
  // repartidor
  if((el = t.closest('[data-rep-hoja]'))){ S.rep.hojaId = el.dataset.repHoja ? Number(el.dataset.repHoja) : null; S.rep.abierta = null; S.rep.verMapa = false; renderRep(); return; }
  if(t.closest('[data-rep-recargar]')){ cargarRep(); return; }
  if(t.closest('[data-rep-mapa]')){ S.rep.verMapa = !S.rep.verMapa; renderRep(); return; }
  if((el = t.closest('[data-rep-abrir]'))){ const id = Number(el.dataset.repAbrir); S.rep.abierta = S.rep.abierta === id ? null : id; renderRep(); return; }
  if((el = t.closest('[data-rep-iniciar]'))){ el.disabled = true; pedirPosicion(); iniciarReparto(Number(el.dataset.repIniciar)); return; }
  if((el = t.closest('[data-rep-entregar],[data-rep-fallo],[data-rep-corregir]'))){
    const id = Number(el.dataset.repEntregar || el.dataset.repFallo || el.dataset.repCorregir), e = S.entregas.find(x => x.id === id); if(!e) return;
    pedirPosicion();
    modalRegistrar({ ...e, estado: el.dataset.repFallo ? 'no_entregada' : (el.dataset.repEntregar ? 'entregada' : e.estado) }, true);
    return;
  }
  if((el = t.closest('[data-rep-terminar]'))){ modalTerminar(Number(el.dataset.repTerminar)); return; }
  if((el = t.closest('[data-rep-terminar-ok]'))){ el.disabled = true; terminarReparto(Number(el.dataset.repTerminarOk)); return; }
});
function regEntrega(){ const lista = S.modo === 'rep' ? S.entregas : S.hojaEntregas; return lista.find(x => x.id === S.reg.id) || {}; }
function pedirPosicion(){ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { S.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; }, () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }); }
document.addEventListener('change', async ev => {
  const t = ev.target;
  if(t.id === 'fileHoja' && t.files.length){ leerArchivos([...t.files]); t.value = ''; return; }
  if(t.id === 'diaFecha' && t.value){ S.fecha = t.value; ir('dia'); return; }
  if(t.id === 'regFoto' && t.files[0]){ try{ S.reg.foto = await achicarFoto(t.files[0]); } catch(e){ $('mErr').textContent = errorDe(e); } pintarRegCuerpo(regEntrega()); return; }
  if(t.dataset && t.dataset.campo){ cambioFilaBorrador(t); return; }
  if(t.id === 'bFecha' || t.id === 'bRep' || t.id === 'bVeh'){ leerBorradorDePantalla(); if(t.id !== 'bVeh'){ await revisarExistente(); renderCargar(''); } return; }
  if((t.dataset || {}).sel !== undefined){ const n = document.querySelectorAll('[data-sel]:checked').length; $('btnReprogSel').disabled = !n; $('selInfo').textContent = n ? `${n} marcadas` : ''; return; }
  if((t.dataset || {}).transf !== undefined){ try{ await q(sb.from('log_entregas').update({ transferencia_ok: t.checked }).eq('id', Number(t.dataset.transf))); } catch(e){ t.checked = !t.checked; alert('No se pudo guardar: ' + (e.message || e)); } return; }
});
let esperaHist = null;
document.addEventListener('input', ev => { if(ev.target.id === 'histQ'){ clearTimeout(esperaHist); esperaHist = setTimeout(() => buscarHistorial().catch(() => {}), 350); } });
['dragover', 'dragleave', 'drop'].forEach(tipo => document.addEventListener(tipo, ev => {
  const d = ev.target.closest && ev.target.closest('#dropHoja'); if(!d) return;
  ev.preventDefault();
  d.classList.toggle('sobre', tipo === 'dragover');
  if(tipo === 'drop' && ev.dataTransfer.files.length) leerArchivos([...ev.dataTransfer.files].filter(f => /pdf$/i.test(f.name) || f.type === 'application/pdf'));
}));
$('btnSalir').onclick = async () => { await sb.auth.signOut(); try{ localStorage.removeItem('log_rep_cache'); } catch(_){ } renderLogin(); };

// ===== Arranque =====
fetch('./').then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/<img src="(data:image\/[^"]+)"/); if(m){ $('logo').src = m[1]; $('logo').classList.remove('hidden'); } }).catch(() => {});
const token = new URLSearchParams(location.search).get('seguimiento');
if(token) renderSeguimiento(token);
else sb.auth.getSession().then(({ data }) => { if(data.session) iniciar(data.session); else renderLogin(); }, () => renderLogin());
window.__log = { S, interpretarHoja, waNumero, buscarCliente, completarLocalidad };
})();

</script>
