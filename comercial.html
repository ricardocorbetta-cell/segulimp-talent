<html lang="es">
<head>
<meta charset="UTF-8">

<title>Seguimiento Comercial — Segulimp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#182A38; --ink-soft:#4C6070;
    --paper:#EAF2F7; --paper-2:#D3E3EC; --card:#FFFFFF;
    --brand:#245B84; --brand-dark:#163C58; --brand-light:#7EC1E0;
    --line:#C7D8E2;
    --good:#3F8F5D; --good-bg:#E6F4EB;
    --mid:#D89B2E; --mid-bg:#FBF1DD;
    --low:#8C97A0; --low-bg:#EEF2F5;
    --bad:#B3372F; --bad-bg:#FBE9E7;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px; margin:0 auto; padding:24px 20px 60px;}
  header{display:flex; align-items:center; gap:14px; margin-bottom:20px; border-bottom:3px solid var(--brand); padding-bottom:16px;}
  header img{height:52px; width:52px; border-radius:50%; flex:none;}
  header .name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px; color:var(--brand-dark); text-transform:uppercase; line-height:1;}
  header .tag{font-size:13.5px; color:var(--ink-soft); margin-top:4px;}
  header .session{margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; font-size:13px; color:var(--ink-soft);}
  header .session #sessionNombre{font-weight:600; color:var(--ink);}
  .link-btn{background:none; border:none; padding:0; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--brand); cursor:pointer; text-decoration:none;}
  .link-btn:hover{color:var(--brand-dark); text-decoration:underline;}
  .hidden{display:none !important;}

  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;}
  .tabs button{padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;}
  .tabs button:hover{border-color:var(--brand); color:var(--brand-dark);}
  .tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .tabs .spacer{flex:1;}

  h2.sec{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; color:var(--brand-dark); text-transform:uppercase; margin:26px 0 4px;}
  p.sub{font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5;}
  .muted{color:var(--ink-soft); font-size:12.5px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;}

  /* Tarjetas de indicadores */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:8px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 16px 14px;}
  .tile .label{font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .tile .value{font-size:28px; font-weight:600; color:var(--ink); line-height:1.15; margin-top:6px;}
  .tile .value.chico{font-size:22px; line-height:1.45;}
  .tile .note{font-size:12px; color:var(--ink-soft); margin-top:4px; overflow-wrap:anywhere;}
  .tile.alerta .value::after{content:''; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-left:8px; vertical-align:middle;}

  /* Barra de avance: relleno de marca sobre pista del mismo tono */
  .meter{display:flex; align-items:center; gap:8px; min-width:120px;}
  .meter .track{flex:1; height:8px; border-radius:4px; background:var(--paper-2); overflow:hidden;}
  .meter .fill{height:100%; border-radius:4px; background:var(--brand);}
  .meter .pct{font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600; width:38px; text-align:right;}

  .table-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; padding:11px 12px; background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th.sortable{cursor:pointer;}
  thead th.sortable:hover{color:var(--brand-dark);}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  table.resumen thead th{white-space:normal; vertical-align:bottom; padding:10px 9px;}
  table.resumen tbody td{padding:11px 9px;}
  table.resumen td:first-child{min-width:150px;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:#F5F9FC;}
  tr.sin-vendedor td{background:#FBFCFD; font-style:italic;}

  .chip{display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:10px; background:var(--low-bg); color:var(--ink); font-size:11.5px; font-weight:600; white-space:nowrap;}
  .chip::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--low);}
  .chip.alta{background:var(--bad-bg);} .chip.alta::before{background:var(--bad);}
  .chip.media{background:var(--mid-bg);} .chip.media::before{background:var(--mid);}
  .chip.ok{background:var(--good-bg);} .chip.ok::before{background:var(--good);}
  .chip.plano::before{display:none;}
  .vencido{color:var(--bad); font-weight:600;}

  .filtros{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  .filtros input[type=search], .filtros select, .gestion select, .gestion input, select.mini, .form input, .form select{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .filtros input[type=search]{flex:1; min-width:200px;}
  .presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .preset{padding:5px 11px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; cursor:pointer;}
  .preset:hover{border-color:var(--brand);}
  .preset.active{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff;}
  .preset b{font-weight:700; margin-left:4px;}
  .conteo{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;}

  .gestion{min-width:230px;}
  .gestion select{width:100%; margin-bottom:6px;}
  .gestion .linea{display:flex; gap:6px;}
  .gestion input{flex:1; min-width:0;}
  select.mini{padding:4px 6px; font-size:12px; margin-top:6px; max-width:200px;}

  .btn-primary{padding:10px 16px; border:none; border-radius:8px; background:var(--brand); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:disabled{opacity:.45; cursor:default; background:var(--brand);}
  .btn-primary.small{padding:8px 12px; font-size:12.5px;}
  .btn-ghost{padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;}
  .btn-ghost:hover{border-color:var(--brand); color:var(--brand-dark);}
  .btn-ghost.small{padding:5px 9px; font-size:12px;}
  .mas{display:block; margin:14px auto 0;}

  .msg-box{padding:12px 16px; border-radius:10px; font-size:13.5px; line-height:1.6; margin-bottom:16px;}
  .msg-box.ok{background:var(--good-bg); color:#24573A; border:1px solid #BFE3CC;}
  .msg-box.error{background:var(--bad-bg); color:#8A2C24; border:1px solid #F2C6C0;}
  .msg-box.info{background:#EAF3FA; color:var(--brand-dark); border:1px solid var(--line);}

  .form-card{max-width:400px; margin:30px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px;}
  .form-card h2{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; color:var(--brand-dark); text-transform:uppercase; margin:0 0 6px;}
  .form-card label{display:block; font-size:12.5px; font-weight:600; margin:14px 0 5px;}
  .form-card input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:14px;}
  .form-card .btn-primary{width:100%; margin-top:20px;}
  .msg-error{margin-top:12px; font-size:13px; color:var(--bad);}

  .dropzone{border:2px dashed var(--brand-light); border-radius:12px; background:#F5F9FC; padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px; cursor:pointer;}
  .dropzone.dragging, .dropzone:hover{border-color:var(--brand); background:#EAF3FA;}
  .dropzone strong{color:var(--brand-dark);}
  .cols{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px;}
  .form{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px;}
  .form label{font-size:12.5px; font-weight:600;}
  .progress{height:10px; border-radius:5px; background:var(--paper-2); overflow:hidden; margin-top:10px;}
  .progress div{height:100%; background:var(--brand); border-radius:5px; transition:width .2s;}

  .barra{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px;}
  .mes-nav{display:flex; align-items:center; gap:6px;}
  .mes-nav input[type=month], .mes-nav select, .mapa-grid select, .mapa-grid input, input.monto, .form input[type=date]{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .back-btn{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--brand); cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0; font-family:'Inter',sans-serif;}
  .back-btn:hover{color:var(--brand-dark);}
  .tile.ancho{grid-column:span 2;}
  .tile .meter{margin-top:8px;}
  .meter .track{position:relative; overflow:visible;}
  .meter .fill{position:relative;}
  .meter .marca{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px; z-index:1;}
  tr.total td{background:var(--paper); font-weight:600;}
  tr.actual td{background:#F5F9FC;}
  .plan-grid{display:grid; grid-template-columns:minmax(120px, 1fr) 110px 110px; gap:8px 12px; align-items:center; max-width:460px;}
  .plan-grid .cab{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
  .plan-grid label{font-size:14px; font-weight:500;}
  .plan-grid input{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:15px; width:100%; font-variant-numeric:tabular-nums;}
  .plan-grid input:disabled, #planNota:disabled{background:var(--low-bg); color:var(--ink-soft);}
  .mapa-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px 14px;}
  .mapa-grid label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600;}
  .form label.check{display:flex; align-items:center; gap:6px; font-weight:500; font-size:13.5px;}
  input.monto{width:100%; max-width:220px; font-variant-numeric:tabular-nums;}
  .feed{list-style:none; margin:0; padding:0;}
  .feed li{padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5;}
  .feed li:last-child{border-bottom:none;}

  footer{margin-top:40px; font-size:12px; color:var(--ink-soft); text-align:center;}

  @media (max-width:860px){
    table.apilar, table.apilar thead, table.apilar tbody, table.apilar th, table.apilar td, table.apilar tr{display:block;}
    table.apilar thead{display:none;}
    table.apilar tbody tr{border-bottom:1px solid var(--line); padding:12px 14px;}
    table.apilar tbody tr:last-child{border-bottom:none;}
    table.apilar tbody td{border:none; padding:4px 0; text-align:left;}
    table.apilar tbody td[data-label]:not([data-label=""])::before{content:attr(data-label); display:block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin-bottom:1px;}
    table.apilar td.num{text-align:left;}
    .gestion{min-width:0;}
    .tile.ancho{grid-column:auto;}
    .plan-grid{grid-template-columns:minmax(90px, 1fr) 84px 84px;}
    header{flex-wrap:wrap;}
    header .session{width:100%; justify-content:flex-start; margin-left:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="Segulimp" class="hidden">
    <div>
      <div class="name">Seguimiento Comercial</div>
      <div class="tag">Fuerza de Ventas · Segulimp Hub</div>
    </div>
    <div class="session hidden" id="session">
      <span id="sessionNombre"></span>
      <a class="link-btn" href="hub.html">← Volver al Hub</a>
      <button class="link-btn" id="btnSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="tabs hidden" id="tabs"></div>
  <div id="content"><p class="sub">Cargando…</p></div>

  <footer>Segulimp — Panel interno. No compartir estos links fuera del equipo.</footer>
</div>

<script>
(function(){
const SUPABASE_URL = "https://xiamarozmaqixwfiwshp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYW1hcm96bWFxaXh3Zml3c2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTcwNjMsImV4cCI6MjEwMzQ5MzA2M30.dIWX6AQbJEM6lgJ2AsdIPW9h1lOhc9ivaTkqjZqTumw";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const XLSX_URL = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";

const ESTADOS = ['Pendiente', 'En conversación', 'Pausado', 'Ganado', 'Descartado'];
const POR_PAGINA = 50;
const TAM_LOTE = 500;

// Estado de la página
const S = {
  perfil: null, esAdmin: false, veTodo: false, esComercial: false,
  plan: [], vendedores: [], snapshots: [], log: [], usuarios: [],
  misVendedores: new Set(),
  tab: null, aviso: null,
  filtros: { q: '', vendedor: '', estado: '', prioridad: '', segmento: '', preset: '', orden: 'prioridad' },
  mostrar: POR_PAGINA,
  ordenResumen: { campo: 'n', desc: true },
  importacion: null,
  periodo: null, objetivos: [], ventas: [], actividades: [], cargas: [], alias: [],
  semana: null, verVendedor: null, impVentas: null
};

const $ = id => document.getElementById(id);
const content = () => $('content');

// ====== UTILIDADES ======
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function norm(v){
  return String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fechaCorta(iso){
  if(!iso) return '—';
  const [a, m, d] = String(iso).slice(0, 10).split('-');
  return `${d}/${m}/${a}`;
}
function fechaHora(v){
  if(!v) return '—';
  return new Date(v).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function haceCuanto(ms){
  if(!ms) return 'Sin gestiones';
  const dias = Math.floor((Date.now() - ms) / 864e5);
  if(dias <= 0) return 'Hoy';
  if(dias === 1) return 'Ayer';
  return `Hace ${dias} días`;
}
const nf = new Intl.NumberFormat('es-AR');
function num(v){ return v == null ? '—' : nf.format(v); }
function plata(v){
  if(v == null) return '—';
  const n = Number(v), a = Math.abs(n);
  if(a >= 1e9) return '$' + nf.format(Math.round(n / 1e8) / 10) + ' MM';
  if(a >= 1e6) return '$' + nf.format(Math.round(n / 1e5) / 10) + ' M';
  if(a >= 1e3) return '$' + nf.format(Math.round(n / 1e3)) + ' K';
  return '$' + nf.format(Math.round(n));
}
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

// ====== REGLAS DE SEGUIMIENTO ======
function snapsCompletos(){
  return S.snapshots.filter(s => s.completo).sort((a, b) => a.fecha === b.fecha ? b.id - a.id : (a.fecha < b.fecha ? 1 : -1));
}
function snapActual(){ return snapsCompletos()[0] || null; }
function snapAnterior(){ return snapsCompletos()[1] || null; }
function vencido(r){ return r.estado === 'Pendiente' && !!r.fecha_objetivo && r.fecha_objetivo < hoyISO(); }
function altoValor(r){ return /alto|estrat/i.test(r.nivel_valor || ''); }
function comproDesdeAnterior(r){ const a = snapAnterior(); return !!a && !!r.ultima_compra && r.ultima_compra > a.fecha; }
function puedeEditar(r){ return S.esAdmin || (S.esComercial && S.misVendedores.has(r.vendedor_id)); }

const PRESETS = [
  { id: 'vencidos', nombre: 'Objetivo vencido', test: vencido },
  { id: 'alto', nombre: 'Alto valor sin gestión', test: r => altoValor(r) && r.estado === 'Pendiente' },
  { id: 'compro', nombre: 'Compraron sin gestión', test: r => comproDesdeAnterior(r) && r.estado === 'Pendiente', requiereAnterior: true },
  { id: 'ganado', nombre: 'Ganados sin compra', test: r => r.estado === 'Ganado' && !comproDesdeAnterior(r), requiereAnterior: true }
];

function rangoPrioridad(p){
  const n = norm(p);
  if(n.startsWith('alta') || n.startsWith('urg')) return 0;
  if(n.startsWith('media')) return 1;
  if(n.startsWith('baja')) return 2;
  return 3;
}
function chipPrioridad(p){
  if(!p) return '<span class="muted">—</span>';
  const r = rangoPrioridad(p);
  return `<span class="chip ${r === 0 ? 'alta' : r === 1 ? 'media' : ''}">${esc(p)}</span>`;
}

// ====== DATOS ======
async function traerTodo(tabla, columnas, orden, filtro){
  const filas = [], paso = 1000;
  for(let desde = 0; ; desde += paso){
    let q = sb.from(tabla).select(columnas).order(orden, { ascending: true }).range(desde, desde + paso - 1);
    if(filtro) q = filtro(q);
    const { data, error } = await q;
    if(error) throw error;
    filas.push(...data);
    if(data.length < paso) break;
  }
  return filas;
}

async function cargarDatos(){
  const desde = new Date(Date.now() - 30 * 864e5).toISOString();
  const [plan, vendedores, snapshots, log] = await Promise.all([
    traerTodo('comercial_plan_vivo', '*', 'cliente_id'),
    traerTodo('comercial_vendedores', 'id, nombre, nombre_erp, user_id, activo, email', 'id'),
    traerTodo('comercial_snapshots', 'id, fecha, fuente, filas, completo, creado_en', 'id'),
    traerTodo('comercial_gestion_log', 'id, cliente_id, vendedor_id, estado_anterior, estado_nuevo, comentario, usuario_nombre, creado_en', 'id', q => q.gte('creado_en', desde))
  ]);
  S.plan = plan; S.vendedores = vendedores; S.snapshots = snapshots; S.log = log;
  S.misVendedores = new Set(vendedores.filter(v => v.user_id === S.perfil.user_id && v.activo).map(v => v.id));
  if(S.esAdmin){
    const { data, error } = await sb.rpc('comercial_usuarios');
    S.usuarios = error ? [] : (data || []);
  }
  S.cargas = await traerTodo('comercial_ventas_cargas', 'id, archivo, desde, hasta, filas, total, creado_en', 'id', q => q.gte('hasta', sumarDias(hoyISO(), -400)));
  S.alias = S.veTodo ? await traerTodo('comercial_vendedor_alias', 'alias, vendedor_id', 'alias') : [];
  if(!S.periodo) S.periodo = hoyISO().slice(0, 7);
  await cargarPeriodo();
}

// ====== ACCESO ======
function renderLogin(mensaje){
  S.perfil = null;
  $('session').classList.add('hidden');
  $('tabs').classList.add('hidden');
  content().innerHTML = `
    <form class="form-card" id="formLogin">
      <h2>Ingresar</h2>
      <p class="sub">Usá el mismo usuario y contraseña del Hub.</p>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label for="loginClave">Contraseña</label>
      <input type="password" id="loginClave" autocomplete="current-password" required>
      <button class="btn-primary" type="submit">Ingresar</button>
      <div class="msg-error">${esc(mensaje || '')}</div>
    </form>`;
  $('formLogin').onsubmit = async e => {
    e.preventDefault();
    e.target.querySelector('button').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({
      email: $('loginEmail').value.trim(),
      password: $('loginClave').value
    });
    if(error){ renderLogin('Email o contraseña incorrectos.'); return; }
    iniciar(data.session);
  };
}

async function iniciar(session){
  const { data, error } = await sb.from('perfiles')
    .select('user_id, email, nombre, roles, activo, debe_cambiar_clave')
    .eq('user_id', session.user.id).maybeSingle();
  if(error || !data || !data.activo){
    await sb.auth.signOut();
    renderLogin('Tu usuario no tiene acceso. Consultá con un administrador.');
    return;
  }
  S.perfil = data;
  $('session').classList.remove('hidden');
  $('sessionNombre').textContent = data.nombre;
  if(data.debe_cambiar_clave){
    content().innerHTML = `<div class="msg-box info">Antes de seguir tenés que elegir tu contraseña. <a class="link-btn" href="hub.html">Entrá al Hub</a> y volvé a esta herramienta.</div>`;
    return;
  }
  S.esAdmin = data.roles.includes('administrador');
  S.veTodo = S.esAdmin || data.roles.includes('consulta');
  S.esComercial = data.roles.includes('comercial');
  if(!S.veTodo && !S.esComercial){
    content().innerHTML = `<div class="msg-box info">Tu usuario no tiene acceso a Fuerza de Ventas. Pedile a un administrador el rol Comercial.</div>`;
    return;
  }
  await recargar('avance');
}

async function recargar(tab){
  content().innerHTML = `<p class="sub">Cargando datos…</p>`;
  try{
    await cargarDatos();
  } catch(e){
    content().innerHTML = `<div class="msg-box error">No se pudieron cargar los datos: ${esc(e.message || e)}</div>`;
    return;
  }
  ir(tab || S.tab || 'avance');
}

// ====== NAVEGACIÓN ======
function pestanas(){
  const t = [['avance', S.veTodo ? 'Avance de ventas' : 'Mi avance']];
  if(S.esAdmin){ t.push(['ventas', 'Cargar ventas']); t.push(['objetivos', 'Objetivos']); t.push(['vendedores', 'Vendedores']); }
  if(S.plan.length){
    if(S.veTodo) t.push(['seguimiento', 'Cartera por vendedor']);
    t.push(['cartera', S.veTodo ? 'Cartera de clientes' : 'Mi cartera']);
  }
  if(S.esAdmin) t.push(['importar', 'Cargar cartera']);
  return t;
}
function ir(tab){
  if(!pestanas().some(p => p[0] === tab)) tab = pestanas()[0][0];
  S.tab = tab;
  const el = $('tabs');
  el.classList.remove('hidden');
  el.innerHTML = pestanas().map(([id, nombre]) =>
    `<button type="button" data-tab="${id}" class="${id === tab ? 'active' : ''}">${nombre}</button>`).join('') +
    `<span class="spacer"></span><button type="button" data-tab="_recargar">↻ Actualizar</button>`;
  const aviso = S.aviso ? `<div class="msg-box ${S.aviso.tipo}">${S.aviso.html}</div>` : '';
  S.aviso = null;
  if(tab === 'avance') renderAvance(aviso);
  else if(tab === 'ventas') renderVentas(aviso);
  else if(tab === 'objetivos') renderObjetivos(aviso);
  else if(tab === 'seguimiento') renderSeguimiento(aviso);
  else if(tab === 'cartera') renderCartera(aviso);
  else if(tab === 'importar') renderImportar(aviso);
  else if(tab === 'vendedores') renderVendedores(aviso);
}
function sinDatos(aviso){
  content().innerHTML = aviso + `<div class="card"><p class="sub" style="margin:0">
    ${S.esAdmin ? 'Todavía no hay ninguna cartera cargada. Podés <button class="link-btn" data-tab="importar">cargar la cartera de clientes</button>.'
      : (S.veTodo ? 'Todavía no hay reportes cargados.' : (S.misVendedores.size ? 'Todavía no hay clientes en tu cartera.' : 'Tu usuario todavía no está vinculado a una cartera. Pedile a un administrador que lo vincule desde la pestaña Vendedores.'))}
  </p></div>`;
}

// ====== SEGUIMIENTO POR VENDEDOR ======
function resumenVendedores(){
  const hace7 = Date.now() - 7 * 864e5;
  const m = new Map();
  const fila = (id, nombre) => {
    const k = id ?? 0;
    if(!m.has(k)) m.set(k, { id: id ?? null, nombre, n: 0, gest: 0, pend: 0, venc: 0, conv: 0, gan: 0, ventas: 0, recompra: 0, g7: 0, ult: 0, vinculado: false });
    return m.get(k);
  };
  const inactivos = new Set(S.vendedores.filter(v => !v.activo).map(v => v.id));
  const grupo = id => id == null ? null : (inactivos.has(id) ? '_inactivos' : id);
  for(const v of S.vendedores) if(v.activo){ fila(v.id, v.nombre).vinculado = !!v.user_id; }
  for(const r of S.plan){
    const g = grupo(r.vendedor_id);
    const o = fila(g, g === null ? 'Sin vendedor' : (g === '_inactivos' ? 'Vendedores inactivos' : (r.vendedor || 'Vendedor')));
    o.n++;
    o.ventas += Number(r.ventas || 0);
    if(r.estado === 'Pendiente') o.pend++; else o.gest++;
    if(r.estado === 'En conversación') o.conv++;
    if(r.estado === 'Ganado') o.gan++;
    if(vencido(r)) o.venc++;
    if(comproDesdeAnterior(r)) o.recompra++;
    if(r.gestion_actualizada_por && r.gestion_actualizada_en){
      const t = Date.parse(r.gestion_actualizada_en);
      if(t > o.ult) o.ult = t;
    }
  }
  for(const l of S.log){
    const o = m.get(grupo(l.vendedor_id) ?? 0);
    if(!o) continue;
    const t = Date.parse(l.creado_en);
    if(t >= hace7) o.g7++;
    if(t > o.ult) o.ult = t;
  }
  return [...m.values()].filter(o => o.n > 0 || o.vinculado);
}

      <td data-label="Objetivo vencido" class="num">${o.venc ? `<span class="vencido">${num(o.venc)}</span>` : '0'}</td>
      <td data-label="En conversación" class="num">${num(o.conv)}</td>

      <td data-label="Ventas de la cartera" class="num">${plata(o.ventas)}</td>
    </tr>`;

  const mapa = new Map(S.plan.map(r => [r.cliente_id, r]));
  const vend = new Map(S.vendedores.map(v => [v.id, v.nombre]));
  const feed = [...S.log].sort((a, b) => b.id - a.id).slice(0, 15);

  content().innerHTML = aviso + `
    <div class="tiles">
      <div class="tile"><div class="label">Clientes en el plan</div><div class="value">${num(total)}</div><div class="note">${num(sinV)} sin vendedor activo</div></div>
      <div class="tile"><div class="label">Clientes gestionados</div><div class="value">${pct(gest, total)}%</div><div class="note">${num(gest)} de ${num(total)} con algún avance</div></div>
      <div class="tile ${venc ? 'alerta' : ''}"><div class="label">Objetivos vencidos</div><div class="value">${num(venc)}</div><div class="note">Pendientes con fecha objetivo pasada</div></div>
      <div class="tile"><div class="label">Gestiones, últimos 7 días</div><div class="value">${num(log7.length)}</div><div class="note">${activos7} ${activos7 === 1 ? 'cartera con actividad' : 'carteras con actividad'}</div></div>
      ${ant ? `<div class="tile"><div class="label">Compraron desde el reporte anterior</div><div class="value">${num(recompra)}</div><div class="note">Compras posteriores al ${fechaCorta(ant.fecha)}</div></div>` : ''}
      <div class="tile"><div class="label">Último reporte cargado</div><div class="value chico">${act ? fechaCorta(act.fecha) : '—'}</div><div class="note">${act ? esc(act.fuente || '') : ''}</div></div>
    </div>

    <h2 class="sec">Avance por vendedor</h2>

    <div class="table-wrap">

          ${th('venc', 'Objetivo vencido', 'num')}${th('conv', 'En conversación', 'num')}${th('gan', 'Ganados', 'num')}

          <span class="muted">· cartera de ${esc(vend.get(l.vendedor_id) || 'sin vendedor')}</span>

      }).join('')}</ul>` : `<p class="sub" style="margin:0">Todavía no hay gestiones registradas en los últimos 30 días.</p>`}
    </div>`;
}

// ====== CARTERA ======
function filtrarPlan(){
  const f = S.filtros, q = norm(f.q);
  const preset = PRESETS.find(p => p.id === f.preset);
  const inactivos = new Set(S.vendedores.filter(v => !v.activo).map(v => v.id));
  let filas = S.plan.filter(r => {
    if(f.vendedor === '_sin'){ if(r.vendedor_id) return false; }
    else if(f.vendedor === '_inactivos'){ if(!inactivos.has(r.vendedor_id)) return false; }
    else if(f.vendedor && String(r.vendedor_id) !== f.vendedor) return false;
    if(f.estado && r.estado !== f.estado) return false;
    if(f.prioridad && (r.prioridad || '') !== f.prioridad) return false;
    if(f.segmento && (r.segmento_recencia || '') !== f.segmento) return false;
    if(preset && !preset.test(r)) return false;
    if(q && !norm(r.nombre + ' ' + r.codigo + ' ' + (r.localidad || '')).includes(q)) return false;
    return true;
  });
  const fin = '9999-12-31';
  const cmp = {
    prioridad: (a, b) => rangoPrioridad(a.prioridad) - rangoPrioridad(b.prioridad)
      || (a.fecha_objetivo || fin).localeCompare(b.fecha_objetivo || fin) || Number(b.ventas || 0) - Number(a.ventas || 0),
    ventas: (a, b) => Number(b.ventas || 0) - Number(a.ventas || 0),
    dias: (a, b) => (b.dias_sin_compra ?? -1) - (a.dias_sin_compra ?? -1),
    objetivo: (a, b) => (a.fecha_objetivo || fin).localeCompare(b.fecha_objetivo || fin),
    gestion: (a, b) => (b.gestion_actualizada_por ? b.gestion_actualizada_en : '').localeCompare(a.gestion_actualizada_por ? a.gestion_actualizada_en : '')
  }[f.orden];
  return filas.sort(cmp);
}

function opciones(valores, actual, vacio){
  return `<option value="">${vacio}</option>` + valores.map(v => `<option value="${esc(v)}" ${v === actual ? 'selected' : ''}>${esc(v)}</option>`).join('');
}
function distintos(campo){
  return [...new Set(S.plan.map(r => r[campo]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b)));
}

function filaCliente(r){

      <option value="">Sin vendedor</option>

    </select></div>` : (S.veTodo ? `<div class="muted">${esc(r.vendedor || 'Sin vendedor')}</div>` : '');
  return `
    <tr data-id="${r.cliente_id}">

      <td data-label="Última compra">${fechaCorta(r.ultima_compra)}
        <div class="muted">${[dias, r.segmento_recencia ? esc(r.segmento_recencia) : ''].filter(Boolean).join(' · ')}</div>

      <td data-label="Ventas" class="num">${plata(r.ventas)}</td>
      <td data-label="Acción sugerida">${esc(r.accion_sugerida || '—')}
        ${r.fecha_objetivo ? `<div class="muted ${vencido(r) ? 'vencido' : ''}">Objetivo ${fechaCorta(r.fecha_objetivo)}${vencido(r) ? ' · vencido' : ''}</div>` : ''}</td>

        ${edita ? `
          <select data-estado aria-label="Estado de gestión">${ESTADOS.map(e => `<option ${e === r.estado ? 'selected' : ''}>${e}</option>`).join('')}</select>
          <div class="linea">
            <input type="text" data-comentario maxlength="500" placeholder="Comentario" value="${esc(r.comentario || '')}" aria-label="Comentario">
            <button class="btn-primary small" data-guardar disabled>Guardar</button>
          </div>` : `
          <span class="chip plano">${esc(r.estado)}</span>
          ${r.comentario ? `<div class="muted" style="margin-top:4px">${esc(r.comentario)}</div>` : ''}`}
        ${r.gestion_actualizada_por ? `<div class="muted" style="margin-top:4px">Última gestión ${fechaHora(r.gestion_actualizada_en)}</div>` : ''}
      </td>
    </tr>`;
}

function renderCartera(aviso){

  const tiles = S.veTodo ? '' : (() => {
    const pend = S.plan.filter(r => r.estado === 'Pendiente').length;
    const venc = S.plan.filter(vencido).length;
    const g7 = S.log.filter(l => Date.parse(l.creado_en) >= hace7).length;
    return `<div class="tiles">
      <div class="tile"><div class="label">Mis clientes</div><div class="value">${num(S.plan.length)}</div><div class="note">${pct(S.plan.length - pend, S.plan.length)}% gestionados</div></div>
      <div class="tile"><div class="label">Pendientes</div><div class="value">${num(pend)}</div><div class="note">Sin gestión todavía</div></div>
      <div class="tile ${venc ? 'alerta' : ''}"><div class="label">Objetivos vencidos</div><div class="value">${num(venc)}</div><div class="note">Pendientes con fecha objetivo pasada</div></div>
      <div class="tile"><div class="label">Gestiones, últimos 7 días</div><div class="value">${num(g7)}</div><div class="note">Cambios de estado o comentarios</div></div>
    </div>`;
  })();
  const ant = snapAnterior();
  content().innerHTML = aviso + tiles + `
    <div class="filtros">
      <input type="search" id="fQ" placeholder="Buscar cliente, código o localidad" value="${esc(f.q)}">
      ${S.veTodo ? `<select id="fVendedor"><option value="">Todos los vendedores</option><option value="_sin" ${f.vendedor === '_sin' ? 'selected' : ''}>Sin vendedor</option>
        ${S.vendedores.some(v => !v.activo) ? `<option value="_inactivos" ${f.vendedor === '_inactivos' ? 'selected' : ''}>Vendedores inactivos</option>` : ''}
        ${[...S.vendedores].sort((a, b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre)).map(v => `<option value="${v.id}" ${String(v.id) === f.vendedor ? 'selected' : ''}>${esc(v.nombre)}${v.activo ? '' : ' (inactivo)'}</option>`).join('')}</select>` : ''}
      <select id="fEstado">${opciones(ESTADOS, f.estado, 'Todos los estados')}</select>
      <select id="fPrioridad">${opciones(distintos('prioridad'), f.prioridad, 'Toda prioridad')}</select>
      <select id="fSegmento">${opciones(distintos('segmento_recencia'), f.segmento, 'Todo segmento')}</select>
      <select id="fOrden" aria-label="Orden">
        ${[['prioridad', 'Orden: prioridad'], ['ventas', 'Orden: mayores ventas'], ['dias', 'Orden: más días sin comprar'], ['objetivo', 'Orden: fecha objetivo'], ['gestion', 'Orden: última gestión']]
          .map(([v, t]) => `<option value="${v}" ${f.orden === v ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="presets">
      ${PRESETS.filter(p => !p.requiereAnterior || ant).map(p =>
        `<button type="button" class="preset ${f.preset === p.id ? 'active' : ''}" data-preset="${p.id}">${p.nombre}<b>${num(S.plan.filter(p.test).length)}</b></button>`).join('')}
    </div>
    <div id="lista"></div>`;
  pintarLista();
}

      <thead><tr><th>Cliente</th><th>Prioridad</th><th>Última compra</th><th class="num">Ventas</th><th>Acción sugerida</th><th>Gestión</th></tr></thead>
      <tbody>${filas.slice(0, S.mostrar).map(filaCliente).join('')}</tbody>
    </table></div>

      : `<div class="card"><p class="sub" style="margin:0">No hay clientes con esos filtros.</p></div>`}`;
}

async function guardarGestion(tr){
  const id = Number(tr.dataset.id);
  const r = S.plan.find(x => x.cliente_id === id);
  const btn = tr.querySelector('[data-guardar]');
  const estado = tr.querySelector('[data-estado]').value;
  const comentario = tr.querySelector('[data-comentario]').value.trim() || null;
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.from('comercial_gestion')
    .update({ estado, comentario }).eq('cliente_id', id)
    .select('estado, comentario, actualizado_en, actualizado_por');
  if(error || !data || !data.length){
    btn.disabled = false; btn.textContent = 'Reintentar';
    btn.title = error ? error.message : 'No tenés permiso para editar este cliente.';
    return;
  }
  S.log.push({ id: Date.now(), cliente_id: id, vendedor_id: r.vendedor_id, estado_anterior: r.estado, estado_nuevo: data[0].estado,
    comentario: data[0].comentario, usuario_nombre: S.perfil.nombre, creado_en: new Date().toISOString() });
  r.estado = data[0].estado; r.comentario = data[0].comentario;
  r.gestion_actualizada_en = data[0].actualizado_en; r.gestion_actualizada_por = data[0].actualizado_por;
  tr.outerHTML = filaCliente(r);
}

async function reasignar(select){
  const id = Number(select.dataset.reasignar);
  const r = S.plan.find(x => x.cliente_id === id);
  const nuevo = select.value ? Number(select.value) : null;
  select.disabled = true;
  const { data, error } = await sb.from('comercial_clientes')
    .update({ vendedor_id: nuevo, asignado_manual: true }).eq('id', id).select('id');
  select.disabled = false;
  if(error || !data || !data.length){
    select.value = r.vendedor_id ?? '';
    select.title = error ? error.message : 'No se pudo reasignar.';
    return;
  }
  const v = S.vendedores.find(x => x.id === nuevo);
  r.vendedor_id = nuevo; r.vendedor = v ? v.nombre : null; r.asignado_manual = true;
}

function cargarLector(){
  return new Promise((ok, mal) => {
    if(window.XLSX) return ok();
    const s = document.createElement('script');
    s.src = XLSX_URL;
    s.onload = () => ok();
    s.onerror = () => mal(new Error('No se pudo cargar el lector de Excel. Revisá la conexión y volvé a intentar.'));
    document.head.appendChild(s);
  });
}
function mapearEncabezados(fila){
  const mapa = {}, usados = new Set();
  const cab = fila.map(norm);
  for(const [campo, alias] of Object.entries(CAMPOS)){
    let i = cab.findIndex((c, idx) => !usados.has(idx) && alias.includes(c));
    if(i < 0 && campo === 'ventas') i = cab.findIndex((c, idx) => !usados.has(idx) && c.startsWith('ventas'));
    if(i >= 0){ mapa[campo] = i; usados.add(i); }
  }
  return mapa;
}
function aNumero(v){
  if(v == null || v === '') return null;
  if(typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v).replace(/[^0-9,.\-]/g, '');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function aFecha(v){
  if(v == null || v === '') return null;
  const p = n => String(n).padStart(2, '0');
  if(v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())}`;
  if(typeof v === 'number'){
    if(v < 20000 || v > 80000) return null;                       // número de serie de Excel
    return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${p(m[2])}-${p(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    const a = m[3].length === 2 ? '20' + m[3] : m[3];
    if(+m[2] < 1 || +m[2] > 12 || +m[1] < 1 || +m[1] > 31) return null;
    return `${a}-${p(m[2])}-${p(m[1])}`;
  }
  return null;
}
function aTexto(v){
  if(v == null) return null;
  const s = (typeof v === 'number' && Number.isInteger(v) ? String(v) : String(v)).trim();
  return s || null;
}
function claveVendedor(v){ return v ? v.replace(/\s+/g, ' ').trim().toUpperCase() : null; }

function leerLibro(buffer, nombreArchivo){
  const wb = XLSX.read(buffer, { type: 'array' });
  const orden = [...wb.SheetNames].sort((a, b) => (norm(b) === 'plan de trabajo') - (norm(a) === 'plan de trabajo'));
  for(const hoja of orden){
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: null, blankrows: false });
    for(let i = 0; i < Math.min(filas.length, 25); i++){
      const mapa = mapearEncabezados(filas[i] || []);
      if(mapa.codigo == null || mapa.cliente == null) continue;
      const porCodigo = new Map();
      let descartadas = 0, duplicadas = 0;
      for(const f of filas.slice(i + 1)){
        const codigo = aTexto(f[mapa.codigo]), cliente = aTexto(f[mapa.cliente]);
        if(!codigo || !cliente || /^total/i.test(codigo)){ descartadas++; continue; }
        const o = { codigo, cliente };
        for(const campo of Object.keys(CAMPOS)){
          if(campo === 'codigo' || campo === 'cliente' || mapa[campo] == null) continue;
          const v = f[mapa[campo]];
          if(NUMERICOS.includes(campo)) o[campo] = aNumero(v);
          else if(FECHAS.includes(campo)) o[campo] = aFecha(v);
          else if(campo === 'dias_sin_compra'){ const n = aNumero(v); o[campo] = n == null ? null : Math.round(n); }
          else o[campo] = aTexto(v);
        }
        if(o.margen != null && Math.abs(o.margen) > 1.5) o.margen = Math.round(o.margen * 1e4) / 1e6;   // 37,2 -> 0,372
        if(porCodigo.has(codigo)) duplicadas++;
        porCodigo.set(codigo, o);
      }
      return { archivo: nombreArchivo, hoja, mapa, filas: [...porCodigo.values()], descartadas, duplicadas };
    }
  }
  throw new Error('No encontré una hoja con columnas "Código" y "Cliente". Revisá que sea el reporte correcto.');
}

async function elegirArchivo(file){
  S.importacion = { datos: null, error: null };
  try{
    await cargarLector();
    const datos = leerLibro(new Uint8Array(await file.arrayBuffer()), file.name);
    if(!datos.filas.length) throw new Error('El archivo no tiene filas con código y cliente.');
    S.importacion = { datos, fecha: hoyISO() };
  } catch(e){
    S.importacion = { datos: null, error: e.message || String(e) };
  }
  renderImportar('');
}

async function importar(){
  const imp = S.importacion;
  const fecha = $('impFecha').value || hoyISO();
  imp.fecha = fecha; imp.enCurso = true;
  $('btnImportar').disabled = true; $('btnCancelarImp').disabled = true;
  const prog = (texto, p) => { $('impProgreso').innerHTML = `<p class="muted" style="margin:14px 0 0">${esc(texto)}</p><div class="progress"><div style="width:${p}%"></div></div>`; };
  const base = Date.parse(fecha + 'T00:00:00Z');
  const filas = imp.datos.filas.map(r => {
    if(r.dias_sin_compra == null && r.ultima_compra){
      const d = Math.round((base - Date.parse(r.ultima_compra + 'T00:00:00Z')) / 864e5);
      return { ...r, dias_sin_compra: d >= 0 ? d : null };
    }
    return r;
  });
  let snap = null;
  const tot = { clientes_nuevos: 0, vendedores_nuevos: 0 };
  try{
    prog('Preparando la carga…', 2);
    let r = await sb.rpc('comercial_importar_inicio', { p_fecha: fecha, p_fuente: imp.datos.archivo });
    if(r.error) throw r.error;
    snap = r.data;
    for(let i = 0; i < filas.length; i += TAM_LOTE){
      prog(`Subiendo clientes ${num(i + 1)} a ${num(Math.min(i + TAM_LOTE, filas.length))} de ${num(filas.length)}…`, 5 + Math.round(i / filas.length * 90));
      r = await sb.rpc('comercial_importar_lote', { p_snapshot: snap, p_filas: filas.slice(i, i + TAM_LOTE) });
      if(r.error) throw r.error;
      tot.clientes_nuevos += r.data.clientes_nuevos; tot.vendedores_nuevos += r.data.vendedores_nuevos;
    }
    prog('Cerrando la carga…', 97);
    r = await sb.rpc('comercial_importar_fin', { p_snapshot: snap });
    if(r.error) throw r.error;
    S.importacion = null;
    S.aviso = { tipo: 'ok', html: `Reporte cargado: <strong>${num(r.data)}</strong> clientes, ${num(tot.clientes_nuevos)} nuevos${tot.vendedores_nuevos ? `, ${tot.vendedores_nuevos} vendedores nuevos (vinculalos a su usuario en la pestaña Vendedores)` : ''}.` };
    await recargar('importar');
  } catch(e){
    if(snap) await sb.from('comercial_snapshots').delete().eq('id', snap);   // no dejar una carga a medias
    imp.enCurso = false;
    S.aviso = { tipo: 'error', html: `No se pudo importar: ${esc(e.message || e)}. No se modificó el plan vigente.` };
    await recargar('importar');
  }
}

async function borrarCarga(id){
  const s = S.snapshots.find(x => x.id === id);
  if(!s) return;
  const enUso = snapActual() && snapActual().id === id;
  if(!confirm(`¿Eliminar el reporte del ${fechaCorta(s.fecha)}?${enUso ? ' Es el que está en uso: el plan va a volver al reporte anterior.' : ''} La gestión de los vendedores no se borra.`)) return;
  const { error } = await sb.from('comercial_snapshots').delete().eq('id', id);
  S.aviso = error ? { tipo: 'error', html: 'No se pudo eliminar: ' + esc(error.message) } : { tipo: 'ok', html: 'Reporte eliminado.' };
  await recargar('importar');
}

// ====== VENDEDORES ======
function sugerirUsuario(v){
  // Mismo nombre (sin importar orden ni segundos nombres) y que ese usuario no esté ya vinculado.
  // Solo se sugiere cuando la coincidencia es única en los dos sentidos.
  const usados = new Set(S.vendedores.map(x => x.user_id).filter(Boolean));
  const coincide = (vend, u) => {
    const tv = new Set(norm(vend.nombre).split(' '));
    const tu = norm(u.nombre).split(' ').filter(Boolean);
    return tu.length >= 2 && tu.every(t => tv.has(t));
  };
  if(v.email){
    const porEmail = S.usuarios.filter(u => !usados.has(u.user_id) && u.email === v.email.toLowerCase());
    if(porEmail.length === 1) return porEmail[0].user_id;
  }
  const cand = S.usuarios.filter(u => !usados.has(u.user_id) && coincide(v, u));
  if(cand.length !== 1) return null;
  const rivales = S.vendedores.filter(x => !x.user_id && coincide(x, cand[0]));
  return rivales.length === 1 ? cand[0].user_id : null;
}

// Vendedores activos con email que todavía no tienen usuario del Hub
function sinUsuario(){
  const conUsuario = new Set(S.usuarios.map(u => (u.email || '').toLowerCase()));
  return S.vendedores.filter(v => v.activo && !v.user_id && v.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email) && !conUsuario.has(v.email.toLowerCase()))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
}

async function crearUsuarios(btn){
  const faltan = sinUsuario();
  if(!faltan.length) return;
  if(btn.dataset.confirmar !== '1'){
    btn.dataset.confirmar = '1';
    btn.textContent = `Confirmar: crear ${faltan.length === 1 ? '1 usuario' : faltan.length + ' usuarios'} con su email como contraseña inicial`;
    return;
  }
  btn.disabled = true;
  const hechos = [], fallas = [];
  for(const [i, v] of faltan.entries()){
    btn.textContent = `Creando ${i + 1} de ${faltan.length}…`;
    const email = v.email.trim().toLowerCase();
    let msg = '';
    try {
      const { data, error } = await sb.functions.invoke('admin-usuarios', { body: { accion: 'crear', email, nombre: v.nombre, roles: ['comercial'], clave: email } });
      if(error){
        msg = error.message || 'No se pudo crear';
        try { const j = await error.context.json(); if(j && j.error) msg = j.error; } catch(_){}
      } else if(data && data.error) msg = data.error;
    } catch(e){ msg = e.message || String(e); }
    if(msg) fallas.push({ v, msg }); else hechos.push(v);
  }
  try {
    const [vendedores, usuarios] = await Promise.all([
      traerTodo('comercial_vendedores', 'id, nombre, nombre_erp, user_id, activo, email', 'id'),
      sb.rpc('comercial_usuarios')
    ]);
    S.vendedores = vendedores;
    if(!usuarios.error) S.usuarios = usuarios.data || [];
  } catch(_){}
  const sinVinculo = hechos.filter(h => !(S.vendedores.find(x => x.id === h.id) || {}).user_id);
  let html = '';
  if(hechos.length) html += `<div class="msg-box ok">${hechos.length === 1 ? 'Se creó 1 usuario' : `Se crearon ${hechos.length} usuarios`}: ${hechos.map(h => esc(h.nombre)).join(', ')}. Entran al Hub con su email; la contraseña inicial es ese mismo email y el Hub les pide cambiarla al primer ingreso.${sinVinculo.length ? ` Falta vincular a mano: ${sinVinculo.map(h => esc(h.nombre)).join(', ')}.` : ''}</div>`;
  if(fallas.length) html += `<div class="msg-box error">No se pudo crear: ${fallas.map(f => `${esc(f.v.nombre)} (${esc(f.msg)})`).join('; ')}.</div>`;
  renderVendedores(html);
}

async function guardarVendedor(tr){
  const id = Number(tr.dataset.vendedor);
  const v = S.vendedores.find(x => x.id === id);
  const btn = tr.querySelector('[data-v-guardar]');
  const nombre = tr.querySelector('[data-v-nombre]').value.trim();
  if(!nombre){ btn.title = 'El nombre no puede quedar vacío.'; return; }
  const cambios = { nombre, user_id: tr.querySelector('[data-v-usuario]').value || null, activo: tr.querySelector('[data-v-activo]').checked,
    email: tr.querySelector('[data-v-email]').value.trim().toLowerCase() || null };
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.from('comercial_vendedores').update(cambios).eq('id', id).select('id');
  if(error || !data || !data.length){
    btn.disabled = false; btn.textContent = 'Reintentar'; btn.title = error ? error.message : 'No se pudo guardar.';
    return;
  }
  Object.assign(v, cambios);
  for(const r of S.plan) if(r.vendedor_id === id) r.vendedor = nombre;
  S.misVendedores = new Set(S.vendedores.filter(x => x.user_id === S.perfil.user_id && x.activo).map(x => x.id));
  renderVendedores('');
}

async function agregarVendedor(){
  const nombre = $('nvNombre').value.trim();
  const erp = claveVendedor($('nvErp').value) || claveVendedor(nombre);
  if(!nombre) { $('nvNombre').focus(); return; }
  const { error } = await sb.from('comercial_vendedores').insert({ nombre, nombre_erp: erp }).select('id');
  S.aviso = error
    ? { tipo: 'error', html: /duplicate|unique/i.test(error.message) ? `Ya existe un vendedor que figura como “${esc(erp)}” en el reporte.` : 'No se pudo agregar: ' + esc(error.message) }
    : { tipo: 'ok', html: `Vendedor <strong>${esc(nombre)}</strong> agregado. Cuando el reporte lo traiga como “${esc(erp)}”, sus clientes se le asignan solos.` };
  await recargar('vendedores');
}

async function soloVinculados(){
  const n = S.vendedores.filter(v => v.activo && !v.user_id).length;
  if(!confirm(`¿Marcar como inactivos los ${n} vendedores sin usuario del Hub? Sus clientes no se borran: quedan agrupados para reasignar.`)) return;
  const { error } = await sb.from('comercial_vendedores').update({ activo: false }).is('user_id', null).eq('activo', true).select('id');
  S.aviso = error ? { tipo: 'error', html: 'No se pudo actualizar: ' + esc(error.message) } : { tipo: 'ok', html: `${n} vendedores quedaron inactivos.` };
  await recargar('vendedores');
}

// ====== AVANCE DE VENTAS: objetivos, ventas del sistema y actividades ======
const ACTIVIDADES = [['visitas', 'Visitas'], ['llamadas', 'Llamadas'], ['whatsapp', 'WhatsApp'], ['presupuestos', 'Presupuestos'], ['otras', 'Otras gestiones']];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function isoLocal(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sumarDias(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }
function lunesDe(iso){ const d = new Date(iso + 'T12:00:00'); return sumarDias(iso, -((d.getDay() + 6) % 7)); }
function esHabil(iso){ const w = new Date(iso + 'T12:00:00').getDay(); return w >= 1 && w <= 5; }
function habilesEntre(desde, hasta){ let n = 0; for(let d = desde; d <= hasta; d = sumarDias(d, 1)) if(esHabil(d)) n++; return n; }
function mesInfo(periodo){
  const [a, m] = periodo.split('-').map(Number);
  const dias = new Date(a, m, 0).getDate();
  const p = periodo + '-';
  return { desde: p + '01', hasta: p + String(dias).padStart(2, '0'), nombre: MESES[m - 1] + ' de ' + a };
}
function diaMes(iso){ return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
function pesos(v){ return v == null ? '—' : '$' + nf.format(Math.round(Number(v))); }
function semanasDelMes(periodo){
  const { desde, hasta } = mesInfo(periodo), out = [];
  for(let l = lunesDe(desde); l <= hasta; l = sumarDias(l, 7)) out.push({ lunes: l, ini: l < desde ? desde : l, fin: sumarDias(l, 6) > hasta ? hasta : sumarDias(l, 6) });
  return out;
}
// Fecha hasta la que hay ventas cargadas dentro del mes elegido
function fechaCorte(){
  const { desde, hasta } = mesInfo(S.periodo);
  let c = null;
  for(const k of S.cargas) if(k.hasta >= desde && k.desde <= hasta){ const h = k.hasta > hasta ? hasta : k.hasta; if(!c || h > c) c = h; }
  return c;
}
function avanceDe(ids){
  const { desde, hasta } = mesInfo(S.periodo);
  const set = ids === null ? null : new Set(ids);
  const mias = S.ventas.filter(v => set === null ? true : set.has(v.vendedor_id));
  const ventas = mias.reduce((s, v) => s + Number(v.importe || 0), 0);
  const objetivo = S.objetivos.filter(o => set === null ? true : set.has(o.vendedor_id)).reduce((s, o) => s + Number(o.monto || 0), 0);
  const corte = fechaCorte();
  const total = habilesEntre(desde, hasta);
  const pasados = corte ? habilesEntre(desde, corte) : 0;
  const restantes = total - pasados;
  const proyeccion = pasados > 0 ? ventas / pasados * total : null;
  const falta = Math.max(objetivo - ventas, 0);
  return { ventas, objetivo, corte, total, pasados, restantes, proyeccion, falta,
    pct: objetivo ? ventas / objetivo * 100 : null, ritmo: total ? pasados / total * 100 : 0,
    esperado: objetivo * (total ? pasados / total : 0), porDia: restantes > 0 ? falta / restantes : null };
}
function actividadDe(vendedorId, lunes){ return S.actividades.find(a => a.vendedor_id === vendedorId && a.semana === lunes) || null; }
function sumaAct(a, suf){ return a ? ACTIVIDADES.reduce((s, [k]) => s + Number(a[k + '_' + suf] || 0), 0) : 0; }
function puedeEditarVend(id){ return S.esAdmin || (S.esComercial && S.misVendedores.has(id)); }

function medidor(pct, ritmo){
  const w = Math.max(0, Math.min(100, pct || 0));
  return `<div class="meter"><div class="track">${ritmo != null ? `<span class="marca" style="left:${Math.min(100, ritmo)}%" title="Ritmo esperado"></span>` : ''}<div class="fill" style="width:${w}%"></div></div><span class="pct">${pct == null ? '—' : Math.round(pct) + '%'}</span></div>`;
}
function selectorMes(){
  return `<div class="mes-nav"><button class="btn-ghost small" data-mes="-1" aria-label="Mes anterior">‹</button>
    <input type="month" id="selMes" value="${S.periodo}" aria-label="Mes">
    <button class="btn-ghost small" data-mes="1" aria-label="Mes siguiente">›</button></div>`;
}

async function cargarPeriodo(){
  const { desde, hasta } = mesInfo(S.periodo);
  const [objetivos, ventas, actividades] = await Promise.all([
    traerTodo('comercial_objetivos', 'vendedor_id, periodo, monto', 'vendedor_id', q => q.eq('periodo', desde)),
    traerTodo('comercial_ventas_dia', 'fecha, vendedor_clave, vendedor_id, importe, operaciones', 'fecha', q => q.gte('fecha', desde).lte('fecha', hasta)),
    traerTodo('comercial_actividades', '*', 'semana', q => q.gte('semana', lunesDe(desde)).lte('semana', hasta))
  ]);
  S.objetivos = objetivos; S.ventas = ventas; S.actividades = actividades;
}
async function cambiarMes(periodo){
  if(!/^\d{4}-\d{2}$/.test(periodo)) return;
  S.periodo = periodo; S.semana = null;
  try{ await cargarPeriodo(); } catch(e){ S.aviso = { tipo: 'error', html: 'No se pudieron cargar los datos del mes: ' + esc(e.message || e) }; }
  ir(S.tab);
}

  }
  if(S.verVendedor){ renderDetalleVendedor(aviso, S.verVendedor); return; }
  const mes = mesInfo(S.periodo);
  const lunes = lunesDe(hoyISO());
  const activos = S.vendedores.filter(v => v.activo);
  const idsActivos = new Set(activos.map(v => v.id));
  const filas = activos.map(v => ({ v, a: avanceDe([v.id]), act: actividadDe(v.id, lunes) }))

    <div class="tiles">
      <div class="tile"><div class="label">Ventas del mes</div><div class="value">${plata(tot.ventas)}</div><div class="note">${tot.corte ? 'Datos al ' + diaMes(tot.corte) : 'Sin datos cargados'}</div></div>
      <div class="tile"><div class="label">Objetivo del equipo</div><div class="value">${plata(tot.objetivo)}</div><div class="note">${S.objetivos.length} ${S.objetivos.length === 1 ? 'vendedor con objetivo' : 'vendedores con objetivo'}</div></div>
      <div class="tile"><div class="label">Avance sobre el objetivo</div><div class="value">${conObj.pct == null ? '—' : Math.round(conObj.pct) + '%'}</div><div class="note">Ritmo esperado a la fecha: ${Math.round(tot.ritmo)}%</div></div>
      <div class="tile"><div class="label">Proyección al cierre</div><div class="value">${conObj.proyeccion == null ? '—' : plata(conObj.proyeccion)}</div><div class="note">Al ritmo actual, vendedores con objetivo</div></div>
      <div class="tile"><div class="label">Días hábiles</div><div class="value">${tot.pasados} de ${tot.total}</div><div class="note">Lunes a viernes, sin contar feriados</div></div>
    </div>
    <p class="sub">Hacé clic en un vendedor para ver su detalle y su plan semanal. La marca en la barra es el ritmo esperado a la fecha.</p>
    <div class="table-wrap"><table class="apilar resumen">
      <thead><tr><th>Vendedor</th><th class="num">Objetivo</th><th class="num">Ventas</th><th>Avance</th><th class="num">Falta</th><th class="num">Proyección</th><th class="num">Actividades de esta semana<br>hechas / planificadas</th></tr></thead>
      <tbody>
        ${filas.map(({ v, a, act }) => `
          <tr class="clickable" data-detalle="${v.id}">

function renderDetalleVendedor(aviso, id){
  const v = S.vendedores.find(x => x.id === id);
  const mes = mesInfo(S.periodo);
  const a = avanceDe([id]);
  const edita = puedeEditarVend(id);
  const hoyLunes = lunesDe(hoyISO());
  const semanas = semanasDelMes(S.periodo);
  if(!S.semana || !semanas.some(s => s.lunes === S.semana)) S.semana = (semanas.find(s => s.lunes === hoyLunes) || semanas[0]).lunes;
  const act = actividadDe(id, S.semana) || {};
  const dif = a.ventas - a.esperado;
  const ventasSem = s => S.ventas.filter(x => x.vendedor_id === id && x.fecha >= s.ini && x.fecha <= s.fin).reduce((t, x) => t + Number(x.importe || 0), 0);
  const celda = (r, k) => r ? `${Number(r[k + '_real'] || 0)} / ${Number(r[k + '_plan'] || 0)}` : '<span class="muted">—</span>';
  content().innerHTML = aviso + `
    ${S.veTodo ? `<button class="back-btn" data-volver-avance>← Todos los vendedores</button>` : ''}
    <div class="barra"><h2 class="sec" style="margin:0">${S.veTodo ? esc(v ? v.nombre : 'Vendedor') : 'Mi avance'} · ${mes.nombre}</h2>${selectorMes()}</div>
    ${a.corte ? '' : `<div class="msg-box info">Todavía no se cargaron ventas de ${mes.nombre}.</div>`}
    <div class="tiles">
      <div class="tile"><div class="label">Ventas del mes</div><div class="value">${plata(a.ventas)}</div><div class="note">${pesos(a.ventas)}${a.corte ? ' · datos al ' + diaMes(a.corte) : ''}</div></div>
      <div class="tile"><div class="label">Objetivo del mes</div><div class="value">${a.objetivo ? plata(a.objetivo) : '—'}</div><div class="note">${a.objetivo ? pesos(a.objetivo) : 'Todavía sin objetivo cargado'}</div></div>
      <div class="tile ancho"><div class="label">Avance sobre el objetivo</div><div class="value">${a.pct == null ? '—' : Math.round(a.pct) + '%'}</div>
        ${a.objetivo ? medidor(a.pct, a.ritmo) : ''}
        <div class="note">${a.objetivo && a.corte ? `Ritmo esperado a la fecha: ${Math.round(a.ritmo)}%. ${dif >= 0 ? 'Vas ' + pesos(dif) + ' arriba del ritmo.' : 'Vas ' + pesos(-dif) + ' abajo del ritmo.'}` : 'La marca muestra el ritmo esperado a la fecha.'}</div></div>
      <div class="tile"><div class="label">Proyección al cierre</div><div class="value">${a.proyeccion == null ? '—' : plata(a.proyeccion)}</div><div class="note">${a.proyeccion != null && a.objetivo ? Math.round(a.proyeccion / a.objetivo * 100) + '% del objetivo, al ritmo actual' : 'Al ritmo actual'}</div></div>
      <div class="tile"><div class="label">Para llegar al objetivo</div><div class="value">${a.objetivo ? (a.falta === 0 ? 'Cumplido' : (a.porDia == null ? '—' : plata(a.porDia))) : '—'}</div><div class="note">${a.objetivo && a.falta > 0 ? `por día hábil · faltan ${pesos(a.falta)} y ${a.restantes} ${a.restantes === 1 ? 'día' : 'días'}` : (a.objetivo ? 'Objetivo alcanzado' : '')}</div></div>
    </div>

    <h2 class="sec">Plan de la semana</h2>
    <p class="sub">Cuántas gestiones comerciales ${S.veTodo ? 'planifica' : 'vas a hacer'} en la semana y cuántas ${S.veTodo ? 'hizo' : 'llevás hechas'}. Se compara abajo con las ventas de cada semana.</p>
    <div class="card" id="planSemana" data-vendedor="${id}">
      <div class="mes-nav" style="margin-bottom:14px">
        <label for="selSemana" class="muted">Semana</label>
        <select id="selSemana">${semanas.map(s => `<option value="${s.lunes}" ${s.lunes === S.semana ? 'selected' : ''}>del ${diaMes(s.lunes)} al ${diaMes(sumarDias(s.lunes, 6))}${s.lunes === hoyLunes ? ' (esta semana)' : ''}</option>`).join('')}</select>
      </div>
      <div class="plan-grid">
        <div class="cab"></div><div class="cab">Planificadas</div><div class="cab">Hechas</div>
        ${ACTIVIDADES.map(([k, n]) => `
          <label for="p_${k}">${n}</label>
          <input type="number" min="0" step="1" inputmode="numeric" id="p_${k}" data-act="${k}_plan" value="${Number(act[k + '_plan'] || 0)}" ${edita ? '' : 'disabled'} aria-label="${n} planificadas">
          <input type="number" min="0" step="1" inputmode="numeric" data-act="${k}_real" value="${Number(act[k + '_real'] || 0)}" ${edita ? '' : 'disabled'} aria-label="${n} hechas">`).join('')}
      </div>
      <input type="text" id="planNota" maxlength="300" placeholder="Nota de la semana (zona, clientes clave, etc.)" value="${esc(act.nota || '')}" ${edita ? '' : 'disabled'} style="width:100%; margin-top:12px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13.5px">
      ${edita ? `<div class="form"><button class="btn-primary" id="btnGuardarPlan">Guardar plan</button><span class="muted" id="planEstado">${act.actualizado_en ? 'Última actualización ' + fechaHora(act.actualizado_en) : ''}</span></div>` : ''}
    </div>

    <h2 class="sec">Semana a semana</h2>
    <p class="sub">En cada actividad: hechas / planificadas. Las ventas son las del sistema dentro del mes.</p>
    <div class="table-wrap"><table class="apilar resumen">
      <thead><tr><th>Semana</th>${ACTIVIDADES.map(([, n]) => `<th class="num">${n}</th>`).join('')}<th class="num">Ventas</th></tr></thead>
      <tbody>
        ${semanas.map(s => { const r = actividadDe(id, s.lunes); return `
          <tr ${s.lunes === hoyLunes ? 'class="actual"' : ''}>
            <td data-label="Semana"><strong>${diaMes(s.ini)} al ${diaMes(s.fin)}</strong>${s.lunes === hoyLunes ? '<div class="muted">Esta semana</div>' : ''}</td>
            ${ACTIVIDADES.map(([k, n]) => `<td data-label="${n}" class="num">${celda(r, k)}</td>`).join('')}
            <td data-label="Ventas" class="num">${a.corte && s.ini <= a.corte ? pesos(ventasSem(s)) : '<span class="muted">—</span>'}</td>
          </tr>`; }).join('')}
        <tr class="total"><td data-label=""><strong>Total del mes</strong></td>
          ${ACTIVIDADES.map(([k, n]) => { const rs = semanas.map(s => actividadDe(id, s.lunes)).filter(Boolean); return `<td data-label="${n}" class="num">${rs.reduce((t, r) => t + Number(r[k + '_real'] || 0), 0)} / ${rs.reduce((t, r) => t + Number(r[k + '_plan'] || 0), 0)}</td>`; }).join('')}
          <td data-label="Ventas" class="num">${pesos(a.ventas)}</td></tr>
      </tbody>
    </table></div>`;
}

async function guardarPlan(){
  const caja = $('planSemana');
  const id = Number(caja.dataset.vendedor);
  const btn = $('btnGuardarPlan');
  const fila = { vendedor_id: id, semana: S.semana, nota: $('planNota').value.trim() || null };
  for(const inp of caja.querySelectorAll('[data-act]')){
    const n = Math.round(Number(inp.value));
    if(!Number.isFinite(n) || n < 0){ $('planEstado').textContent = 'Revisá las cantidades: tienen que ser números de 0 en adelante.'; inp.focus(); return; }
    fila[inp.dataset.act] = n;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.from('comercial_actividades').upsert(fila, { onConflict: 'vendedor_id,semana' }).select('*');
  btn.disabled = false; btn.textContent = 'Guardar plan';
  if(error || !data || !data.length){ $('planEstado').textContent = 'No se pudo guardar' + (error ? ': ' + error.message : '.'); return; }
  S.actividades = S.actividades.filter(a => !(a.vendedor_id === id && a.semana === S.semana)).concat(data[0]);

async function guardarObjetivos(){
  const { desde } = mesInfo(S.periodo);
  const guardar = [], quitar = [];
  for(const inp of content().querySelectorAll('[data-objetivo]')){
    const id = Number(inp.dataset.objetivo), txt = inp.value.trim();
    const actual = S.objetivos.find(o => o.vendedor_id === id);
    if(!txt){ if(actual) quitar.push(id); continue; }
    const n = aNumero(txt);
    if(n == null || n < 0){ $('objEstado').textContent = 'Hay un monto que no es un número válido.'; inp.focus(); return; }
    if(!actual || Number(actual.monto) !== n) guardar.push({ vendedor_id: id, periodo: desde, monto: n });
  }
  if(!guardar.length && !quitar.length){ $('objEstado').textContent = 'No hay cambios para guardar.'; return; }
  $('btnGuardarObjetivos').disabled = true;
  let error = null;
  if(guardar.length) ({ error } = await sb.from('comercial_objetivos').upsert(guardar, { onConflict: 'vendedor_id,periodo' }).select('vendedor_id'));
  for(const id of quitar){ if(error) break; ({ error } = await sb.from('comercial_objetivos').delete().eq('vendedor_id', id).eq('periodo', desde)); }
  S.aviso = error ? { tipo: 'error', html: 'No se pudieron guardar los objetivos: ' + esc(error.message) } : { tipo: 'ok', html: 'Objetivos guardados.' };
  try{ await cargarPeriodo(); } catch(_){}
  ir('objetivos');
}

async function copiarObjetivos(){
  const [a, m] = S.periodo.split('-').map(Number);
  const ant = m === 1 ? `${a - 1}-12` : `${a}-${String(m - 1).padStart(2, '0')}`;
  const { data, error } = await sb.from('comercial_objetivos').select('vendedor_id, monto').eq('periodo', ant + '-01');
  if(error || !data || !data.length){ $('objEstado').textContent = error ? 'No se pudo leer el mes anterior.' : 'El mes anterior no tiene objetivos cargados.'; return; }
  let n = 0;
  for(const o of data){ const inp = content().querySelector(`[data-objetivo="${o.vendedor_id}"]`); if(inp && !inp.value.trim()){ inp.value = nf.format(Number(o.monto)); n++; } }
  $('objEstado').textContent = n ? `Se completaron ${n} objetivos con los de ${mesInfo(ant).nombre}. Revisalos y tocá Guardar.` : 'Los vendedores con objetivo el mes anterior ya tienen uno cargado acá.';
}

// ====== CARGA DE VENTAS DEL SISTEMA ======
const CAMPOS_VENTAS = {
  vendedor: ['vendedor', 'nombre vendedor', 'vendedor asignado', 'viajante', 'vendedores'],
  importe: ['importe', 'total', 'importe total', 'total neto', 'neto', 'importe neto', 'neto gravado', 'monto', 'venta', 'ventas', 'subtotal', 'total venta', 'total comprobante', 'venta neta', 'ventas netas'],
  fecha: ['fecha', 'fecha comprobante', 'fecha emision', 'fecha de emision', 'emision', 'fecha factura', 'dia', 'fecha venta']
};
function mapearVentas(fila){
  const cab = (fila || []).map(norm), mapa = {};
  for(const [campo, alias] of Object.entries(CAMPOS_VENTAS)){
    let i = cab.findIndex(c => alias.includes(c));
    if(i < 0 && campo === 'importe') i = cab.findIndex(c => /^(total|importe|ventas?|neto)\b/.test(c));
    if(i >= 0) mapa[campo] = i;
  }
  return mapa;
}
function leerVentas(buffer, nombre){
  const wb = XLSX.read(buffer, { type: 'array' });
  let mejor = null;
  for(const hoja of wb.SheetNames){
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: null, blankrows: true });
    if(!filas.length) continue;
    for(let i = 0; i < Math.min(filas.length, 30); i++){
      const mapa = mapearVentas(filas[i]);
      if(mapa.vendedor != null && mapa.importe != null) return { archivo: nombre, hoja, filas, cabecera: i, mapa };
    }
    if(!mejor) mejor = { archivo: nombre, hoja, filas, cabecera: 0, mapa: mapearVentas(filas[0]) };
  }
  if(!mejor) throw new Error('El archivo no tiene datos.');
  return mejor;
}
// Busca a qué vendedor corresponde un nombre del archivo: nombre del sistema, alias guardado o parecido único
function resolverVendedor(clave){
  if(!clave) return '';
  const v = S.vendedores.find(x => x.nombre_erp === clave);
  if(v) return String(v.id);
  const al = S.alias.find(x => x.alias === clave);
  if(al) return String(al.vendedor_id);
  const tk = norm(clave).split(' ').filter(t => t.length > 1);
  if(!tk.length) return '';
  const cand = S.vendedores.filter(x => { const tv = new Set(norm(x.nombre + ' ' + x.nombre_erp).split(' ')); return tk.every(t => tv.has(t)); });
  return cand.length === 1 ? String(cand[0].id) : '';
}
function procesarVentas(){
  const im = S.impVentas, m = im.mapa;
  const datos = im.filas.slice(im.cabecera + 1);
  const hayFecha = m.fecha != null;
  const fechaFija = im.fecha || hoyISO();
  const filas = [];
  let sinImporte = 0, sinFecha = 0;
  if(m.vendedor != null && m.importe != null) for(const f of datos){
    const nombre = aTexto(f[m.vendedor]);
    const importe = aNumero(f[m.importe]);
    if(nombre && /^total/i.test(nombre)) continue;
    if(importe == null){ if(nombre) sinImporte++; continue; }
    let fecha = fechaFija;
    if(hayFecha){ fecha = aFecha(f[m.fecha]); if(!fecha){ sinFecha++; continue; } }
    filas.push({ fecha, clave: claveVendedor(nombre) || '', importe });
  }
  const porNombre = new Map();
  for(const r of filas){ const o = porNombre.get(r.clave) || { clave: r.clave, n: 0, total: 0 }; o.n++; o.total += r.importe; porNombre.set(r.clave, o); }
  for(const o of porNombre.values()) if(!(o.clave in im.asignacion)) im.asignacion[o.clave] = resolverVendedor(o.clave) || (o.clave ? '_nuevo' : '');
  let desde = null, hasta = null;
  if(filas.length){
    if(hayFecha){ desde = filas.reduce((a, r) => r.fecha < a ? r.fecha : a, filas[0].fecha); hasta = filas.reduce((a, r) => r.fecha > a ? r.fecha : a, filas[0].fecha); }
    else { hasta = fechaFija; desde = im.modo === 'dia' ? fechaFija : fechaFija.slice(0, 8) + '01'; }
  }
  return { filas, nombres: [...porNombre.values()].sort((a, b) => b.total - a.total), sinImporte, sinFecha, desde, hasta, total: filas.reduce((s, r) => s + r.importe, 0), hayFecha };
}

async function elegirVentas(file){
  S.impVentas = { error: null };
  try{
    await cargarLector();
    S.impVentas = { ...leerVentas(new Uint8Array(await file.arrayBuffer()), file.name), asignacion: {}, fecha: hoyISO(), modo: 'mes' };
  } catch(e){ S.impVentas = { error: e.message || String(e) }; }
  renderVentas('');
}

async function cargarVentas(){
  const im = S.impVentas, p = procesarVentas();
  if(!p.filas.length) return;
  im.enCurso = true;
  $('btnCargarVentas').disabled = true;
  const estado = t => { $('ventasEstado').textContent = t; };
  try{
    // 1) vendedores nuevos
    const ids = {}, creados = new Set();
    for(const o of p.nombres){
      const a = im.asignacion[o.clave];
      if(a === '_nuevo'){
        estado('Creando vendedor ' + o.clave + '…');
        const nombre = o.clave.includes(',') ? o.clave.split(',').reverse().map(s => s.trim()).join(' ') : o.clave;
        const { data, error } = await sb.from('comercial_vendedores').insert({ nombre: nombre.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()), nombre_erp: o.clave }).select('id');
        if(error) throw error;
        ids[o.clave] = data[0].id;
        im.asignacion[o.clave] = String(data[0].id);
        creados.add(o.clave);
      } else ids[o.clave] = a ? Number(a) : null;
    }
    // 2) recordar cómo figura cada vendedor en el archivo
    const alias = p.nombres.filter(o => o.clave && ids[o.clave] && !creados.has(o.clave) && !S.vendedores.some(v => v.id === ids[o.clave] && v.nombre_erp === o.clave))
      .map(o => ({ alias: o.clave, vendedor_id: ids[o.clave] }));
    if(alias.length){
      const { error } = await sb.from('comercial_vendedor_alias').upsert(alias, { onConflict: 'alias' }).select('alias');
      if(error) throw error;
    }
    // 3) resumen por día y vendedor, en una sola operación
    const agg = new Map();
    for(const r of p.filas){
      const k = r.fecha + '|' + r.clave;
      const o = agg.get(k) || { fecha: r.fecha, vendedor: r.clave || null, vendedor_id: ids[r.clave] ?? null, importe: 0, operaciones: 0 };
      o.importe += r.importe; o.operaciones++; agg.set(k, o);
    }
    const filas = [...agg.values()].map(o => ({ ...o, importe: Math.round(o.importe * 100) / 100 }));
    estado('Cargando ventas…');
    const { data, error } = await sb.rpc('comercial_ventas_cargar', { p_archivo: im.archivo, p_desde: p.desde, p_hasta: p.hasta, p_filas: filas });
    if(error) throw error;
    S.impVentas = null;
    S.periodo = p.hasta.slice(0, 7);
    S.aviso = { tipo: 'ok', html: `Ventas cargadas: <strong>${num(p.filas.length)}</strong> ventas por <strong>${pesos(data.total)}</strong>, ${p.desde === p.hasta ? 'del ' + fechaCorta(p.desde) : 'del ' + fechaCorta(p.desde) + ' al ' + fechaCorta(p.hasta)}.` };
    await recargar('avance');
  } catch(e){
    im.enCurso = false;
    S.aviso = { tipo: 'error', html: `No se pudieron cargar las ventas: ${esc(e.message || e)}. Los datos que ya estaban no cambiaron.` };
    await recargar('ventas');
  }
}

content().addEventListener('change', e => {

    if(t.matches('[data-mapa]')){ if(t.value === '') delete im.mapa[t.dataset.mapa]; else im.mapa[t.dataset.mapa] = Number(t.value); im.asignacion = {}; renderVentas(''); return; }
    if(t.id === 'vCabecera'){ const n = Math.round(Number(t.value)); if(n >= 1 && n <= im.filas.length){ im.cabecera = n - 1; im.mapa = mapearVentas(im.filas[im.cabecera]); im.asignacion = {}; } renderVentas(''); return; }
    if(t.id === 'vFecha'){ im.fecha = t.value || hoyISO(); renderVentas(''); return; }
    if(t.name === 'vModo'){ im.modo = t.value; renderVentas(''); return; }
    if(t.matches('[data-asignar]')){ im.asignacion[t.dataset.asignar] = t.value; return; }
  }
  if(t.matches('[data-reasignar]')){ reasignar(t); return; }
  if(t.matches('[data-estado]')){ t.closest('tr').querySelector('[data-guardar]').disabled = false; return; }
  if(t.matches('[data-v-usuario], [data-v-activo]')){ t.closest('tr').querySelector('[data-v-guardar]').disabled = false; return; }
  if(t.id === 'impArchivo' && t.files[0]){ elegirArchivo(t.files[0]); return; }
  if(t.id === 'impFecha' && S.importacion){ S.importacion.fecha = t.value; }
});

let esperaBusqueda = null;
content().addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'fQ'){
    clearTimeout(esperaBusqueda);
    esperaBusqueda = setTimeout(() => { S.filtros.q = t.value; S.mostrar = POR_PAGINA; pintarLista(); }, 200);
    return;
  }
  if(t.matches('[data-comentario]')){ t.closest('tr').querySelector('[data-guardar]').disabled = false; return; }
  if(t.matches('[data-v-nombre], [data-v-email]')){ t.closest('tr').querySelector('[data-v-guardar]').disabled = false; }
});
content().addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[data-comentario]')){
    const b = e.target.closest('tr').querySelector('[data-guardar]');
    if(!b.disabled) guardarGestion(e.target.closest('tr'));
  }
});
content().addEventListener('dragover', e => { const d = e.target.closest('.dropzone'); if(d){ e.preventDefault(); d.classList.add('dragging'); } });
content().addEventListener('dragleave', e => { const d = e.target.closest('.dropzone'); if(d) d.classList.remove('dragging'); });
content().addEventListener('drop', e => {
  const d = e.target.closest('.dropzone');
  if(!d) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f) (d.id === 'dropVentas' ? elegirVentas : elegirArchivo)(f);
});

$('btnSalir').onclick = async () => { await sb.auth.signOut(); renderLogin(); };

// ====== ARRANQUE ======
// El logo vive embebido en la página principal del Hub: se toma de ahí para no duplicarlo.
fetch('./').then(r => r.ok ? r.text() : '').then(t => {
  const m = t.match(/<img src="(data:image\/[^"]+)"/);
  if(m){ $('logo').src = m[1]; $('logo').classList.remove('hidden'); }
}).catch(() => {});

sb.auth.getSession().then(({ data }) => {
  if(data.session) iniciar(data.session);
  else renderLogin();
});
})();
</script>
