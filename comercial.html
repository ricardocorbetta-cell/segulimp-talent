  const filas = im.archivos.flatMap(a => a.filas);
  const porNombre = new Map();
  for(const r of filas){ const o = porNombre.get(r.clave) || { clave: r.clave, n: 0, total: 0 }; o.n++; o.total += r.importe; porNombre.set(r.clave, o); }
  for(const o of porNombre.values()) if(!(o.clave in im.asignacion)) im.asignacion[o.clave] = resolverVendedor(o.clave) || (o.clave ? '_nuevo' : '');
  const enCartera = new Set(S.plan.map(r => claveNombre(r.nombre))), vistos = new Set();
  let nNuevos = 0;
  for(const r of filas){
    if(!r.cnom) continue;
    const k = claveNombre(r.cnom);
    if(vistos.has(k)) continue;
    vistos.add(k);
    if(!enCartera.has(k)) nNuevos++;
  }
  return { filas, nombres: [...porNombre.values()].sort((a, b) => b.total - a.total), sinImporte: 0, sinFecha: im.archivos.reduce((a, x) => a + x.sinFecha, 0),
    desde: im.archivos.reduce((a, x) => x.desde < a ? x.desde : a, im.archivos[0].desde), hasta: im.archivos.reduce((a, x) => x.hasta > a ? x.hasta : a, im.archivos[0].hasta),
    total: filas.reduce((a, r) => a + r.importe, 0), hayFecha: true, hayCliente: true, nClientes: vistos.size, nNuevos };
}

// Vendedores nuevos y alias: común a las dos formas de carga. Devuelve el id que corresponde a cada nombre del archivo.
async function resolverVendedoresCarga(p, im, estado){
  const ids = {}, creados = new Set();
  for(const o of p.nombres){
    const a = im.asignacion[o.clave];
    if(a === '_nuevo'){
      estado('Creando vendedor ' + o.clave + '…');
      const nombre = o.clave.includes(',') ? o.clave.split(',').reverse().map(s => s.trim()).join(' ') : o.clave;
      const { data, error } = await sb.from('comercial_vendedores').insert({ nombre: nombre.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()), nombre_erp: o.clave }).select('id');
      if(error) throw error;
      ids[o.clave] = data[0].id;
      im.asignacion[o.clave] = String(data[0].id);
      creados.add(o.clave);
    } else ids[o.clave] = a ? Number(a) : null;
  }
  const alias = p.nombres.filter(o => o.clave && ids[o.clave] && !creados.has(o.clave) && !S.vendedores.some(v => v.id === ids[o.clave] && v.nombre_erp === o.clave))
    .map(o => ({ alias: o.clave, vendedor_id: ids[o.clave] }));
  if(alias.length){
    const { error } = await sb.from('comercial_vendedor_alias').upsert(alias, { onConflict: 'alias' }).select('alias');
    if(error) throw error;
  }
  return ids;
}
async function cargarReportes(){
  const im = S.impVentas, p = procesarVentas();
  if(!p.filas.length) return;
  im.enCurso = true;
  $('btnCargarVentas').disabled = true;
  const estado = t => { const e = $('ventasEstado'); if(e) e.textContent = t; };
  let hechos = 0, total = 0, comprobantes = 0, nuevos = 0, lineas = 0;
  try{
    const ids = await resolverVendedoresCarga(p, im, estado);
    for(const [i, a] of im.archivos.entries()){
      estado(im.archivos.length === 1 ? 'Cargando ventas…' : `Cargando ${i + 1} de ${im.archivos.length}: ${a.nombre}`);
      const agg = new Map();
      for(const r of a.filas){
        const k = r.fecha + '|' + r.clave + '|' + (r.cnom ? claveNombre(r.cnom) : '');
        const o = agg.get(k) || { fecha: r.fecha, vendedor: r.clave || null, vendedor_id: ids[r.clave] ?? null, importe: 0, operaciones: 0 };
        if(r.cnom && !o.cliente) o.cliente = r.cnom;
        o.importe += r.importe; o.operaciones++; agg.set(k, o);
      }
      const filas = [...agg.values()].map(o => ({ ...o, importe: Math.round(o.importe * 100) / 100 }));
      const { data, error } = await sb.rpc('comercial_ventas_cargar', { p_archivo: a.nombre, p_desde: a.desde, p_hasta: a.hasta, p_filas: filas });
      if(error) throw new Error(`${a.nombre}: ${error.message}`);
      if(a.lineas && a.lineas.length){
        // el detalle por artículo va en una segunda llamada, con el mismo rango de fechas
        estado(im.archivos.length === 1 ? 'Cargando el detalle por artículo…' : `Artículos ${i + 1} de ${im.archivos.length}: ${a.nombre}`);
        const lin = new Map();
        for(const r of a.lineas){
          const k = [r.fecha, r.clave, r.cnom ? claveNombre(r.cnom) : '', r.codigo || '~' + claveNombre(r.articulo || '')].join('|');
          const o = lin.get(k) || { fecha: r.fecha, vendedor: r.clave || null, cliente: r.cnom, codigo: r.codigo, articulo: r.articulo, rubro: r.rubro, proveedor: r.proveedor, cantidad: 0, neto: 0, utilidad: 0 };
          o.cantidad += r.cantidad; o.neto += r.neto; o.utilidad += r.utilidad;
          if(!o.articulo && r.articulo) o.articulo = r.articulo;
          lin.set(k, o);
        }
        const r2 = await sb.rpc('comercial_articulos_cargar', { p_archivo: a.nombre, p_desde: a.desde, p_hasta: a.hasta,
          p_filas: [...lin.values()].map(o => ({ ...o, neto: Math.round(o.neto * 100) / 100, utilidad: Math.round(o.utilidad * 100) / 100 })) });
        if(r2.error) throw new Error(`${a.nombre} (detalle por artículo): ${r2.error.message}`);
        lineas += a.lineas.length;
      }
      hechos++; total += Number(data.total || 0); comprobantes += a.filas.length; nuevos += Number(data.clientes_nuevos || 0);
    }
    S.impVentas = null;
    S.periodo = periodoDe(p.hasta);
    S.aviso = { tipo: 'ok', html: `${hechos === 1 ? 'Reporte cargado' : `Se cargaron <strong>${num(hechos)}</strong> reportes`}: <strong>${num(comprobantes)}</strong> comprobantes por <strong>${pesos(total)}</strong>${lineas ? ` (${num(lineas)} líneas de artículo)` : ''}, del ${fechaCorta(p.desde)} al ${fechaCorta(p.hasta)}.${nuevos ? ` Se agregaron ${num(nuevos)} clientes que no estaban en la cartera.` : ''}` };
    await recargar('avance');
  } catch(e){
    im.enCurso = false;
    S.aviso = { tipo: 'error', html: `No se pudo terminar la carga: ${esc(e.message || e)}. ${hechos ? `Quedaron cargados ${num(hechos)} de ${num(im.archivos.length)} reportes. ` : 'Los datos que ya estaban no cambiaron. '}Podés volver a intentar: cargar de nuevo un reporte no duplica nada.` };
    await recargar('ventas');
  }
}

function procesarVentas(){
  if(S.impVentas.tipo === 'reporte') return procesarReportes();
  const im = S.impVentas, m = im.mapa;
  const datos = im.filas.slice(im.cabecera + 1);
  const hayFecha = m.fecha != null;
  const fechaFija = im.fecha || hoyISO();
  const filas = [];
  let sinImporte = 0, sinFecha = 0;
  if(m.vendedor != null && m.importe != null) for(const f of datos){
    const nombre = aTexto(f[m.vendedor]);
    const importe = aNumero(f[m.importe]);
    if(nombre && /^total/i.test(nombre)) continue;
    if(importe == null){ if(nombre) sinImporte++; continue; }
    let fecha = fechaFija;
    if(hayFecha){ fecha = aFecha(f[m.fecha]); if(!fecha){ sinFecha++; continue; } }
    filas.push({ fecha, clave: claveVendedor(nombre) || '', importe,
      ccod: m.cliente_codigo != null ? aTexto(f[m.cliente_codigo]) : null, cnom: m.cliente != null ? aTexto(f[m.cliente]) : null });
  }
  const hayCliente = m.cliente_codigo != null || m.cliente != null;
  const enCartera = new Set(S.plan.map(r => r.codigo)), vistos = new Set();
  let nNuevos = 0;
  if(hayCliente) for(const r of filas){
    const k = r.ccod || (r.cnom ? '~' + norm(r.cnom) : '');
    if(!k || vistos.has(k)) continue;
    vistos.add(k);
    if(r.ccod && !enCartera.has(r.ccod)) nNuevos++;
  }
  const porNombre = new Map();
  for(const r of filas){ const o = porNombre.get(r.clave) || { clave: r.clave, n: 0, total: 0 }; o.n++; o.total += r.importe; porNombre.set(r.clave, o); }
  for(const o of porNombre.values()) if(!(o.clave in im.asignacion)) im.asignacion[o.clave] = resolverVendedor(o.clave) || (o.clave ? '_nuevo' : '');
  let desde = null, hasta = null;
  if(filas.length){
    if(hayFecha){ desde = filas.reduce((a, r) => r.fecha < a ? r.fecha : a, filas[0].fecha); hasta = filas.reduce((a, r) => r.fecha > a ? r.fecha : a, filas[0].fecha); }
    else { hasta = fechaFija; desde = im.modo === 'dia' ? fechaFija : mesInfo(periodoDe(fechaFija)).desde; }
  }
  return { filas, nombres: [...porNombre.values()].sort((a, b) => b.total - a.total), sinImporte, sinFecha, desde, hasta, total: filas.reduce((s, r) => s + r.importe, 0), hayFecha,
    hayCliente, nClientes: vistos.size, nNuevos };
}

async function elegirVentas(sel){
  const files = sel instanceof File ? [sel] : [...sel];
  if(!files.length) return;
  S.impVentas = { error: null, leyendo: 'Leyendo…' };
  renderVentas('');
  const avisar = t => { const e = $('ventasLeyendo'); if(e) e.textContent = t; return new Promise(r => setTimeout(r, 0)); };
  try{
    await cargarLector();
    const archivos = await abrirArchivosVentas(files);
    if(!archivos.length) throw new Error('No encontré ningún Excel en lo que subiste.');
    const reportes = [], otros = [];
    for(const [i, a] of archivos.entries()){
      await avisar(archivos.length === 1 ? `Leyendo ${a.nombre}…` : `Leyendo ${i + 1} de ${archivos.length}: ${a.nombre}`);
      let rep = null;
      try{
        const wb = XLSX.read(a.datos, { type: 'array' });
        for(const hoja of wb.SheetNames){
          rep = aplanarReporte(XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: null, blankrows: true }));
          if(rep) break;
        }
      } catch(e){ otros.push({ nombre: a.nombre, error: e.message || 'no se pudo abrir' }); continue; }
      if(!rep){ otros.push({ nombre: a.nombre, datos: a.datos, error: 'no tiene el formato del reporte de ventas' }); continue; }
      if(!rep.filas.length){ otros.push({ nombre: a.nombre, error: 'no trae comprobantes' }); continue; }
      let desde = rep.filas.reduce((m, r) => r.fecha < m ? r.fecha : m, rep.filas[0].fecha), hasta = rep.filas.reduce((m, r) => r.fecha > m ? r.fecha : m, rep.filas[0].fecha);
      const rn = rangoDeNombre(a.nombre);
      if(rn && rn.desde <= desde && rn.hasta >= hasta && rn.hasta <= hoyISO()){ desde = rn.desde; hasta = rn.hasta; }
      reportes.push({ nombre: a.nombre, ...rep, desde, hasta });
    }
    if(reportes.length){
      reportes.sort((a, b) => a.desde.localeCompare(b.desde) || a.hasta.localeCompare(b.hasta));
      S.impVentas = { tipo: 'reporte', archivos: reportes, descartados: otros.map(o => ({ nombre: o.nombre, error: o.error })), asignacion: {} };
    } else if(archivos.length === 1 && otros[0] && otros[0].datos){
      S.impVentas = { ...leerVentas(otros[0].datos, otros[0].nombre), asignacion: {}, fecha: hoyISO(), modo: 'mes' };
    } else throw new Error(otros.length === 1 ? `${otros[0].nombre}: ${otros[0].error}.` : 'Ninguno de los archivos tiene el formato del reporte de ventas del sistema. Si es una lista simple (vendedor e importe), subila de a un archivo.');
  } catch(e){ S.impVentas = { error: e.message || String(e) }; }
  renderVentas('');
}

async function cargarVentas(){
  if(S.impVentas.tipo === 'reporte') return cargarReportes();
  const im = S.impVentas, p = procesarVentas();
  if(!p.filas.length) return;
  im.enCurso = true;
  $('btnCargarVentas').disabled = true;
  const estado = t => { $('ventasEstado').textContent = t; };
  try{
    const ids = await resolverVendedoresCarga(p, im, estado);
    // 3) resumen por día y vendedor, en una sola operación
    const agg = new Map();
    for(const r of p.filas){
      const k = r.fecha + '|' + r.clave + '|' + (r.ccod || (r.cnom ? '~' + norm(r.cnom) : ''));
      const o = agg.get(k) || { fecha: r.fecha, vendedor: r.clave || null, vendedor_id: ids[r.clave] ?? null, importe: 0, operaciones: 0 };
      if(r.ccod) o.cliente_codigo = r.ccod;
      if(r.cnom && !o.cliente) o.cliente = r.cnom;
      o.importe += r.importe; o.operaciones++; agg.set(k, o);
    }
    const filas = [...agg.values()].map(o => ({ ...o, importe: Math.round(o.importe * 100) / 100 }));
    estado('Cargando ventas…');
    const { data, error } = await sb.rpc('comercial_ventas_cargar', { p_archivo: im.archivo, p_desde: p.desde, p_hasta: p.hasta, p_filas: filas });
    if(error) throw error;
    S.impVentas = null;
    S.periodo = periodoDe(p.hasta);
    S.aviso = { tipo: 'ok', html: `Ventas cargadas: <strong>${num(p.filas.length)}</strong> ventas por <strong>${pesos(data.total)}</strong>, ${p.desde === p.hasta ? 'del ' + fechaCorta(p.desde) : 'del ' + fechaCorta(p.desde) + ' al ' + fechaCorta(p.hasta)}.${data.clientes ? ` Clientes con ventas: <strong>${num(data.clientes)}</strong>${data.clientes_nuevos ? `, ${num(data.clientes_nuevos)} nuevos` : ''}${data.reasignados ? `, ${num(data.reasignados)} cambiaron de vendedor` : ''}.` : ''}` };
    await recargar('avance');
  } catch(e){
    im.enCurso = false;
    S.aviso = { tipo: 'error', html: `No se pudieron cargar las ventas: ${esc(e.message || e)}. Los datos que ya estaban no cambiaron.` };
    await recargar('ventas');
  }
}

// Equipos entregados en comodato (base de comodatos). Se cuentan como instalados salvo los informados como retirados.
async function cargarComodatos(){ await traerComodatos(); await completarComodatos(); }
async function traerComodatos(){
  S.comodatos = []; S.comCli = []; S.comExtra = [];
  try {
    [S.comodatos, S.comCli] = await Promise.all([
      traerTodo('comodatos_estado', 'id, cliente_id, cliente_planilla, codigo, linea, descripcion, cantidad, retirados, ubicados, fecha, nota, origen, retiro_nota', 'id'),
      traerTodo('comodatos_clientes', 'cliente_id, equipos, retirados, codigos, primera_entrega, ultima_entrega, ventas_12m, ventas_3m, ultima_compra', 'cliente_id')]);
  } catch(_){ S.comodatos = []; S.comCli = []; }
  indexarComodatos();
}
// clientes con equipos que no están en la cartera (solo administración): se piden todos los lotes a la vez
async function completarComodatos(){
  S.comExtra = [];
  if(!S.veTodo || !S.comodatos.length) return;
  const enPlan = new Set(S.plan.map(r => r.cliente_id));
  const faltan = [...new Set(S.comodatos.map(c => c.cliente_id).filter(id => id && !enPlan.has(id)))];
  const lotes = [];
  for(let i = 0; i < faltan.length; i += 150) lotes.push(faltan.slice(i, i + 150));
  const res = await Promise.all(lotes.map(l => sb.from('comercial_clientes').select('id, codigo, nombre, localidad, vendedor_id, listado').in('id', l).then(r => r.data || [], () => [])));
  for(const d of res) S.comExtra.push(...d);
}
function indexarComodatos(){
  S.comPorCli = new Map();
  for(const c of S.comodatos){
    if(!c.cliente_id) continue;
    if(!S.comPorCli.has(c.cliente_id)) S.comPorCli.set(c.cliente_id, []);
    S.comPorCli.get(c.cliente_id).push(c);
  }
  S.comResumen = new Map(S.comCli.map(x => [x.cliente_id, x]));
}
function instalados(c){ return Math.max(0, Number(c.cantidad) - Number(c.retirados || 0)); }
function equiposDe(id){ return (S.comPorCli.get(id) || []).reduce((s, c) => s + instalados(c), 0); }
function nombreCodigo(c){ return c.descripcion ? `${c.descripcion} (${c.codigo})` : `Código ${c.codigo}`; }
function porCodigo(lista){
  const m = new Map();
  for(const c of lista){ const k = c.codigo; const o = m.get(k) || { codigo: k, descripcion: c.descripcion, linea: c.linea, n: 0 }; o.n += instalados(c); m.set(k, o); }
  return [...m.values()].filter(o => o.n > 0).sort((a, b) => b.n - a.n);
}
function chipComodato(id){
  const n = equiposDe(id);
  if(!n) return '';
  const x = S.comResumen.get(id);
  return x && Number(x.ventas_3m) <= 0 ? `<span class="chip alta">Tiene ${num(n)} equipos y no compró en 3 meses</span>` : '';
}
function bloqueComodatoCard(id){
  const lista = (S.comPorCli.get(id) || []).filter(c => instalados(c) > 0 || c.retirados);
  const n = equiposDe(id);
  if(!lista.length) return '';
  const abierto = S.mc.com === id;
  const cods = porCodigo(lista);

      <span>Comodato: <b>${num(n)} ${n === 1 ? 'equipo' : 'equipos'}</b>${cods.length > 1 ? ` de ${cods.length} tipos` : ''}</span><span class="ver">${abierto ? 'Ocultar' : 'Ver'}</span></button>
    ${abierto ? `<div class="mc-com-l">${cods.map(o => `
      <div class="mc-com-f"><span class="c">${esc(nombreCodigo(o))}</span><span class="n">${num(o.n)}</span></div>`).join('')}
      <div class="mc-com-f"><span class="d">Última entrega ${fechaCorta(lista.map(c => c.fecha).filter(Boolean).sort().pop())}</span>
        <span class="r"><button type="button" class="link-btn" data-com-entregas="${id}">${entregas ? 'Ocultar entregas' : 'Avisar que se retiró un equipo'}</button></span></div>
      ${entregas ? lista.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || ''))).map(c => `
      <div class="mc-com-f" data-com-id="${c.id}">
        <span class="c">${esc(nombreCodigo(c))}</span><span class="n">${num(instalados(c))}</span>
        <span class="d">Entregado ${fechaCorta(c.fecha)}${c.retirados ? ` · ${num(c.retirados)} retirado${c.retirados === 1 ? '' : 's'}` : ''}</span>
        ${S.mc.ret === c.id ? `<span class="r"><label class="muted" for="ret${c.id}">Retirados (de ${num(c.cantidad)})</label><input type="number" id="ret${c.id}" data-com-cant min="0" max="${c.cantidad}" value="${Math.min(c.cantidad, Number(c.retirados || 0) + 1)}" inputmode="numeric"><button type="button" class="btn-primary small" data-com-guardar>Guardar</button><button type="button" class="btn-ghost small" data-com-cancelar>Cancelar</button></span><span class="mc-err" data-com-err></span>`
          : `<span class="r"><button type="button" class="link-btn" data-com-retiro="${c.id}">Se retiró de esta entrega</button></span>`}
      </div>`).join('') : ''}</div>` : ''}`;
}
async function guardarRetiro(fila, cant, nota){
  const id = Number(fila.dataset.comId);
  const err = fila.querySelector('[data-com-err]');
  const c = S.comodatos.find(x => x.id === id);
  const n = Math.round(Number(cant));
  if(!c || !(n >= 0 && n <= c.cantidad)){ if(err) err.textContent = `Poné un número entre 0 y ${c ? c.cantidad : 0}.`; return false; }
  let res;
  try { res = await sb.rpc('comodatos_retirar', { p_id: id, p_cantidad: n, p_nota: nota || null }); } catch(e){ res = { error: e }; }
  if(res.error){ if(err) err.textContent = res.error.message || 'No se pudo guardar.'; return false; }
  c.retirados = n;
  try { S.comCli = await traerTodo('comodatos_clientes', 'cliente_id, equipos, retirados, codigos, primera_entrega, ultima_entrega, ventas_12m, ventas_3m, ultima_compra', 'cliente_id'); } catch(_){}
  indexarComodatos();
  return true;
}

// --- Vista de administración ---
function clienteCom(id){
  const r = S.plan.find(p => p.cliente_id === id);
  if(r) return { id, codigo: r.codigo, nombre: r.nombre, localidad: r.localidad, vendedor_id: r.vendedor_id, enCartera: true };
  const x = S.comExtra.find(p => p.id === id);
  return x ? { id, codigo: x.codigo, nombre: x.nombre, localidad: x.localidad, vendedor_id: x.vendedor_id, enCartera: false } : { id, codigo: '', nombre: 'Cliente ' + id, enCartera: false };
}
function filasComodato(){
  const vend = new Map(S.vendedores.map(v => [v.id, v]));
  const filas = [];
  for(const [id, lista] of S.comPorCli){
    const eq = lista.reduce((s, c) => s + instalados(c), 0);
    if(!eq) continue;
    const cl = clienteCom(id), x = S.comResumen.get(id) || {};
    const v = cl.vendedor_id ? vend.get(cl.vendedor_id) : null;
    const v12 = Number(x.ventas_12m || 0), v3 = Number(x.ventas_3m || 0);
    filas.push({ id, cl, eq, lista, v12, v3, ult: x.ultima_compra, entrega: x.ultima_entrega,
      vendedor: !cl.enCartera ? 'Fuera de cartera' : (v && v.activo ? v.nombre : (cl.vendedor_id ? 'Vendedor inactivo' : 'Pileta')),
      vendedorId: cl.enCartera ? (cl.vendedor_id && v && v.activo ? cl.vendedor_id : '_pileta') : '_fuera',
      porEq: v12 / eq / 12 });
  }
  const base = filas.filter(f => f.cl.enCartera && f.v12 > 0).map(f => f.porEq).sort((a, b) => a - b);
  const mediana = base.length ? base[Math.floor(base.length / 2)] : 0;
  for(const f of filas){
    f.senal = !f.cl.enCartera ? ['fuera', 'Fuera de cartera', 'alta']
      : (f.v12 <= 0 ? ['sin12', 'Sin compras en 12 meses', 'alta']
      : (f.v3 <= 0 ? ['sin3', 'Sin compras en 3 meses', 'media']
      : (f.porEq < mediana / 4 ? ['poco', 'Compra poco para los equipos que tiene', 'media'] : ['ok', 'Compra', 'ok'])));
  }
  return { filas, mediana };
}
const FILTROS_COM = [
  ['todos', 'Todos', () => true],
  ['oportunidad', 'Oportunidades', f => f.cl.enCartera && f.senal[0] !== 'ok'],
  ['sin3', 'Sin compras en 3 meses', f => f.cl.enCartera && (f.senal[0] === 'sin3' || f.senal[0] === 'sin12')],
  ['poco', 'Compra poco', f => f.senal[0] === 'poco'],
  ['fuera', 'Fuera de cartera', f => !f.cl.enCartera]
];

  const op = enC.filter(f => f.senal[0] !== 'ok');
  // por vendedor

  for(const f of filas){
    const o = pv.get(f.vendedorId) || { id: f.vendedorId, nombre: f.vendedor, cli: 0, eq: 0, v12: 0, op: 0, opEq: 0 };
    o.cli++; o.eq += f.eq; o.v12 += f.v12; if(f.cl.enCartera && f.senal[0] !== 'ok'){ o.op++; o.opEq += f.eq; }

      <div class="tile ${op.length ? 'alerta' : ''}"><div class="label">Oportunidades</div><div class="value">${num(op.length)}</div><div class="note">Clientes con equipos que no compran o compran poco · ${num(op.reduce((s, f) => s + f.eq, 0))} equipos</div></div>

    </div>
    <p class="sub" style="margin-top:8px">Todos los equipos de la planilla cuentan como instalados hasta que alguien avise que se retiraron (el vendedor desde Mis clientes, o mantenimiento desde Alerta Segulimp). Las compras son de los reportes de ventas cargados${mediana ? `; un cliente típico compra ${plata(mediana)} por equipo por mes` : ''}.</p>

async function vincularPlanilla(tr){
  const inp = tr.querySelector('[data-vinc-q]'), err = tr.querySelector('[data-vinc-err]');
  const v = inp.value.trim();
  const cod = v.split(' · ')[0].trim();
  const r = S.plan.find(p => p.codigo === cod) || S.plan.find(p => norm(p.nombre) === norm(v));
  if(!r){ err.textContent = 'Elegí un cliente de la lista.'; return; }
  let res;
  try { res = await sb.rpc('comodatos_vincular', { p_planilla: tr.dataset.planilla, p_cliente: r.cliente_id }); } catch(e){ res = { error: e }; }
  if(res.error){ err.textContent = res.error.message || 'No se pudo vincular.'; return; }
  await cargarComodatos();
  S.aviso = { tipo: 'ok', html: `<strong>${esc(tr.dataset.planilla)}</strong> quedó vinculado con ${esc(r.nombre)}.` };
  ir('comodatos');
}
async function guardarDescripcion(tr, btn){
  const desc = tr.querySelector('[data-cod-desc]').value.trim();
  btn.disabled = true;
  const { error } = await sb.from('comodatos_codigos').update({ descripcion: desc || null, actualizado_en: new Date().toISOString() }).eq('codigo', tr.dataset.codigo).select('codigo');
  if(error){ btn.disabled = false; toast('No se pudo guardar: ' + (error.message || error)); return; }
  for(const c of S.comodatos) if(c.codigo === tr.dataset.codigo) c.descripcion = desc || null;
  toast('Descripción guardada');
}

// ====== QUÉ COMPRAN: PATRONES Y OPORTUNIDADES ======
// Salen del detalle por artículo de las ventas: cada cuánto compra cada cliente cada artículo.
const TIPOS_PATRON = { reponer: ['Le toca reponer', 'media'], dejo: ['Dejó de comprar', 'alta'] };
function cadaCuanto(d){ d = Math.round(Number(d)); return d <= 1 ? 'todos los días' : (d < 11 ? `cada ${d} días` : (d < 45 ? `cada ${Math.round(d / 7)} semanas` : `cada ${Math.round(d / 30)} meses`)); }
function haceDias(d){ d = Number(d); return d <= 0 ? 'hoy' : (d === 1 ? 'ayer' : `hace ${d} días`); }
async function cargarPatrones(forzar){
  const o = S.op;
  if(o.filas && !forzar) return o;
  if(!o.cargando) o.cargando = (async () => {
    try {
      const { data, error } = await sb.rpc('comercial_patrones', { p_vendedor: null, p_cliente: null, p_tipo: null, p_limite: 5000 });
      o.error = error ? (error.message || String(error)) : null; o.filas = data || [];
    } catch(e){ o.error = e.message || String(e); o.filas = []; }
    o.cargando = null;
  })();
  await o.cargando;
  return o;
}
function patronesPorCliente(filas){
  const m = new Map();
  for(const f of filas){
    let c = m.get(f.cliente_id);
    if(!c){ c = { id: f.cliente_id, nombre: f.cliente, vendedor_id: f.vendedor_id, vendedor: f.vendedor, items: [], mes: 0, reponer: 0, dejo: 0 }; m.set(f.cliente_id, c); }
    c.items.push(f); c.mes += Number(f.neto_mes || 0); c[f.tipo]++;
  }
  for(const c of m.values()) c.items.sort((a, b) => (a.tipo === b.tipo ? 0 : (a.tipo === 'reponer' ? -1 : 1)) || Number(b.neto_mes || 0) - Number(a.neto_mes || 0));
  return [...m.values()].sort((a, b) => b.mes - a.mes);
}
function lineaPatron(f, conTipo = true){
  const t = TIPOS_PATRON[f.tipo] || [f.tipo, ''];
  return `<div class="mc-com-f"><span class="c">${esc(f.articulo)}</span><span class="n">${plata(f.neto_prom)}</span>
    <span class="d">${conTipo ? `<span class="chip ${t[1]}">${t[0]}</span> ` : ''}Lo compra ${cadaCuanto(f.intervalo)}${Number(f.cantidad_prom) > 0 ? ` (${num(Math.round(Number(f.cantidad_prom) * 10) / 10)} u.)` : ''}. Última vez ${fechaCorta(f.ultima)}, ${haceDias(f.dias)}.</span></div>`;
}
function sinArticulos(){
  return `<div class="msg-box info">Todavía no hay ventas por artículo cargadas.${S.esAdmin ? ' Volvé a soltar los reportes de ventas en <button class="link-btn" data-tab="ventas">Cargar ventas</button>: desde ahora también se guarda qué artículos lleva cada cliente.' : ' Se completa cuando administración cargue los reportes de ventas.'}</div>`;

    <div id="opCaja"><p class="sub">Cargando…</p></div>`;

}
function pintarOportunidades(){
  const caja = $('opCaja');
  if(!caja || S.tab !== 'oportunidades') return;
  const o = S.op;
  document.querySelectorAll('[data-op-vista]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.opVista === o.vista)));
  $('opIntro')?.classList.toggle('hidden', o.vista !== 'articulos');
  if(o.vista === 'rfm') return pintarRfm(caja);
  if(o.vista === 'rubros'){ pintarEspacios(caja); if(articulosAtrasados()) caja.insertAdjacentHTML('afterbegin', avisoArticulos()); return; }
  if(!o.filas){ caja.innerHTML = '<p class="sub">Cargando…</p>'; cargarPatrones().then(pintarOportunidades); return; }
  if(o.error){ caja.innerHTML = `<div class="msg-box error">No se pudieron leer las oportunidades: ${esc(o.error)}</div>`; return; }
  if(!o.filas.length){ caja.innerHTML = sinArticulos(); return; }
  const q = norm(o.q);
  const base = o.filas.filter(f => !o.vendedor || String(f.vendedor_id ?? '_') === o.vendedor);
  const filas = base.filter(f => (!o.tipo || f.tipo === o.tipo) && (!q || norm(f.cliente + ' ' + f.articulo).includes(q)));
  const clientes = patronesPorCliente(filas);
  const cuenta = t => base.filter(f => !t || f.tipo === t).length;
  const mesTotal = clientes.reduce((s, c) => s + c.mes, 0);
  let resumen = '';
  if(S.veTodo && !o.vendedor){
    const pv = new Map();
    for(const f of o.filas){
      const k = f.vendedor_id ?? '_';
      const x = pv.get(k) || { id: k, nombre: f.vendedor || 'Sin vendedor', reponer: 0, dejo: 0, mes: 0, cli: new Set() };
      x[f.tipo]++; x.mes += Number(f.neto_mes || 0); x.cli.add(f.cliente_id); pv.set(k, x);
    }
    resumen = `<div class="table-wrap" style="margin-bottom:14px"><table class="apilar resumen">
      <thead><tr><th>Vendedor</th><th class="num">Clientes</th><th class="num">Le toca reponer</th><th class="num">Dejó de comprar</th><th class="num">En juego por mes</th></tr></thead>
      <tbody>${[...pv.values()].sort((a, b) => b.mes - a.mes).map(x => `<tr><td data-label="Vendedor"><button type="button" class="link-btn" data-op-vend="${esc(x.id)}">${esc(x.nombre)}</button></td>
        <td class="num" data-label="Clientes">${num(x.cli.size)}</td><td class="num" data-label="Le toca reponer">${num(x.reponer)}</td><td class="num" data-label="Dejó de comprar">${num(x.dejo)}</td><td class="num" data-label="En juego por mes">${pesos(x.mes)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const vends = S.veTodo ? [...new Map(o.filas.map(f => [String(f.vendedor_id ?? '_'), f.vendedor || 'Sin vendedor'])).entries()].sort((a, b) => a[1].localeCompare(b[1])) : [];
  caja.innerHTML = `${avisoArticulos()}
    <p class="sub" style="margin-top:-4px">Ventas por artículo cargadas hasta el ${fechaCorta(o.filas[0].datos_al)}.</p>
    ${resumen}
    ${S.veTodo ? `<div class="filtros" style="margin-bottom:10px"><select id="opVend" aria-label="Vendedor"><option value="">Todos los vendedores</option>${vends.map(([id, n]) => `<option value="${esc(id)}" ${id === o.vendedor ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}
    <input type="search" class="mv-buscar" id="opQ" placeholder="Buscar cliente o artículo" value="${esc(o.q)}" aria-label="Buscar cliente o artículo">
    <div class="mc-filtros">${[['', 'Todas'], ['reponer', 'Le toca reponer'], ['dejo', 'Dejó de comprar']].map(([id, n]) => `<button type="button" data-op-tipo="${id}" aria-pressed="${id === o.tipo}">${n} ${num(cuenta(id))}</button>`).join('')}</div>
    <p class="sub">${num(clientes.length)} ${clientes.length === 1 ? 'cliente' : 'clientes'}, ${pesos(mesTotal)} por mes en juego.</p>
    <div class="mc-grid">${clientes.slice(0, o.mostrar).map(c => `<article class="mc">
      <div class="mc-top"><h3>${esc(c.nombre)}</h3><span class="mc-v" title="Lo que suele gastar por mes en estos artículos">${plata(c.mes)}/mes</span></div>
      ${S.veTodo ? `<div class="mc-sub">${esc(c.vendedor || 'Sin vendedor')}</div>` : ''}
      <div class="mc-com-l">${c.items.slice(0, c.ver ? 99 : 6).map(f => lineaPatron(f)).join('')}</div>
      ${c.items.length > 6 ? `<div class="mc-sub" style="margin-top:6px">y ${c.items.length - 6} artículos más</div>` : ''}
      ${!S.veTodo ? `<button type="button" class="btn-ghost mc-ir" data-ir-cliente="${c.id}" data-nombre="${esc(c.nombre)}">Ir al cliente para registrar el contacto</button>` : ''}
    </article>`).join('') || '<div class="card"><p class="sub" style="margin:0">No hay oportunidades con ese filtro.</p></div>'}</div>
    ${clientes.length > o.mostrar ? `<button type="button" class="btn-ghost mas" id="opMas">Ver más (${num(clientes.length - o.mostrar)})</button>` : ''}`;
}

const rubroCorto = r => RUBRO_CORTO[r] || (r.charAt(0) + r.slice(1).toLowerCase()).split(/ [-,] |, /)[0].slice(0, 16);

async function cargarRfm(){
  const o = S.op;
  if(o.rfm) return;
  try { const { data, error } = await sb.rpc('comercial_rfm', { p_vendedor: null }); if(error) throw error; o.rfm = data || []; o.rfmErr = null; }
  catch(e){ o.rfmErr = e.message || String(e); o.rfm = []; }
}
async function cargarEspacios(vend){
  const o = S.op, k = vend || 'mio';
  if(o.esp.has(k)) return;
  o.esp.set(k, { cargando: true });
  try { const { data, error } = await sb.rpc('comercial_espacios', { p_vendedor: vend ? Number(vend) : null, p_cliente: null }); if(error) throw error; o.esp.set(k, { filas: data || [] }); }
  catch(e){ o.esp.set(k, { error: e.message || String(e) }); }
}
function vistasOportunidades(){
  return `<div class="op-vistas" role="tablist">${[['rfm', 'A quién ir'], ['rubros', 'Qué ofrecer por rubro'], ['articulos', 'Por artículo']].map(([id, n]) =>
    `<button type="button" role="tab" data-op-vista="${id}" aria-selected="${S.op.vista === id}">${n}</button>`).join('')}</div>`;
}
function selectorVendedorOp(opciones, conTodos){
  if(!S.veTodo) return '';
  return `<div class="filtros" style="margin-bottom:10px"><select id="opVend" aria-label="Vendedor">${conTodos ? '<option value="">Todos los vendedores</option>' : ''}${opciones.map(([id, n]) => `<option value="${esc(id)}" ${String(id) === S.op.vendedor ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`;
}
function vendedoresConClientes(){
  return S.vendedores.filter(v => v.activo && v.es_vendedor).map(v => [String(v.id), v.nombre]).sort((a, b) => a[1].localeCompare(b[1]));
}

function pintarRfm(caja){
  const o = S.op;
  if(!o.rfm){ caja.innerHTML = '<p class="sub">Cargando…</p>'; cargarRfm().then(pintarOportunidades); return; }
  if(o.rfmErr){ caja.innerHTML = `<div class="msg-box error">No se pudo armar la matriz: ${esc(o.rfmErr)}</div>`; return; }
  const filas = o.rfm.filter(x => !o.vendedor || String(x.vendedor_id ?? '_') === o.vendedor);
  if(!filas.length){ caja.innerHTML = '<div class="msg-box info">Todavía no hay ventas cargadas para armar la matriz.</div>'; return; }
  const g = {}; let total = 0;
  for(const x of filas){ const k = x.r * 10 + x.f; g[k] = g[k] || { n: 0, m: 0 }; g[k].n++; g[k].m += Number(x.monto); total += Number(x.monto); }
  const sel = o.celda;
  const vends = [...new Map(o.rfm.map(x => [String(x.vendedor_id ?? '_'), x.vendedor || 'Sin vendedor (pileta)'])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const celda = (r, f) => {
    const k = r * 10 + f, d = g[k] || { n: 0, m: 0 }, [nombre, tono] = RFM_CELDAS[k];
    return `<button type="button" class="rfm-c t-${tono}${sel === k ? ' sel' : ''}" data-rfm="${k}" ${d.n ? '' : 'disabled'} aria-pressed="${sel === k}">
      <span class="rfm-a">${nombre}</span><span class="rfm-n">${num(d.n)}</span><span class="rfm-m">${plata(d.m)}${total ? ` · ${Math.round(100 * d.m / total)}%` : ''}</span></button>`;
  };
  let lista = '';
  if(sel){
    const [nombre, , texto] = RFM_CELDAS[sel];
    const cl = filas.filter(x => x.r * 10 + x.f === sel);
    lista = `<section class="rfm-lista" id="rfmLista"><h2 class="mv-h" style="font-size:20px; margin:0 0 4px">${nombre}: ${num(cl.length)} ${cl.length === 1 ? 'cliente' : 'clientes'}</h2>
      <p class="sub" style="margin:0 0 10px">${texto}</p>
      <div class="mc-grid">${cl.slice(0, o.mostrar).map(x => `<article class="mc">
        <div class="mc-top"><h3>${esc(x.cliente)}</h3><span class="mc-v">${plata(x.monto)}</span></div>
        ${S.veTodo ? `<div class="mc-sub">${esc(x.vendedor || 'Sin vendedor (pileta)')}</div>` : ''}
        <div class="mc-datos"><span>Última compra <strong>${fechaCorta(x.ultima)}</strong> (${haceDias(x.dias)})</span><span>Compró en <strong>${x.meses} de 12</strong> meses</span></div>
        ${!S.veTodo && S.misVendedores.has(x.vendedor_id) ? `<button type="button" class="btn-ghost mc-ir" data-ir-cliente="${x.cliente_id}" data-nombre="${esc(x.cliente)}">Ir al cliente</button>` : ''}
      </article>`).join('')}</div>
      ${cl.length > o.mostrar ? `<button type="button" class="btn-ghost mas" id="opMas">Ver más (${num(cl.length - o.mostrar)})</button>` : ''}</section>`;
  }
  caja.innerHTML = `${selectorVendedorOp(vends, true)}
    <p class="sub" style="margin-top:0">Cada cliente cae en un casillero según <b>hace cuánto compró</b> (filas) y <b>cuántos meses del último año compró</b> (columnas). El número es la cantidad de clientes y el importe, lo que facturaron en el año. Tocá un casillero para ver quiénes son. Ventas al ${fechaCorta(filas[0].datos_al)}.</p>
    <div class="rfm" role="group" aria-label="Matriz de clientes">
      <div class="rfm-h"></div>${RFM_COLS.map(([, n, d]) => `<div class="rfm-h"><b>${n}</b><span>${d}</span></div>`).join('')}
      ${RFM_FILAS.map(([r, n, d]) => `<div class="rfm-h rfm-hf"><b>${n}</b><span>${d}</span></div>${RFM_COLS.map(([f]) => celda(r, f)).join('')}`).join('')}
    </div>
    ${lista}`;
}

function pintarEspacios(caja){
  const o = S.op;
  let vend = '';
  if(S.veTodo){
    const vs = vendedoresConClientes();
    if(!o.vendedor || !vs.some(v => v[0] === o.vendedor)) o.vendedor = vs.length ? vs[0][0] : '';
    vend = o.vendedor;
    if(!vend){ caja.innerHTML = '<div class="msg-box info">No hay vendedores activos.</div>'; return; }
  }
  const sel = selectorVendedorOp(S.veTodo ? vendedoresConClientes() : [], false);
  const d = o.esp.get(vend || 'mio');
  if(!d || d.cargando){ caja.innerHTML = sel + '<p class="sub">Armando el mapa…</p>'; if(!d) cargarEspacios(vend).then(pintarOportunidades); return; }
  if(d.error){ caja.innerHTML = sel + `<div class="msg-box error">No se pudo armar el mapa: ${esc(d.error)}</div>`; return; }
  if(!d.filas.length){ caja.innerHTML = sel + sinArticulos(); return; }
  // clientes y rubros
  const cli = new Map(), rub = new Map();
  for(const x of d.filas){
    const c = cli.get(x.cliente_id) || { id: x.cliente_id, celdas: new Map(), monto: 0, ofrecer: 0, dejo: 0, reponer: 0 };
    c.celdas.set(x.rubro, x); c.monto += Number(x.neto_12m || 0); if(c[x.estado] !== undefined) c[x.estado]++;
    cli.set(x.cliente_id, c);
    rub.set(x.rubro, (rub.get(x.rubro) || 0) + Number(x.neto_12m || 0) + (x.estado === 'ofrecer' ? 1 : 0));
  }
  const nombres = new Map((o.rfm || []).map(x => [x.cliente_id, x.cliente]));
  for(const r of S.plan) if(!nombres.has(r.cliente_id)) nombres.set(r.cliente_id, r.nombre);
  let rubros = [...rub.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const totalRubros = rubros.length;
  if(!o.espTodos) rubros = rubros.slice(0, 12);
  const q = norm(o.espQ);
  const filtros = [['todos', 'Todos', () => true], ['ofrecer', 'Con algo para ofrecer', c => c.ofrecer], ['dejo', 'Dejaron un rubro', c => c.dejo], ['reponer', 'Les toca reponer', c => c.reponer]];
  const f = filtros.find(x => x[0] === o.espFiltro) || filtros[0];
  const todos = [...cli.values()].map(c => ({ ...c, nombre: nombres.get(c.id) || 'Cliente ' + c.id }));
  const lista = todos.filter(c => f[2](c) && (!q || norm(c.nombre).includes(q))).sort((a, b) => b.monto - a.monto);
  const celda = (c, r) => {
    const x = c.celdas.get(r);
    if(!x) return '<td class="esp-v"></td>';
    const [et, det] = ESTADOS_ESP[x.estado] || [x.estado, ''];
    const info = x.estado === 'ofrecer' ? `Lo compran ${x.porcentaje}% de los ${x.vecinos} clientes más parecidos`
      : `${num(x.compras)} ${x.compras === 1 ? 'compra' : 'compras'} en 2 años${x.intervalo ? ', ' + cadaCuanto(x.intervalo) : ''}; última ${fechaCorta(x.ultima)} (${haceDias(x.dias)})${Number(x.neto_12m) ? '; ' + plata(x.neto_12m) + ' en el año' : ''}`;
    const t = `${c.nombre} · ${r}: ${det}. ${info}.`;
    return `<td class="esp-c e-${x.estado}"><button type="button" data-esp-info="${esc(t)}" aria-label="${esc(r + ': ' + et)}" title="${esc(t)}"><span>${et}</span></button></td>`;
  };
  caja.innerHTML = `${sel}
    <p class="sub" style="margin-top:0">Una fila por cliente y una columna por rubro. Se ve de un vistazo qué rubros lleva cada uno y dónde hay lugar para vender más: <b>Ofrecer</b> es un rubro que no compra pero sí la mayoría de los clientes que compran lo mismo que él.</p>
    <div class="esp-ley">${['compra', 'reponer', 'dejo', 'ofrecer', 'ocasional', 'antes'].concat(d.filas.some(x => x.estado === 'sin_datos') ? ['sin_datos'] : []).map(k => `<span class="e-${k}"><i></i>${ESTADOS_ESP[k][0]}</span>`).join('')}</div>
    <input type="search" class="mv-buscar" id="espQ" placeholder="Buscar cliente" value="${esc(o.espQ)}" aria-label="Buscar cliente">
    <div class="mc-filtros">${filtros.map(([id, n, t]) => `<button type="button" data-esp-filtro="${id}" aria-pressed="${id === f[0]}">${n} ${num(todos.filter(t).length)}</button>`).join('')}</div>
    <div class="esp-wrap"><table class="esp">
      <thead><tr><th class="esp-cli">Cliente</th>${rubros.map(r => `<th title="${esc(r)}"><span>${esc(rubroCorto(r))}</span></th>`).join('')}</tr></thead>
      <tbody>${lista.slice(0, o.espMostrar).map(c => `<tr><th class="esp-cli" scope="row">${!S.veTodo ? `<button type="button" class="link-btn" data-ir-cliente="${c.id}" data-nombre="${esc(c.nombre)}">${esc(c.nombre)}</button>` : esc(c.nombre)}<small>${plata(c.monto)} en el año</small></th>${rubros.map(r => celda(c, r)).join('')}</tr>`).join('')
        || `<tr><td colspan="${rubros.length + 1}" class="sub">No hay clientes con ese filtro.</td></tr>`}</tbody></table></div>
    <div class="esp-pie">${lista.length > o.espMostrar ? `<button type="button" class="btn-ghost" id="espMas">Ver más clientes (${num(lista.length - o.espMostrar)})</button>` : ''}
      ${totalRubros > 12 ? `<button type="button" class="btn-ghost" id="espRubros">${o.espTodos ? 'Ver solo los 12 rubros principales' : `Ver los ${totalRubros} rubros`}</button>` : ''}</div>`;
}

function verCliente(id, nombre){

  if(!r){ toast('Ese cliente no está en tu cartera (puede estar en la pileta).'); return; }

function opDe(id){
  if(!S.op.filas || S.op.error) return null;
  if(S.op.porCli !== S.op.filas){ const m = new Map(); for(const f of S.op.filas){ const o = m.get(f.cliente_id) || { reponer: 0, dejo: 0, mes: 0 }; o[f.tipo]++; o.mes += Number(f.neto_mes || 0); m.set(f.cliente_id, o); } S.op.mapa = m; S.op.porCli = S.op.filas; }
  return S.op.mapa.get(id) || null;
}
function chipsOportunidad(id){

}

// En cada tarjeta de Mis clientes: qué compra, qué le toca y qué ofrecerle
async function cargarQueCompra(id){
  if(S.qc.has(id)) return;
  S.qc.set(id, { cargando: true });
  try {
    const [p, s, t] = await Promise.all([
      sb.rpc('comercial_cliente_productos', { p_cliente: id }),
      sb.rpc('comercial_sugerencias', { p_cliente: id, p_limite: 6 }),
      sb.rpc('comercial_patrones', { p_vendedor: null, p_cliente: id, p_tipo: null, p_limite: 50 })]);
    const e = p.error || s.error || t.error;
    S.qc.set(id, e ? { error: e.message || String(e) } : { productos: p.data || [], sugerencias: s.data || [], patrones: t.data || [] });
  } catch(e){ S.qc.set(id, { error: e.message || String(e) }); }
  if(S.mc.qc === id) pintarMisClientes();
}
function bloqueQueCompra(id){
  const abierto = S.mc.qc === id, d = S.qc.get(id);
  let cuerpo = '';
  if(abierto){
    if(!d || d.cargando) cuerpo = '<div class="mc-com-f"><span class="d">Cargando…</span></div>';
    else if(d.error) cuerpo = `<div class="mc-com-f"><span class="d">No se pudo leer: ${esc(d.error)}</span></div>`;
    else if(!d.productos.length) cuerpo = '<div class="mc-com-f"><span class="d">Todavía no hay detalle de los artículos que compra.</span></div>';
    else {
      const at = articulosAtrasados(), cli = S.plan.find(x => x.cliente_id === id), ult = cli ? ultimaCompra(cli) : null;
      if(at && ult && ult > at.articulos) cuerpo += `<div class="mc-com-f"><span class="d">Compró por última vez el ${fechaCorta(ult)}, pero el detalle por artículo llega hasta el ${fechaCorta(at.articulos)}: lo de abajo no incluye esas compras.</span></div>`;
      const sec = (t, html) => html ? `<div class="mc-com-f qc-t"><span class="c">${t}</span></div>${html}` : '';
      cuerpo += sec('Le toca reponer', d.patrones.filter(f => f.tipo === 'reponer').map(f => lineaPatron(f, false)).join(''))
        + sec('Dejó de comprar', d.patrones.filter(f => f.tipo === 'dejo').map(f => lineaPatron(f, false)).join(''))
        + sec('Ofrecele', d.sugerencias.map(s => `<div class="mc-com-f"><span class="c">${esc(s.articulo)}</span><span class="n">${Math.round(Number(s.porcentaje))}%</span>
            <span class="d">Lo llevan ${num(s.clientes)} de ${num(s.parecidos)} clientes que compran lo mismo que este${s.rubro ? ` (${esc(s.rubro)})` : ''}.</span></div>`).join(''))
        + sec('Lo que más compra (último año)', d.productos.slice(0, 6).map(p => `<div class="mc-com-f"><span class="c">${esc(p.articulo)}</span><span class="n">${plata(p.neto_12m)}</span>
            <span class="d">${num(p.compras)} ${p.compras === 1 ? 'compra' : 'compras'}${p.intervalo ? ', ' + cadaCuanto(p.intervalo) : ''}. Última ${fechaCorta(p.ultima)}.</span></div>`).join(''));
    }
  }
  return `<button type="button" class="mc-com" data-qc="${id}" aria-expanded="${abierto}"><span>Qué compra y qué ofrecerle</span><span class="ver">${abierto ? 'Ocultar' : 'Ver'}</span></button>
    ${abierto ? `<div class="mc-com-l">${cuerpo}</div>` : ''}`;
}

// ====== PROSPECTOS: EMBUDO POR ETAPAS ======
const ETAPAS = [['nuevo', 'Nuevo'], ['contactado', 'Contactado'], ['visitado', 'Visitado'], ['presupuesto', 'Presupuesto'], ['ganado', 'Ganado'], ['perdido', 'Perdido']];
const etapaNombre = e => (ETAPAS.find(x => x[0] === e) || [e, e])[1];
const prAbierto = p => p.etapa !== 'ganado' && p.etapa !== 'perdido';
async function cargarProspectos(){
  const pr = S.pr;
  try {
    const pedidos = [sb.rpc('comercial_prospectos', { p_vendedor: null })];
    if(S.veTodo) pedidos.push(sb.rpc('comercial_embudo', { p_desde: null }));
    const [l, e] = await Promise.all(pedidos);
    if(l.error) throw l.error;
    pr.filas = l.data || []; pr.embudo = e && !e.error ? e.data || [] : null; pr.error = null;
  } catch(e){ pr.error = e.message || String(e); pr.filas = pr.filas || []; }
}
function renderProspectos(aviso){
  content().innerHTML = aviso + `
    <div class="mv-top"><h1 class="mv-hola">Prospectos</h1>${(S.misVendedores.size || S.esAdmin) && !S.nuevoDato ? `<button type="button" class="btn-primary" id="btnNuevoDato" style="min-height:44px">+ Dato nuevo</button>` : ''}</div>
    ${S.nuevoDato ? formNuevoDato() : ''}
    ${S.esAdmin ? `<p class="sub"><b>Cómo se cargan:</b> de a uno con "+ Dato nuevo" (podés asignarlo a un vendedor o dejarlo en la pileta), o una lista entera desde un Excel en la <button type="button" class="link-btn" data-tab="pileta">Pileta</button>. Los vendedores los cargan desde Prospectos o Mis clientes.</p>` : ''}
    <p class="sub">Cada dato nuevo pasa por Nuevo, Contactado, Visitado y Presupuesto hasta que se gana o se pierde. Avanza solo cuando registrás una llamada, visita o presupuesto, y pasa a Ganado cuando aparece su primera compra.</p>
    <div id="prCaja"><p class="sub">Cargando…</p></div>`;
  if(S.nuevoDato) $('ndNombre').focus();
  cargarProspectos().then(pintarProspectos);
}
const FILTROS_PR = [
  ['abiertos', 'Abiertos', p => prAbierto(p)],
  ['hoy', 'Para hoy', p => prAbierto(p) && (!p.proxima_fecha || p.proxima_fecha <= hoyISO())],
  ...ETAPAS.map(([id, n]) => [id, id === 'ganado' ? 'Ganados' : (id === 'perdido' ? 'Perdidos' : n), p => p.etapa === id])
];
function pintarProspectos(){
  const caja = $('prCaja');
  if(!caja || S.tab !== 'prospectos') return;
  const pr = S.pr;
  if(pr.error && !pr.filas.length){ caja.innerHTML = `<div class="msg-box error">No se pudieron leer los prospectos: ${esc(pr.error)}</div>`; return; }
  const base = pr.filas.filter(p => !pr.vendedor || String(p.vendedor_id ?? '_') === pr.vendedor);
  const f = FILTROS_PR.find(x => x[0] === pr.filtro) || FILTROS_PR[0];
  const q = norm(pr.q);
  const filas = base.filter(p => f[2](p) && (!q || norm(p.nombre + ' ' + (p.localidad || '') + ' ' + (p.contacto || '')).includes(q)));
  let embudo = '';
  if(pr.embudo && pr.embudo.length){
    const tot = k => pr.embudo.reduce((s, x) => s + Number(x[k] || 0), 0);
    const fila = (x, n) => `<td class="num" data-label="Nuevo">${num(+x.nuevo)}</td><td class="num" data-label="Contactado">${num(+x.contactado)}</td><td class="num" data-label="Visitado">${num(+x.visitado)}</td><td class="num" data-label="Presupuesto">${num(+x.presupuesto)}</td>
      <td class="num" data-label="Ganados (90 días)">${num(+x.ganado)}</td><td class="num" data-label="Perdidos (90 días)">${num(+x.perdido)}</td><td class="num" data-label="Sin próximo paso">${+x.sin_proxima ? `<span class="chip alta">${num(+x.sin_proxima)}</span>` : '0'}</td><td class="num" data-label="Pasos vencidos">${+x.vencidas ? `<span class="chip media">${num(+x.vencidas)}</span>` : '0'}</td>
      <td class="num" data-label="Conversión">${x.conversion == null ? '—' : nf.format(Number(x.conversion)) + '%'}</td>`;
    const t = { nuevo: tot('nuevo'), contactado: tot('contactado'), visitado: tot('visitado'), presupuesto: tot('presupuesto'), ganado: tot('ganado'), perdido: tot('perdido'), sin_proxima: tot('sin_proxima'), vencidas: tot('vencidas') };
    const carg = tot('cargados');
    t.conversion = carg ? Math.round(1000 * pr.embudo.reduce((s, x) => s + Number(x.cargados || 0) * Number(x.conversion || 0) / 100, 0) / carg) / 10 : null;
    embudo = `<h2 class="mv-h" style="font-size:20px; margin:4px 0 8px">Embudo por vendedor</h2>
      <div class="table-wrap" style="margin-bottom:6px"><table class="apilar resumen"><thead><tr><th>Vendedor</th><th class="num">Nuevo</th><th class="num">Contactado</th><th class="num">Visitado</th><th class="num">Presupuesto</th><th class="num">Ganados</th><th class="num">Perdidos</th><th class="num">Sin próximo paso</th><th class="num">Pasos vencidos</th><th class="num">Conversión</th></tr></thead>
      <tbody>${pr.embudo.map(x => `<tr><td data-label="Vendedor"><button type="button" class="link-btn" data-pr-vend="${esc(x.vendedor_id ?? '_')}">${esc(x.vendedor)}</button></td>${fila(x)}</tr>`).join('')}
      <tr class="total"><td data-label="Vendedor"><strong>Total</strong></td>${fila(t)}</tr></tbody></table></div>
      <p class="sub" style="margin-bottom:16px">Ganados y perdidos: últimos 90 días. Conversión: de los datos cargados en los últimos 90 días, cuántos ya compraron.</p>`;
  }
  const vends = S.veTodo ? [...new Map(pr.filas.map(p => [String(p.vendedor_id ?? '_'), p.vendedor || 'Sin vendedor (pileta)'])).entries()].sort((a, b) => a[1].localeCompare(b[1])) : [];
  caja.innerHTML = embudo + `
    ${S.veTodo ? `<div class="filtros" style="margin-bottom:10px"><select id="prVend" aria-label="Vendedor"><option value="">Todos los vendedores</option>${vends.map(([id, n]) => `<option value="${esc(id)}" ${id === pr.vendedor ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}
    <input type="search" class="mv-buscar" id="prQ" placeholder="Buscar prospecto" value="${esc(pr.q)}" aria-label="Buscar prospecto">
    <div class="mc-filtros">${FILTROS_PR.map(([id, n, t]) => `<button type="button" data-pr-filtro="${id}" aria-pressed="${id === f[0]}">${n} ${num(base.filter(t).length)}</button>`).join('')}</div>
    <div class="mc-grid" id="prLista">${filas.map(tarjetaProspecto).join('') || `<div class="card"><p class="sub" style="margin:0">${base.length ? 'No hay prospectos con ese filtro.' : (S.misVendedores.size ? 'Todavía no cargaste datos nuevos. Tocá "+ Dato nuevo" para sumar uno.' : 'No hay prospectos cargados.')}</p></div>`}</div>`;
}
function textoProxima(p){
  if(!prAbierto(p)) return '';
  if(!p.proxima_fecha) return `<div class="pr-prox sin">Sin próximo paso definido</div>`;
  const d = diasHasta(p.proxima_fecha);
  const cuando = d < 0 ? `venció hace ${-d === 1 ? '1 día' : -d + ' días'}` : (d === 0 ? 'hoy' : (d === 1 ? 'mañana' : `el ${fechaCorta(p.proxima_fecha)}`));
  return `<div class="pr-prox ${d < 0 ? 'venc' : (d === 0 ? 'hoy' : '')}">Próximo paso: <b>${esc(p.proxima_accion)}</b>, ${cuando}</div>`;
}
function tarjetaProspecto(p){
  const ab = S.pr.abierto && S.pr.abierto.id === Number(p.cliente_id) ? S.pr.abierto : null;
  const lugar = [p.localidad, p.rubro].filter(Boolean).map(esc).join(', ');
  const chipE = { nuevo: 'plano', contactado: '', visitado: 'media', presupuesto: 'media', ganado: 'ok', perdido: 'alta' }[p.etapa] ?? '';
  const tipo = ab && ab.tipo ? TIPOS_CONTACTO.find(t => t[0] === ab.tipo) : null;
  let acciones = '';
  if(puedeEditar(p) && prAbierto(p)){
    if(tipo) acciones = `<div class="mc-form"><input type="text" data-pr-nota maxlength="300" placeholder="Nota (opcional)" aria-label="Nota del contacto">
        <div class="mc-form-b"><button type="button" class="btn-primary" data-pr-confirmar>Registrar ${tipo[0] === 'presupuesto' ? 'presupuesto' : tipo[1].toLowerCase()}</button><button type="button" class="btn-ghost" data-pr-cancelar>Cancelar</button></div></div>`;
    else if(ab && ab.modo === 'proxima') acciones = `<div class="mc-form"><input type="text" data-pr-accion maxlength="200" placeholder="Qué vas a hacer (ej.: llevar muestras)" value="${esc(p.proxima_accion || '')}" aria-label="Próximo paso">
        <input type="date" data-pr-fecha min="${hoyISO()}" value="${esc(p.proxima_fecha || '')}" aria-label="Fecha del próximo paso" style="margin-top:8px">
        <div class="mc-form-b"><button type="button" class="btn-primary" data-pr-guardar-prox>Guardar próximo paso</button><button type="button" class="btn-ghost" data-pr-cancelar>Cancelar</button></div></div>`;
    else if(ab && ab.modo === 'perdido') acciones = `<div class="mc-form"><input type="text" data-pr-motivo maxlength="300" placeholder="Por qué se perdió (ej.: compra en otro lado)" aria-label="Motivo">
        <div class="mc-form-b"><button type="button" class="btn-primary" data-pr-perder>Marcar como perdido</button><button type="button" class="btn-ghost" data-pr-cancelar>Cancelar</button></div></div>`;
    else acciones = `<div class="mc-acc">${TIPOS_CONTACTO.map(([k, n]) => `<button type="button" data-pr-contacto="${k}">${n}</button>`).join('')}</div>
      <div class="pr-mov"><button type="button" class="btn-ghost" data-pr-prox>${p.proxima_fecha ? 'Cambiar próximo paso' : 'Definir próximo paso'}</button>
        ${S.esAdmin ? `<select data-pr-asignar aria-label="Vendedor asignado"><option value="">${p.vendedor_id ? 'Pasarlo a la pileta' : 'En la pileta'}</option>${S.vendedores.filter(v => v.activo && v.es_vendedor).sort((a, b) => a.nombre.localeCompare(b.nombre)).map(v => `<option value="${v.id}" ${v.id === p.vendedor_id ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select>` : ''}
        <select data-pr-etapa aria-label="Mover a otra etapa"><option value="">Mover a…</option>${ETAPAS.filter(e => e[0] !== p.etapa).map(([id, n]) => `<option value="${id}">${n}</option>`).join('')}</select></div>`;
  } else if(puedeEditar(p) && p.etapa === 'perdido') acciones = `<div class="mc-pie"><button type="button" class="link-btn" data-pr-reabrir>Volver a trabajarlo</button></div>`;
  return `<article class="mc" data-prospecto="${p.cliente_id}">
    <div class="mc-top"><h3>${esc(p.nombre)}</h3><span class="chip ${chipE}">${etapaNombre(p.etapa)}</span></div>
    ${lugar ? `<div class="mc-sub">${lugar}</div>` : ''}
    ${p.contacto || p.telefono ? `<div class="mc-sub">${[p.contacto ? esc(p.contacto) : '', p.telefono ? telLink(p.telefono) : ''].filter(Boolean).join(', ')}</div>` : ''}
    ${p.nota_alta ? `<div class="mc-sub">${esc(p.nota_alta)}</div>` : ''}
    ${S.veTodo ? `<div class="mc-sub">Vendedor: <b>${esc(p.vendedor || 'sin vendedor (pileta)')}</b></div>` : ''}
    <div class="mc-datos"><span>${p.etapa === 'ganado' ? 'Ganado' : (p.etapa === 'perdido' ? 'Perdido' : 'En esta etapa')} ${p.dias_en_etapa > 0 ? `hace <strong>${p.dias_en_etapa === 1 ? '1 día' : p.dias_en_etapa + ' días'}</strong>` : '<strong>desde hoy</strong>'}</span><span>Contactos <strong>${num(+p.contactos)}</strong></span>${p.ultimo_contacto ? `<span>Último <strong>${fechaCorta(p.ultimo_contacto)}</strong></span>` : ''}</div>
    ${textoProxima(p)}
    ${p.etapa === 'perdido' && p.motivo_perdida ? `<div class="pr-prox">Motivo: ${esc(p.motivo_perdida)}</div>` : ''}
    ${acciones}<div class="mc-err"></div>
  </article>`;
}
async function accionProspecto(card, fn, params, okTexto){
  const err = card.querySelector('.mc-err');
  for(const b of card.querySelectorAll('button, select')) b.disabled = true;
  err.textContent = '';
  let res;
  try { res = await sb.rpc(fn, params); } catch(e){ res = { error: e }; }
  if(res.error){ for(const b of card.querySelectorAll('button, select')) b.disabled = false; err.textContent = 'No se pudo: ' + (res.error.message || res.error) + '.'; return false; }
  S.pr.abierto = null;
  await cargarProspectos();
  pintarProspectos();
  toast(okTexto);
  return res.data;
}

// Errores, mejoras, ideas y consultas de quienes usan la herramienta. Todos ven todo y votan; administración responde y cambia el estado.
const FB_TIPOS = [['error', 'Algo no anda', 'alta'], ['mejora', 'Mejora', 'media'], ['idea', 'Idea nueva', ''], ['consulta', 'Consulta', 'plano']];
const FB_ESTADOS = [['nuevo', 'Nuevo'], ['revision', 'En revisión'], ['hecho', 'Hecho'], ['descartado', 'Descartado']];
const NOMBRE_PANTALLA = { avance: 'Avance', clientes: 'Mis clientes', oportunidades: 'Oportunidades', prospectos: 'Prospectos', pileta: 'Pileta', seguimiento: 'Cartera por vendedor', cartera: 'Cartera de clientes', ventas: 'Cargar ventas', importar: 'Cargar cartera', objetivos: 'Objetivos', vendedores: 'Vendedores', comodatos: 'Comodatos' };
async function cargarFeedback(){
  const fb = S.fb;
  try { const { data, error } = await sb.rpc('hub_feedback_lista', { p_app: 'comercial' }); if(error) throw error; fb.filas = data || []; fb.error = null; }
  catch(e){ fb.error = e.message || String(e); fb.filas = fb.filas || []; }
}
function renderFeedback(aviso){
  const fb = S.fb;
  content().innerHTML = aviso + `
    <div class="mv-top"><h1 class="mv-hola">Feedback</h1></div>
    <p class="sub">Contanos qué no anda, qué mejorarías o qué te gustaría que tenga la herramienta. Todos ven los comentarios y pueden sumar su voto: lo más votado se hace primero.</p>
    <form class="fb-form" id="fbForm">
      <div class="fb-tipos" role="radiogroup" aria-label="Tipo de comentario">${FB_TIPOS.map(([id, n]) => `<button type="button" role="radio" data-fb-tipo="${id}" aria-checked="${fb.tipo === id}">${n}</button>`).join('')}</div>
      <textarea id="fbTexto" maxlength="2000" rows="3" placeholder="${fb.tipo === 'error' ? 'Qué estabas haciendo y qué pasó' : 'Escribilo con tus palabras'}" aria-label="Comentario">${esc(fb.borrador || '')}</textarea>
      <div class="fb-env"><span class="sub" style="margin:0">Pantalla: ${esc(NOMBRE_PANTALLA[fb.desde] || 'General')}</span><button type="submit" class="btn-primary" id="fbEnviar">Enviar</button></div>
      <div class="mc-err" id="fbError"></div>
    </form>
    <div id="fbCaja"><p class="sub">Cargando…</p></div>`;
  cargarFeedback().then(pintarFeedback);
}
function pintarFeedback(){
  const caja = $('fbCaja'), fb = S.fb;
  if(!caja || S.tab !== 'feedback') return;
  if(fb.error && !fb.filas.length){ caja.innerHTML = `<div class="msg-box error">No se pudo leer el tablero: ${esc(fb.error)}</div>`; return; }
  const filtros = [['abiertos', 'Abiertos', x => x.estado === 'nuevo' || x.estado === 'revision'], ['hecho', 'Hechos', x => x.estado === 'hecho'], ['descartado', 'Descartados', x => x.estado === 'descartado'], ['mios', 'Los míos', x => x.mio]];
  const f = filtros.find(x => x[0] === fb.filtro) || filtros[0];
  const lista = fb.filas.filter(f[2]).sort(fb.orden === 'recientes' ? (a, b) => b.creado_en.localeCompare(a.creado_en) : (a, b) => b.votos - a.votos || b.creado_en.localeCompare(a.creado_en));
  const tarjeta = x => {
    const tipo = FB_TIPOS.find(t => t[0] === x.tipo) || [x.tipo, x.tipo, ''];
    const est = FB_ESTADOS.find(t => t[0] === x.estado) || [x.estado, x.estado];
    const editando = fb.editar === x.id;
    return `<article class="mc fb" data-fb="${x.id}">
      <div class="fb-fila">
        <button type="button" class="fb-voto" data-fb-votar aria-pressed="${x.vote}" aria-label="${x.vote ? 'Sacar mi voto' : 'Votar'} (${x.votos} ${x.votos === 1 ? 'voto' : 'votos'})"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 5 13h4.5v6h5v-6H19z"/></svg><b>${num(x.votos)}</b></button>
        <div class="fb-cuerpo">
          <div class="fb-chips"><span class="chip ${tipo[2]}">${tipo[1]}</span><span class="chip fb-e-${x.estado}">${est[1]}</span></div>
          <p class="fb-texto">${esc(x.texto)}</p>
          <div class="mc-sub">${esc(x.autor_nombre || 'Alguien')} · ${fechaCorta(x.creado_en.slice(0, 10))}${x.pantalla ? ' · ' + esc(NOMBRE_PANTALLA[x.pantalla] || x.pantalla) : ''}</div>
          ${x.respuesta ? `<div class="fb-resp"><b>Respuesta:</b> ${esc(x.respuesta)}</div>` : ''}
          ${S.esAdmin ? (editando ? `<div class="mc-form"><select data-fb-estado aria-label="Estado">${FB_ESTADOS.map(([id, n]) => `<option value="${id}" ${id === x.estado ? 'selected' : ''}>${n}</option>`).join('')}</select>
              <input type="text" data-fb-resp maxlength="2000" placeholder="Respuesta para quien lo escribió (opcional)" value="${esc(x.respuesta || '')}" aria-label="Respuesta" style="margin-top:8px">
              <div class="mc-form-b"><button type="button" class="btn-primary" data-fb-guardar>Guardar</button><button type="button" class="btn-ghost" data-fb-cancelar>Cancelar</button></div></div>`
            : `<div class="mc-pie"><button type="button" class="link-btn" data-fb-editar>Responder o cambiar estado</button>${`<button type="button" class="link-btn" data-fb-borrar>Borrar</button>`}</div>`)
            : (x.mio && x.estado === 'nuevo' ? `<div class="mc-pie"><button type="button" class="link-btn" data-fb-borrar>Borrar</button></div>` : '')}
          <div class="mc-err"></div>
        </div>
      </div>
    </article>`;
  };
  caja.innerHTML = `
    <div class="fb-barra"><div class="mc-filtros" style="margin:0">${filtros.map(([id, n, t]) => `<button type="button" data-fb-filtro="${id}" aria-pressed="${id === f[0]}">${n} ${num(fb.filas.filter(t).length)}</button>`).join('')}</div>
      <select id="fbOrden" aria-label="Orden"><option value="votos" ${fb.orden !== 'recientes' ? 'selected' : ''}>Más votados</option><option value="recientes" ${fb.orden === 'recientes' ? 'selected' : ''}>Más recientes</option></select></div>
    <div class="fb-lista">${lista.map(tarjeta).join('') || `<div class="card"><p class="sub" style="margin:0">${fb.filas.length ? 'No hay comentarios con ese filtro.' : 'Todavía no hay comentarios. ¡Sé el primero!'}</p></div>`}</div>`;
}
async function accionFeedback(card, fn, params, okTexto){
  const err = card.querySelector('.mc-err');
  card.querySelectorAll('button, select, input').forEach(b => b.disabled = true);
  let res; try { res = await sb.rpc(fn, params); } catch(e){ res = { error: e }; }
  if(res.error){ card.querySelectorAll('button, select, input').forEach(b => b.disabled = false); err.textContent = 'No se pudo: ' + (res.error.message || res.error); return null; }
  S.fb.editar = null;
  await cargarFeedback(); pintarFeedback();
  if(okTexto) toast(okTexto);
  return res.data;
}
async function enviarFeedback(){
  const fb = S.fb, texto = $('fbTexto').value.trim(), err = $('fbError');
  if(!fb.tipo){ err.textContent = 'Elegí qué tipo de comentario es.'; return; }
  if(texto.length < 3){ err.textContent = 'Escribí qué pasó o qué te gustaría.'; $('fbTexto').focus(); return; }
  $('fbEnviar').disabled = true; err.textContent = '';
  let res; try { res = await sb.rpc('hub_feedback_crear', { p_app: 'comercial', p_tipo: fb.tipo, p_texto: texto, p_pantalla: fb.desde || null }); } catch(e){ res = { error: e }; }
  if(res.error){ $('fbEnviar').disabled = false; err.textContent = 'No se pudo enviar: ' + (res.error.message || res.error); return; }
  fb.borrador = ''; fb.tipo = null; fb.filtro = 'mios';
  renderFeedback('');
  toast('¡Gracias! Quedó en el tablero.');
}

    if(t.closest('[data-fb-cancelar]')){ S.fb.editar = null; pintarFeedback(); return; }
    if(t.closest('[data-fb-guardar]')){ accionFeedback(card, 'hub_feedback_estado', { p_id: id, p_estado: card.querySelector('[data-fb-estado]').value, p_respuesta: card.querySelector('[data-fb-resp]').value.trim() || null }, 'Guardado'); return; }
    if(t.closest('[data-fb-borrar]')){ if(confirm('¿Borrar este comentario?')) accionFeedback(card, 'hub_feedback_borrar', { p_id: id }, 'Borrado'); return; }
    return;
  }
  if((el = t.closest('[data-op-vista]'))){ S.op.vista = el.dataset.opVista; S.op.mostrar = 30; pintarOportunidades(); return; }
  if((el = t.closest('[data-rfm]'))){ const k = Number(el.dataset.rfm); S.op.celda = S.op.celda === k ? null : k; S.op.mostrar = 30; pintarOportunidades(); if(S.op.celda) $('rfmLista')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if((el = t.closest('[data-esp-filtro]'))){ S.op.espFiltro = el.dataset.espFiltro; S.op.espMostrar = 40; pintarOportunidades(); return; }
  if((el = t.closest('[data-esp-info]'))){ toast(el.dataset.espInfo); return; }
  if(t.id === 'espMas'){ S.op.espMostrar += 40; pintarOportunidades(); return; }
  if(t.id === 'espRubros'){ S.op.espTodos = !S.op.espTodos; pintarOportunidades(); return; }
  if((el = t.closest('[data-op-tipo]'))){ S.op.tipo = el.dataset.opTipo; S.op.mostrar = 30; pintarOportunidades(); return; }
  if((el = t.closest('[data-op-vend]'))){ S.op.vendedor = el.dataset.opVend; S.op.mostrar = 30; pintarOportunidades(); return; }
  if(t.id === 'opMas'){ S.op.mostrar += 30; pintarOportunidades(); return; }
  if((el = t.closest('[data-pr-filtro]'))){ S.pr.filtro = el.dataset.prFiltro; S.pr.abierto = null; pintarProspectos(); return; }
  if((el = t.closest('[data-pr-vend]'))){ S.pr.vendedor = el.dataset.prVend; S.pr.filtro = 'abiertos'; pintarProspectos(); $('prLista').scrollIntoView({ block: 'start' }); return; }
  if((el = t.closest('[data-prospecto]'))){
    const card = el, id = Number(card.dataset.prospecto);
    if((el = t.closest('[data-pr-contacto]'))){ S.pr.abierto = { id, tipo: el.dataset.prContacto }; pintarProspectos(); const n = document.querySelector('#prLista [data-pr-nota]'); if(n) n.focus(); return; }
    if(t.closest('[data-pr-prox]')){ S.pr.abierto = { id, modo: 'proxima' }; pintarProspectos(); const n = document.querySelector('#prLista [data-pr-accion]'); if(n) n.focus(); return; }
    if(t.closest('[data-pr-cancelar]')){ S.pr.abierto = null; pintarProspectos(); return; }
    if(t.closest('[data-pr-confirmar]')){
      const tipo = S.pr.abierto && S.pr.abierto.tipo;
      if(tipo) accionProspecto(card, 'comercial_contacto_registrar', { p_cliente: id, p_tipo: tipo, p_nota: card.querySelector('[data-pr-nota]').value.trim() || null }, TIPOS_CONTACTO.find(x => x[0] === tipo)[2] + '. Ya suma a tu semana.')
        .then(r => { if(r && r.semana){ const sem = r.semana; S.actividades = S.actividades.filter(a => !(a.vendedor_id === sem.vendedor_id && a.semana === sem.semana)).concat(sem); }
                     const x = S.plan.find(c => c.cliente_id === id); if(r && x){ x.ultimo_contacto = r.ultimo_contacto; x.vence_pileta = r.vence_pileta; } });
      return;
    }
    if(t.closest('[data-pr-guardar-prox]')){
      const acc = card.querySelector('[data-pr-accion]').value.trim(), f = card.querySelector('[data-pr-fecha]').value;
      if(!acc || !f){ card.querySelector('.mc-err').textContent = 'Poné qué vas a hacer y la fecha.'; return; }
      accionProspecto(card, 'comercial_prospecto_proxima', { p_cliente: id, p_accion: acc, p_fecha: f }, 'Próximo paso guardado');
      return;
    }
    if(t.closest('[data-pr-perder]')){
      const m = card.querySelector('[data-pr-motivo]').value.trim();
      if(!m){ card.querySelector('.mc-err').textContent = 'Contá por qué se perdió.'; return; }
      accionProspecto(card, 'comercial_prospecto_etapa', { p_cliente: id, p_etapa: 'perdido', p_motivo: m }, 'Marcado como perdido');
      return;
    }
    if(t.closest('[data-pr-reabrir]')){ accionProspecto(card, 'comercial_prospecto_etapa', { p_cliente: id, p_etapa: 'contactado' }, 'Vuelve a Contactado'); return; }
    return;
  }
  if(t.id === 'btnNuevoDato'){ S.nuevoDato = true; ir(S.tab); return; }
  if(t.id === 'ndCancelar'){ S.nuevoDato = false; ir(S.tab); return; }
  if((el = t.closest('[data-filtro-mc]'))){ S.mc.filtro = el.dataset.filtroMc; S.mc.mostrar = 30; S.mc.abierto = null; pintarMisClientes(); return; }
  if(t.id === 'mcMas'){ S.mc.mostrar += 30; pintarMisClientes(); return; }
  if((el = t.closest('#mcLista [data-contacto]'))){ S.mc.abierto = { id: Number(el.closest('.mc').dataset.cliente), tipo: el.dataset.contacto }; pintarMisClientes(); const n = document.querySelector('#mcLista [data-nota]'); if(n) n.focus(); return; }
  if(t.closest('#mcLista [data-cancelar]')){ S.mc.abierto = null; pintarMisClientes(); return; }
  if((el = t.closest('#mcLista [data-confirmar]'))){ registrarContacto(el.closest('.mc')); return; }
  if((el = t.closest('#mcLista [data-soltar]'))){ soltarCliente(el.closest('.mc')); return; }
  if((el = t.closest('#pilLista [data-tomar]'))){ tomarCliente(el.closest('.mc')); return; }
  if(t.id === 'pilMas'){ t.disabled = true; cargarPileta(true); return; }
  if(t.id === 'btnCargarDatos'){ cargarDatosNuevos(); return; }
  if(t.id === 'btnCancelarDatos'){ S.pil.imp = null; ir('pileta'); return; }
  if(t.closest('#dropDatos') && t.id !== 'datosArchivo' && !(S.pil.imp && S.pil.imp.filas)){ $('datosArchivo').click(); return; }
  if((el = t.closest('[data-mes]'))){
    const [a, m] = S.periodo.split('-').map(Number);
    const d = new Date(a, m - 1 + Number(el.dataset.mes), 1);
    cambiarMes(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); return;
  }
  if((el = t.closest('[data-detalle], [data-otro]'))){ S.verVendedor = Number(el.dataset.detalle || el.dataset.otro); S.semana = null; ir('avance'); window.scrollTo(0, 0); return; }
  if(t.closest('[data-volver-avance]')){ S.verVendedor = null; ir('avance'); return; }
  if(t.id === 'btnGuardarPlan'){ guardarPlan(); return; }
  if((el = t.closest('#miSemana [data-paso]'))){
    const inp = el.parentElement.querySelector('input');
    inp.value = Math.max(0, Math.min(9999, (Math.round(Number(inp.value)) || 0) + Number(el.dataset.paso)));
    programarGuardado(); return;
  }
  if((el = t.closest('#miSemana [data-modo]'))){
    const caja = $('miSemana');
    S.modoSemana = caja.dataset.modo = el.dataset.modo;
    for(const b of caja.querySelectorAll('.mv-seg button')) b.setAttribute('aria-pressed', String(b === el));
    pintarSemana(); return;
  }
  if((el = t.closest('[data-semana]'))){
    const lunes = el.dataset.semana;
    guardarPendiente().then(() => { S.semana = lunes; S.modoSemana = null; ir('avance'); const c = $('miSemana'); if(c) c.scrollIntoView({ block: 'start' }); });
    return;
  }
  if(t.id === 'mvReintentar'){ $('mvEstado').textContent = 'Guardando…'; guardarMiSemana(); return; }
  if(t.id === 'mvActualizar'){ recargar(S.tab); return; }
  if(t.id === 'btnGuardarObjetivos'){ guardarObjetivos(); return; }
  if(t.id === 'btnCopiarObjetivos'){ copiarObjetivos(); return; }
  if(t.id === 'btnGuardarEscala'){ guardarEscala(); return; }
  if(t.id === 'btnGuardarMetas'){ guardarMetas(); return; }
  if(t.id === 'btnCargarVentas'){ cargarVentas(); return; }
  if(t.id === 'btnCancelarVentas'){ S.impVentas = null; renderVentas(''); return; }
  if(t.closest('#dropVentas') && t.id !== 'ventasArchivo' && !(S.impVentas && S.impVentas.leyendo)){ $('ventasArchivo').click(); return; }
  if((el = t.closest('[data-orden]'))){
    const c = el.dataset.orden;
    S.ordenResumen = { campo: c, desc: S.ordenResumen.campo === c ? !S.ordenResumen.desc : c !== 'nombre' };
    renderSeguimiento(''); return;
  }
  if((el = t.closest('[data-ver-vendedor]'))){
    S.filtros = { ...S.filtros, q: '', vendedor: el.dataset.verVendedor, estado: '', prioridad: '', segmento: '', preset: '' };
    S.mostrar = POR_PAGINA;
    ir('cartera'); window.scrollTo(0, 0); return;
  }
  if((el = t.closest('[data-preset]'))){
    S.filtros.preset = S.filtros.preset === el.dataset.preset ? '' : el.dataset.preset;
    S.mostrar = POR_PAGINA;
    renderCartera(''); return;
  }
  if(t.id === 'btnMas'){ S.mostrar += POR_PAGINA; pintarLista(); return; }
  if((el = t.closest('[data-guardar]'))){ guardarGestion(el.closest('tr')); return; }
  if((el = t.closest('[data-v-guardar]'))){ guardarVendedor(el.closest('tr')); return; }
  if((el = t.closest('[data-borrar-carga]'))){ borrarCarga(Number(el.dataset.borrarCarga)); return; }
  if(t.id === 'btnNuevoVendedor'){ agregarVendedor(); return; }
  if(t.id === 'btnCrearUsuarios'){ crearUsuarios(t); return; }
  if(t.id === 'btnSoloVinculados'){ soloVinculados(); return; }
  if(t.id === 'btnVerInactivos'){ S.verInactivos = !S.verInactivos; ir('vendedores'); return; }
  if(t.id === 'btnImportar'){ importar(); return; }
  if(t.id === 'btnCancelarImp'){ S.importacion = null; renderImportar(''); return; }
  if(t.name === 'impModo' && S.importacion){ S.importacion.modo = t.value; S.importacion.confirmar = false; if($('impFecha')) S.importacion.fecha = $('impFecha').value; renderImportar(''); return; }
  if(t.closest('#dropzone') && t.id !== 'impArchivo'){ $('impArchivo').click(); return; }
});

content().addEventListener('change', e => {
  const t = e.target;
  const f = { fVendedor: 'vendedor', fEstado: 'estado', fPrioridad: 'prioridad', fSegmento: 'segmento', fOrden: 'orden' }[t.id];
  if(f){ S.filtros[f] = t.value; S.mostrar = POR_PAGINA; pintarLista(); return; }
  if(t.id === 'selMes'){ cambiarMes(t.value); return; }
  if(t.id === 'fbOrden'){ S.fb.orden = t.value; pintarFeedback(); return; }
  if(t.id === 'opVend'){ S.op.vendedor = t.value; S.op.mostrar = 30; S.op.espMostrar = 40; pintarOportunidades(); return; }
  if(t.id === 'prVend'){ S.pr.vendedor = t.value; pintarProspectos(); return; }
  if(t.matches('[data-pr-asignar]')){
    const card = t.closest('[data-prospecto]'), id = Number(card.dataset.prospecto), nuevo = t.value ? Number(t.value) : null;
    t.disabled = true;
    sb.from('comercial_clientes').update({ vendedor_id: nuevo, asignado_manual: !!nuevo }).eq('id', id).select('id').then(async ({ data, error }) => {
      if(error || !data || !data.length){ t.disabled = false; card.querySelector('.mc-err').textContent = 'No se pudo asignar: ' + (error ? error.message : 'sin permiso'); return; }
      await cargarProspectos(); pintarProspectos();
      toast(nuevo ? 'Asignado a ' + (S.vendedores.find(v => v.id === nuevo)?.nombre || 'el vendedor') : 'Pasó a la pileta');
    });
    return;
  }
  if(t.matches('[data-pr-etapa]') && t.value){
    const card = t.closest('[data-prospecto]'), id = Number(card.dataset.prospecto);
    if(t.value === 'perdido'){ S.pr.abierto = { id, modo: 'perdido' }; pintarProspectos(); const n = document.querySelector('#prLista [data-pr-motivo]'); if(n) n.focus(); return; }
    accionProspecto(card, 'comercial_prospecto_etapa', { p_cliente: id, p_etapa: t.value }, 'Pasó a ' + etapaNombre(t.value));
    return;
  }
  if(t.id === 'comVend'){ S.com.vendedor = t.value; S.com.mostrar = 60; pintarComodatos(); return; }
  if(t.id === 'selSemana'){ S.semana = t.value; ir('avance'); return; }
  if(t.id === 'ventasArchivo' && t.files[0]){ elegirVentas(t.files); return; }
  if(t.id === 'datosArchivo' && t.files[0]){ elegirDatos(t.files[0]); return; }
  if(S.impVentas && S.impVentas.filas){
    const im = S.impVentas;
    if(t.matches('[data-mapa]')){ if(t.value === '') delete im.mapa[t.dataset.mapa]; else im.mapa[t.dataset.mapa] = Number(t.value); im.asignacion = {}; renderVentas(''); return; }
    if(t.id === 'vCabecera'){ const n = Math.round(Number(t.value)); if(n >= 1 && n <= im.filas.length){ im.cabecera = n - 1; im.mapa = mapearVentas(im.filas[im.cabecera]); im.asignacion = {}; } renderVentas(''); return; }
    if(t.id === 'vFecha'){ im.fecha = t.value || hoyISO(); renderVentas(''); return; }
    if(t.name === 'vModo'){ im.modo = t.value; renderVentas(''); return; }
    if(t.matches('[data-asignar]')){ im.asignacion[t.dataset.asignar] = t.value; return; }
  }
  if(t.matches('[data-reasignar]')){ reasignar(t); return; }
  if(t.matches('[data-estado]')){ t.closest('tr').querySelector('[data-guardar]').disabled = false; return; }
  if(t.matches('[data-v-usuario], [data-v-activo], [data-v-esvend]')){ t.closest('tr').querySelector('[data-v-guardar]').disabled = false; return; }
  if(t.id === 'impArchivo' && t.files[0]){ elegirArchivo(t.files[0]); return; }
  if(t.id === 'impFecha' && S.importacion){ S.importacion.fecha = t.value; }
});

let esperaBusqueda = null;
content().addEventListener('submit', e => {
  if(e.target.id === 'ndForm'){ e.preventDefault(); guardarNuevoDato(); }
  if(e.target.id === 'fbForm'){ e.preventDefault(); enviarFeedback(); }
});
$('session').addEventListener('click', e => { if(e.target.closest('[data-tab="feedback"]')){ ir('feedback'); window.scrollTo(0, 0); } });
content().addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'mcQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.mc.q = t.value; S.mc.mostrar = 30; S.mc.abierto = null; pintarMisClientes(); }, 200); return; }
  if(t.id === 'opQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.op.q = t.value; S.op.mostrar = 30; pintarOportunidades(); const i = $('opQ'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); return; }
  if(t.id === 'espQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.op.espQ = t.value; S.op.espMostrar = 40; pintarOportunidades(); const i = $('espQ'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); return; }
  if(t.id === 'prQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.pr.q = t.value; pintarProspectos(); const i = $('prQ'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); return; }
  if(t.id === 'comQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.com.q = t.value; S.com.mostrar = 60; pintarComodatos(); }, 200); return; }
  if(t.matches('[data-cod-desc]')){ t.closest('tr').querySelector('[data-cod-guardar]').disabled = false; return; }
  if(t.closest('.com-det') && t.matches('[data-com-cant]')){ t.closest('tr').querySelector('[data-com-guardar-adm]').disabled = false; return; }
  if(t.id === 'pilQ'){ clearTimeout(esperaBusqueda); esperaBusqueda = setTimeout(() => { S.pil.q = t.value.trim(); cargarPileta(false); }, 350); return; }
  if(t.id === 'fQ'){
    clearTimeout(esperaBusqueda);
    esperaBusqueda = setTimeout(() => { S.filtros.q = t.value; S.mostrar = POR_PAGINA; pintarLista(); }, 200);
    return;
  }
  if(t.matches('[data-comentario]')){ t.closest('tr').querySelector('[data-guardar]').disabled = false; return; }
  if(t.closest('#miSemana') && (t.matches('[data-act]') || t.id === 'mvNota')){ programarGuardado(); return; }
  if(t.matches('[data-v-nombre], [data-v-email]')){ t.closest('tr').querySelector('[data-v-guardar]').disabled = false; }
});
content().addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[data-comentario]')){
    const b = e.target.closest('tr').querySelector('[data-guardar]');
    if(!b.disabled) guardarGestion(e.target.closest('tr'));
  }
});
content().addEventListener('dragover', e => { const d = e.target.closest('.dropzone'); if(d){ e.preventDefault(); d.classList.add('dragging'); } });
content().addEventListener('dragleave', e => { const d = e.target.closest('.dropzone'); if(d) d.classList.remove('dragging'); });
content().addEventListener('drop', e => {
  const d = e.target.closest('.dropzone');
  if(!d) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f && d.id === 'dropVentas'){ elegirVentas(e.dataTransfer.files); return; }
  if(f) (d.id === 'dropVentas' ? elegirVentas : (d.id === 'dropDatos' ? elegirDatos : elegirArchivo))(f);
});

$('btnSalir').onclick = async () => { await sb.auth.signOut(); renderLogin(); };

// ====== ARRANQUE ======
// El logo vive embebido en la página principal del Hub: se toma de ahí para no duplicarlo.
fetch('./').then(r => r.ok ? r.text() : '').then(t => {
  const m = t.match(/<img src="(data:image\/[^"]+)"/);
  if(m){ $('logo').src = m[1]; $('logo').classList.remove('hidden'); }
}).catch(() => {});

sb.auth.getSession().then(({ data }) => {
  if(data.session) iniciar(data.session);
  else renderLogin();
});
})();
</script>
</body>
</html>
