<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de CV con IA — Segulimp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#182A38; --ink-soft:#4C6070;
    --paper:#EAF2F7; --paper-2:#D3E3EC; --card:#FFFFFF;
    --rust:#245B84; --rust-dark:#163C58;
    --olive:#245B84; --amber:#D89B2E;
    --line:#C7D8E2;
    --good:#3F8F5D; --mid:#D89B2E; --low:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:28px 20px 60px;}
  .brand{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; border-bottom:2px solid var(--ink); padding-bottom:10px;}
  .brand .name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase;}
  .brand .tag{font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:32px 28px; box-shadow:0 2px 10px rgba(22,60,88,0.06);}
  .eyebrow{font-family:'Inter',sans-serif; font-size:12px; color:var(--rust-dark); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;}
  h1{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:36px; line-height:1.05; margin:0 0 8px;}
  h2{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:22px; margin:0 0 4px; text-transform:uppercase;}
  p.desc{color:var(--ink-soft); line-height:1.55; font-size:15px; margin:0 0 20px;}
  label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px;}
  input[type=text]{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; font-family:'Inter',sans-serif; font-size:15px; color:var(--ink);}
  textarea{
    width:100%; min-height:260px; padding:14px; border:1px solid var(--line); border-radius:6px;
    background:#fff; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); resize:vertical; line-height:1.5;
  }
  input:focus, textarea:focus{outline:2px solid var(--rust); outline-offset:1px;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:6px;}
  button{font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:12px 22px; border-radius:6px; border:none; cursor:pointer;}
  .btn-primary{background:var(--rust); color:#fff;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-primary:disabled{background:var(--paper-2); color:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:22px;}
  .results-actions{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap;}

  .loading{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:14px; margin-top:18px;}
  .spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--paper-2); border-top-color:var(--rust); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{background:#FBEAE4; border:1px solid var(--low); color:var(--rust-dark); padding:14px 16px; border-radius:6px; font-size:14px; margin-top:16px;}

  .score-header{display:flex; gap:26px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
  .tier{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; text-transform:uppercase; margin:0 0 6px;}
  .tier.alto{color:var(--good);}
  .tier.medio{color:var(--mid);}
  .tier.bajo{color:var(--low);}
  .score-num{font-family:'Inter',sans-serif; font-size:14px; color:var(--ink-soft);}
  .cand-meta{font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft); margin-bottom:16px; display:flex; gap:18px; flex-wrap:wrap;}

  .breakdown{list-style:none; margin:0 0 6px; padding:0;}
  .breakdown li{padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .breakdown li:last-child{border-bottom:none;}
  .crit-row{display:grid; grid-template-columns:1fr 100px 34px; align-items:center; gap:12px;}
  .bar-bg{background:var(--paper-2); border-radius:2px; height:8px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; background:var(--olive); border-radius:2px;}
  .breakdown .val{font-family:'Inter',sans-serif; text-align:right; color:var(--ink-soft);}
  .crit-justif{margin:5px 0 0; font-size:12.5px; color:var(--ink-soft); line-height:1.45; grid-column:1 / -1;}
  .breakdown-corte .bar-bg::after{
    content:''; position:absolute; top:-2px; bottom:-2px; left:var(--corte-pct);
    width:2px; background:var(--rust-dark);
  }
  .corte-nota{font-size:11.5px; color:var(--ink-soft); margin:0 0 18px; font-style:italic;}


  .block-title{font-family:'Inter',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:20px 0 8px;}
  .list-plain{margin:0 0 4px; padding-left:18px; font-size:14px; line-height:1.6;}
  .list-plain.flags li{color:var(--rust-dark);}
  .summary-text{font-size:14.5px; line-height:1.6; color:var(--ink);}

  @media print{
    body{background:#fff;}
    .results-actions, .brand .tag{display:none;}
    .card{border:none; padding:0;}
  }
  @media (max-width:480px){
    h1{font-size:28px;}
    .card{padding:24px 18px;}
    .breakdown li{grid-template-columns:1fr 70px 30px;}
  }
</style>
</head>

<script>
const RUBRICA = [
  { key: "experiencia_b2b", label: "Experiencia en ventas B2B / industrial" },
  { key: "afinidad_rubro", label: "Afinidad con limpieza industrial / insumos afines" },
  { key: "manejo_zona", label: "Manejo de zona extensa y movilidad" },
  { key: "herramientas", label: "Uso de CRM / herramientas digitales / reportes" },
  { key: "estabilidad", label: "Estabilidad laboral y progresión" },
  { key: "resultados", label: "Orientación a resultados (logros medibles)" }
];

const SUPABASE_URL = "https://xiamarozmaqixwfiwshp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYW1hcm96bWFxaXh3Zml3c2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTcwNjMsImV4cCI6MjEwMzQ5MzA2M30.dIWX6AQbJEM6lgJ2AsdIPW9h1lOhc9ivaTkqjZqTumw";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { nombre: "", puestoId: null, cvTexto: "", loading: false, error: null, resultado: null };
let puestosDisponibles = [];

async function cargarPuestos(){
  const { data, error } = await supabase.from('puestos').select('*').eq('activo', true).order('nombre');
  if(!error && data && data.length){
    puestosDisponibles = data;
    state.puestoId = data[0].id;
  }
  render();
}

function render(){
  const app = document.getElementById('app');
  if(state.resultado){ renderResultado(app); return; }
  app.innerHTML = `
    <div class="eyebrow">Screening de CV</div>
    <h1>Evaluación de CV con IA</h1>
    <p class="desc">Pegá el texto del CV del candidato (podés copiarlo del PDF o Word). La IA lo va a evaluar
    contra el perfil buscado y va a devolver un puntaje por criterio, fortalezas, alertas y una recomendación
    sobre si avanza al test situacional.</p>
    <label for="puesto">Puesto</label>
    <select id="puesto">
      ${puestosDisponibles.map(p => `<option value="${p.id}" ${p.id === state.puestoId ? 'selected' : ''}>${p.nombre}</option>`).join('')}
    </select>
    <label for="nombre">Nombre del candidato</label>
    <input type="text" id="nombre" placeholder="Ej: Juan Gómez" value="${state.nombre}">
    <label for="cvTexto">Texto del CV</label>
    <textarea id="cvTexto" placeholder="Pegá acá el contenido del CV...">${state.cvTexto}</textarea>
    <div class="hint">Cuanto más completo el CV (experiencia, rubros, herramientas usadas, logros), más precisa la evaluación.</div>
    ${state.error ? `<div class="error-box">${state.error}</div>` : ""}
    <div class="nav">
      <span></span>
      <button class="btn-primary" id="btn-eval" ${state.loading ? 'disabled' : ''}>
        ${state.loading ? 'Evaluando…' : 'Evaluar CV con IA →'}
      </button>
    </div>
    ${state.loading ? `<div class="loading"><div class="spinner"></div>Analizando el CV…</div>` : ""}
  `;
  document.getElementById('puesto').onchange = (e) => state.puestoId = e.target.value;
  document.getElementById('nombre').oninput = (e) => state.nombre = e.target.value;
  document.getElementById('cvTexto').oninput = (e) => state.cvTexto = e.target.value;
  document.getElementById('btn-eval').onclick = evaluarCV;
}

async function evaluarCV(){
  const nombre = document.getElementById('nombre').value.trim();
  const cvTexto = document.getElementById('cvTexto').value.trim();
  state.nombre = nombre;
  state.cvTexto = cvTexto;
  state.error = null;

  if(!cvTexto || cvTexto.length < 30){
    state.error = "Pegá el texto del CV antes de evaluar (parece muy corto o vacío).";
    render();
    return;
  }

  state.loading = true;
  render();

const CORTE_AVANZA = 16; // puntaje mínimo sobre 30 para avanzar a test situacional

const systemPrompt = `Sos un evaluador de recursos humanos para Segulimp, una distribuidora B2B de productos
de limpieza industrial en Neuquén, Argentina. Buscan cubrir puestos de vendedor comercial para atender
una cartera de clientes empresariales, con capacidad de cubrir zonas extensas (incluyendo la zona de
Vaca Muerta, en crecimiento por actividad petrolera, obra pública y aumento poblacional). El perfil ideal
prioriza rentabilidad (margen) sobre solo volumen, es autónomo en el manejo de su zona y cartera, y con
el tiempo va a tener que usar un CRM.

Evaluá el CV que te va a pasar el usuario contra estos 6 criterios, en una escala de 0 a 5 cada uno
(0 = sin evidencia / no aplica, 5 = evidencia fuerte y directa):
1. experiencia_b2b: experiencia en ventas B2B o industriales (no minorista/consumo masivo).
2. afinidad_rubro: experiencia o cercanía con limpieza industrial, insumos, ferretería industrial o rubros afines.
3. manejo_zona: evidencia de manejo de zonas geográficas extensas, movilidad propia, carnet de conducir, disponibilidad para viajar.
4. herramientas: uso de CRM, planillas de gestión, reportes de venta, herramientas digitales.
5. estabilidad: estabilidad laboral y progresión de carrera (evitar saltos laborales muy frecuentes sin explicación).
6. resultados: logros cuantificables (crecimiento de cartera, cumplimiento de objetivos, métricas de venta).

Para CADA criterio, además del puntaje, escribí una justificación de una oración que cite el dato concreto
del CV en el que te basaste (o que aclare explícitamente que no hay evidencia, si el puntaje es 0-1).
Esa justificación es lo que va a leer un reclutador para entender el "por qué" del número, así que tiene
que ser específica al CV, no genérica.

También extraé, si figuran en el CV, el teléfono y el email de contacto del candidato (si no figuran, usá null).

El corte para avanzar a la siguiente etapa (test situacional) es ${CORTE_AVANZA} puntos sobre 30.

Respondé EXCLUSIVAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, con esta forma exacta:
{
  "scores": { "experiencia_b2b": 0-5, "afinidad_rubro": 0-5, "manejo_zona": 0-5, "herramientas": 0-5, "estabilidad": 0-5, "resultados": 0-5 },
  "justificaciones": { "experiencia_b2b": "string", "afinidad_rubro": "string", "manejo_zona": "string", "herramientas": "string", "estabilidad": "string", "resultados": "string" },
  "fortalezas": ["string", "string"],
  "alertas": ["string", "string"],
  "resumen": "string de 2-3 oraciones resumiendo el perfil y por qué el puntaje total queda donde queda",
  "contacto": { "telefono": "string o null", "email": "string o null" },
  "recomendacion": "avanza" | "revisar" | "no_avanza"
}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [
          { role: "user", content: `CV del candidato:\n\n${cvTexto}` }
        ]
      })
    });

    if(!response.ok){
      throw new Error("La API respondió con un error (" + response.status + ").");
    }

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    const clean = textBlocks.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    state.resultado = parsed;
    state.loading = false;
    render();
  } catch(err){
    console.error(err);
    state.loading = false;
    state.error = "No se pudo completar la evaluación. Revisá el texto pegado e intentá de nuevo.";
    render();
  }
}

async function enviarResultadoCV(total, rec, resumen, contacto){
  const tierTexto = rec === "avanza" ? "Avanza a test" : rec === "revisar" ? "Revisar" : "No avanza";
  const nombreBuscado = state.nombre.trim();

  try{
    const { data: existentes } = await supabase
      .from('candidatos')
      .select('id')
      .ilike('nombre', nombreBuscado)
      .eq('puesto_id', state.puestoId)
      .limit(1);

    if(existentes && existentes.length){
      await supabase.from('candidatos').update({
        puntaje_cv: total,
        tier_cv: tierTexto,
        motivo_cv: resumen || "",
        telefono: (contacto && contacto.telefono) || null,
        email: (contacto && contacto.email) || null
      }).eq('id', existentes[0].id);
    } else {
      await supabase.from('candidatos').insert({
        puesto_id: state.puestoId,
        nombre: nombreBuscado,
        telefono: (contacto && contacto.telefono) || null,
        email: (contacto && contacto.email) || null,
        puntaje_cv: total,
        tier_cv: tierTexto,
        motivo_cv: resumen || "",
        etapa: 'CV evaluado'
      });
    }
  } catch(err){
    console.error("No se pudo guardar el resultado en Supabase:", err);
  }
}

function tierInfo(rec){
  if(rec === "avanza") return { label: "Avanza a test situacional", cls: "alto" };
  if(rec === "revisar") return { label: "Revisar manualmente", cls: "medio" };
  return { label: "No avanza", cls: "bajo" };
}

function renderResultado(app){
  const r = state.resultado;
  const scores = r.scores || {};
  const justif = r.justificaciones || {};
  const contacto = r.contacto || {};
  const total = RUBRICA.reduce((s, c) => s + (scores[c.key] || 0), 0);
  const max = RUBRICA.length * 5;
  const tier = tierInfo(r.recomendacion);
  const cortePct = (CORTE_AVANZA / max) * 100;

  enviarResultadoCV(total, r.recomendacion, r.resumen, contacto);

  app.innerHTML = `
    <div class="eyebrow">Resultado de screening</div>
    <h2 style="margin-bottom:2px;">Evaluación de CV</h2>
    <div class="cand-meta">
      <span>Candidato: ${state.nombre || "—"}</span>
      <span>Fecha: ${new Date().toLocaleDateString('es-AR')}</span>
      ${contacto.telefono ? `<span>Tel: ${contacto.telefono}</span>` : ''}
    </div>
    <div class="score-header">
      <div>
        <div class="tier ${tier.cls}">${tier.label}</div>
        <div class="score-num">${total} / ${max} puntos · corte para avanzar: ${CORTE_AVANZA}/${max}</div>
      </div>
    </div>
    <ul class="breakdown breakdown-corte" style="--corte-pct:${cortePct}%">
      ${RUBRICA.map(c => {
        const v = scores[c.key] || 0;
        return `<li>
          <div class="crit-row">
            <span>${c.label}</span>
            <span class="bar-bg"><span class="bar-fill" style="width:${(v/5)*100}%"></span></span>
            <span class="val">${v}/5</span>
          </div>
          <p class="crit-justif">${justif[c.key] || ''}</p>
        </li>`;
      }).join('')}
    </ul>
    <div class="corte-nota">La barra vertical marca el corte de ${CORTE_AVANZA}/${max} puntos para pasar a la etapa de test situacional.</div>
    <div class="block-title">Resumen</div>
    <p class="summary-text">${r.resumen || ""}</p>
    <div class="block-title">Fortalezas</div>
    <ul class="list-plain">${(r.fortalezas || []).map(f => `<li>${f}</li>`).join('')}</ul>
    <div class="block-title">Alertas</div>
    <ul class="list-plain flags">${(r.alertas || []).map(f => `<li>${f}</li>`).join('')}</ul>
    <div class="results-actions">
      <button class="btn-ghost" id="btn-back">← Evaluar otro CV</button>
      <button class="btn-primary" id="btn-print">Imprimir / Guardar como PDF</button>
    </div>
  `;
  document.getElementById('btn-back').onclick = () => {
    const puestoPrevio = state.puestoId;
    state = { nombre:"", puestoId: puestoPrevio, cvTexto:"", loading:false, error:null, resultado:null };
    render();
  };
  document.getElementById('btn-print').onclick = () => window.print();
}

cargarPuestos();
</script>
